name: Encrypted staging backup
on:
  workflow_dispatch:
    inputs:
      export_encrypted_rehearsal:
        description: 'Keep an encrypted-only recovery package for one day for a local restore test'
        type: boolean
        default: false
      exercise_monitor_failure:
        description: 'Send one synthetic failure before the real backup to verify operator alerts and recovery'
        type: boolean
        default: false
      verify_bucket_protection:
        description: 'Verify the configured R2 overwrite/deletion lock using one new non-personal probe object'
        type: boolean
        default: false
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
concurrency:
  group: staging-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main' && github.repository == 'nahrplatform-rgb/academyos-web'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging-backups
    env:
      BACKUP_MONITOR_URL: ${{ secrets.BACKUP_MONITOR_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Controlled monitor failure rehearsal
        if: inputs.exercise_monitor_failure
        run: |
          python3 scripts/backups/monitor.py in_progress --controlled-probe
          python3 scripts/backups/monitor.py error --controlled-probe
      - name: Start independent backup monitoring
        id: monitor_start
        continue-on-error: true
        run: python3 scripts/backups/monitor.py in_progress
      - name: Install backup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          python3 -m venv "$RUNNER_TEMP/backup-tools"
          "$RUNNER_TEMP/backup-tools/bin/pip" install --require-hashes --requirement scripts/backups/requirements.txt
      - name: Export, encrypt and verify independent copy
        env:
          BACKUP_DATABASE_PASSWORD: ${{ secrets.BACKUP_DATABASE_PASSWORD }}
          BACKUP_DATABASE_HOST: ${{ vars.BACKUP_DATABASE_HOST }}
          BACKUP_SUPABASE_SECRET_KEY: ${{ secrets.BACKUP_SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          EXPORT_REHEARSAL: ${{ inputs.export_encrypted_rehearsal }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          if [ "$EXPORT_REHEARSAL" = true ]; then
            "$RUNNER_TEMP/backup-tools/bin/python" scripts/backups/backup.py create --receipt "$RUNNER_TEMP/backup-receipt.json" --recovery-package "$RUNNER_TEMP/encrypted-rehearsal"
          else
            "$RUNNER_TEMP/backup-tools/bin/python" scripts/backups/backup.py create --receipt "$RUNNER_TEMP/backup-receipt.json"
          fi
      - name: Verify R2 deletion and overwrite protection
        if: inputs.verify_bucket_protection
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: '"$RUNNER_TEMP/backup-tools/bin/python" scripts/backups/verify_r2_protection.py >> "$GITHUB_STEP_SUMMARY"'
      - name: Record non-sensitive result
        run: |
          printf 'Encrypted staging backup uploaded and downloaded with matching SHA-256. A restore rehearsal is a separate check.\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/backup-receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Temporary encrypted-only rehearsal package
        if: inputs.export_encrypted_rehearsal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-staging-rehearsal
          path: ${{ runner.temp }}/encrypted-rehearsal/
          retention-days: 1
          if-no-files-found: error
      - name: Finish independent backup monitoring
        if: always()
        env:
          BACKUP_JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$BACKUP_JOB_STATUS" = success ]; then
            python3 scripts/backups/monitor.py ok --receipt "$RUNNER_TEMP/backup-receipt.json"
          else
            python3 scripts/backups/monitor.py error
          fi
          if [ "${{ steps.monitor_start.outcome }}" != success ]; then
            printf 'Backup export was attempted, but monitor start failed; inspect both receipts.\n' >&2
            exit 1
          fi
