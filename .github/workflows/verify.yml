name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Verify backup safety with pinned runtime dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/backup-tests"
          "$RUNNER_TEMP/backup-tests/bin/pip" install --require-hashes --requirement scripts/backups/requirements.txt
          "$RUNNER_TEMP/backup-tests/bin/python" -m unittest discover -s scripts/backups -v
      - run: npx playwright install --with-deps chromium
      - name: Verify onboarding API budgets before provider calls
        run: node scripts/onboarding/test_api_budget.mjs
      - name: Verify synthetic onboarding UI interaction and recovery
        run: |
          node scripts/onboarding/test_ui.mjs
          UI_REACT_MODE=development node scripts/onboarding/test_ui.mjs
      - name: Verify scoped player API validation and fail-closed budgets
        run: node scripts/people/test_api.mjs
      - name: Verify player registration UI and interrupted-save recovery
        run: |
          node scripts/people/test_ui.mjs
          UI_REACT_MODE=development node scripts/people/test_ui.mjs
      - name: Verify guardian validation, recipient gate and fail-closed budgets
        run: |
          node scripts/guardians/test_api.mjs
          node scripts/guardians/test_delivery.mjs
      - name: Verify guardian appointment UI and recovery
        run: |
          node scripts/guardians/test_ui.mjs
          UI_REACT_MODE=development node scripts/guardians/test_ui.mjs
      - run: npm run test:e2e
