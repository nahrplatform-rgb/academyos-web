<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>AcademyOS · M1 design review</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#1c3034;background:#f5f7f7;font:16px/1.6 Arial,Tahoma,sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button,a,input,select{outline-offset:4px} :focus-visible{outline:3px solid #146b61}button{min-height:44px;border:1px solid #52676d;background:white;color:#1c3034;padding:9px 17px;border-radius:10px}button.primary{background:#146b61;border-color:#146b61;color:#fff}button:disabled{cursor:wait;opacity:.65}a{color:#146b61}h1{font-size:clamp(26px,3vw,36px);line-height:1.25;letter-spacing:-1px;margin:8px 0 16px}h2{font-size:21px;line-height:1.4;margin:0 0 12px}p{margin:0 0 16px}small,.muted{color:#52676d}small{display:block}.review{padding:12px 24px;background:#fff4e3;color:#70400c;border-bottom:1px solid #d4bc95}.controls{padding:16px 24px;display:flex;flex-wrap:wrap;align-items:end;gap:12px;background:#fff;border-bottom:1px solid #dfe7e6}.controls label{font-size:13px;display:grid;gap:4px}.controls select{min-height:44px;padding:8px;max-width:100%;border:1px solid #52676d;border-radius:8px}.shell{display:grid;grid-template-columns:238px minmax(0,1fr);max-width:1440px;margin:auto;min-height:75vh}aside{padding:30px 24px;background:#eef2f1;border-inline-end:1px solid #dfe7e6}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:bold;margin-bottom:32px}.mark{width:38px;height:38px;background:#146b61;color:#fff;display:grid;place-items:center;border-radius:12px}nav{display:grid;gap:10px}nav button{text-align:start;border-color:transparent;background:transparent}nav button[aria-current=page]{background:#dfece5;font-weight:bold}.context{margin-top:28px;font-size:14px;overflow-wrap:anywhere}.main{min-width:0}header{min-height:78px;padding:18px 32px;background:white;border-bottom:1px solid #dfe7e6;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}main{max-width:900px;padding:32px;margin:0 auto}.eyebrow{font-size:12px;font-weight:bold;letter-spacing:1.4px;color:#52676d}.card{background:#fff;padding:28px;border:1px solid #dfe7e6;border-radius:18px;margin:20px 0}.badge{font-size:13px;color:#146b61;background:#e5f1eb;border:1px solid #a5c5b5;border-radius:20px;padding:3px 12px}.warning{background:#fff4e3;border:1px solid #d4bc95;color:#70400c;border-radius:12px;padding:16px;margin:16px 0}.error{background:#fff0ed;border:1px solid #b65b49;color:#7d271d;border-radius:12px;padding:16px;margin:16px 0}.status{background:#e5f1eb;border:1px solid #a5c5b5;padding:16px;border-radius:12px;margin:16px 0}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}form label{font-weight:bold;display:block;margin:20px 0 5px}input{min-height:46px;width:100%;border:1px solid #52676d;border-radius:8px;padding:10px;background:#fff;color:#1c3034}input[dir=ltr]{text-align:left}dl{display:grid;grid-template-columns:minmax(100px,1fr) 2fr;gap:8px 20px}dt{color:#52676d}dd{margin:0;overflow-wrap:anywhere}li{margin-bottom:12px}.steps{display:flex;gap:8px;flex-wrap:wrap;padding:0;list-style:none;font-size:13px}.steps li{border-bottom:3px solid #dfe7e6;padding:8px 3px}.steps .done{border-color:#146b61}.skeleton{height:94px;background:#f1f4f3;border:1px solid #dfe7e6;border-radius:12px;margin:20px 0}.skip{position:absolute;inset-inline-start:20px;top:-80px;background:#fff;padding:12px}.skip:focus{top:8px;z-index:2}footer{font-size:13px;color:#52676d;margin-top:28px}[dir=rtl] h1,[dir=rtl] .eyebrow{letter-spacing:normal}body.phone .shell{display:block;max-width:430px;border-inline:1px solid #dfe7e6}body.phone aside{padding:16px 20px}body.phone aside .context{display:none}body.phone .brand{margin-bottom:12px}body.phone nav{grid-template-columns:1fr 1fr}body.phone main{padding:24px 16px}body.phone header{padding:16px}body.phone .card{padding:20px}body.phone dl{grid-template-columns:1fr}body.phone dd{margin-bottom:10px}@media(max-width:700px){.shell{display:block}aside{padding:16px 20px}.brand{margin-bottom:12px}nav{grid-template-columns:1fr 1fr}aside .context{display:none}main{padding:24px 16px}header{padding:16px}.card{padding:20px}.controls,.review{padding:12px 16px}dl{grid-template-columns:1fr}dd{margin-bottom:10px}.controls label{max-width:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<a class="skip" href="#main" id="skip">Skip to task</a>
<div class="review" id="review"></div>
<div class="controls" id="controls"></div>
<div class="shell"><aside><div class="brand"><span class="mark">A</span>AcademyOS</div><nav id="nav" aria-label="Prototype personas"></nav><div class="context" id="side"></div></aside><div class="main"><header id="header"></header><main id="main" tabindex="-1"></main></div></div>
<script>
'use strict';
const key='academyos-m1-synthetic-prototype-v1';
const fresh=()=>({created:false,delivery:'queued',accepted:false,branch:'',timezone:'',sportEn:'',sportAr:'',complete:false,version:0,name:'',email:''});
let saved=fresh();try{const x=JSON.parse(localStorage.getItem(key));if(x&&x.schema===1&&x.data&&typeof x.data==='object'){for(const k of Object.keys(saved)){if(typeof x.data[k]===typeof saved[k])saved[k]=x.data[k]}}}catch{}
let ar=false,persona='platform',screen=saved.created?'receipt':'create',scenario='normal',unknown=false,note='',draft={name:'Synthetic Academy A',email:'owner@academy.example',branch:'',timezone:'',sportEn:'',sportAr:''};
const t=(en,arabic)=>ar?arabic:en;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scenarios=[['normal','Ordinary path','المسار المعتاد'],['loading','Loading','جارٍ التحميل'],['unavailable','Read unavailable','تعذر تحميل البيانات'],['delivery','Delivery failure','تعذر إرسال الدعوة'],['wrong','Wrong recipient account','حساب مختلف عن المدعو'],['expired','Expired invitation','انتهت صلاحية الدعوة'],['revokedInvite','Revoked invitation','أُلغيت الدعوة'],['saving','Saving in progress','جارٍ الحفظ'],['unknown','Lost response after commit','انقطع الرد بعد الحفظ'],['conflict','Stale setup edit','تعارض تعديلات الإعداد'],['revoked','Revoked membership','أُلغيت العضوية'],['failed','Save failure','تعذر الحفظ']];
function button(id,en,arabic,primary=false){return `<button type="button" id="${id}" class="${primary?'primary':''}">${t(en,arabic)}</button>`}
function persist(){try{localStorage.setItem(key,JSON.stringify({schema:1,data:saved}));return true}catch{note=t('Browser storage unavailable. Simulation works in this tab only; refresh will not resume.','التخزين في المتصفح غير متاح. تعمل المحاكاة في علامة التبويب الحالية فقط.');return false}}
function action(id,fn){const el=document.getElementById(id);if(el)el.onclick=()=>{fn();render(true)}}
function field(id,en,arabic,value,type='text',extra=''){return `<label for="${id}">${t(en,arabic)}</label><input id="${id}" name="${id}" type="${type}" value="${esc(value)}" required maxlength="160" ${extra}>`}
function receipt(){return `<dl><dt>${t('Academy','الأكاديمية')}</dt><dd>${esc(saved.name)}</dd><dt>${t('Owner appointment','تعيين المالك')}</dt><dd>${t(saved.accepted?'Accepted':'Pending acceptance',saved.accepted?'تم القبول':'بانتظار القبول')}</dd><dt>${t('Email delivery','إرسال البريد')}</dt><dd>${saved.delivery==='accepted'?t('Provider accepted (simulated); inbox unverified','قبل المزود الرسالة (محاكاة)؛ الوصول غير مؤكد'):saved.delivery==='failed'?t('Failed — academy remains saved','تعذر الإرسال — الأكاديمية محفوظة'):t('Queued — not yet sent','في قائمة الانتظار — لم تُرسل بعد')}</dd><dt>${t('Reference','المرجع')}</dt><dd><bdi dir="ltr">M1-SIM-001</bdi></dd></dl>`}
function statePanel(){
 if(unknown)return `<section class="warning" role="status"><h2>${t('The response was interrupted','انقطع الرد')}</h2><p>${t('The original operation may have committed. Check it before sending another request.','قد تكون العملية الأصلية قد اكتملت. تحقق منها قبل إرسال طلب آخر.')}</p>${button('reconcile','Check original operation','التحقق من العملية الأصلية',true)}</section>`;
 if(scenario==='loading')return `<section aria-busy="true"><h2>${t('Checking current access and saved progress','جارٍ التحقق من الصلاحيات والتقدم المحفوظ')}</h2><div class="skeleton" aria-hidden="true"></div><p role="status">${t('A loading state is not an empty academy.','حالة التحميل لا تعني أن الأكاديمية فارغة.')}</p>${button('recover','Finish simulated loading','إنهاء محاكاة التحميل')}</section>`;
 if(scenario==='unavailable')return `<section class="error" role="alert"><h2>${t('Saved information could not be checked','تعذر التحقق من المعلومات المحفوظة')}</h2><p>${t('Do not treat this as no membership or no saved work.','لا تعني هذه الحالة عدم وجود عضوية أو عمل محفوظ.')}</p>${button('recover','Retry read','إعادة محاولة التحميل',true)}</section>`;
 if(scenario==='revoked'&&persona==='owner'&&screen!=='contexts')return `<section class="warning" role="alert"><h2>${t('Your academy access has changed','تغيرت صلاحياتك في الأكاديمية')}</h2><p>${t('Setup actions are unavailable. Return to your currently permitted contexts; the old draft cannot be submitted elsewhere.','إجراءات الإعداد غير متاحة. ارجع إلى المساحات المصرح بها حالياً؛ لا يمكن إرسال المسودة القديمة إلى أكاديمية أخرى.')}</p>${button('contexts','Choose another context','اختيار مساحة أخرى')}</section>`;
 if(scenario==='saving')return `<section class="status" aria-busy="true"><h2>${t('Saving… awaiting confirmation','جارٍ الحفظ… بانتظار التأكيد')}</h2><p role="status">${t('The save button is unavailable until the result is known.','زر الحفظ غير متاح حتى تتضح النتيجة.')}</p><button disabled>${t('Saving…','جارٍ الحفظ…')}</button>${button('recover','Return to editable simulation','العودة إلى المحاكاة القابلة للتعديل')}</section>`;
 return '';
}
function render(focus=false){
 document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';
 document.getElementById('skip').textContent=t('Skip to task','الانتقال إلى المهمة');
 document.getElementById('review').textContent=t('DESIGN PROTOTYPE · All outcomes are simulated. No accounts, emails or database records are created. Policy and design approved for implementation on 22 October 2026; working product acceptance is pending. Use synthetic data only.','نموذج لمراجعة التصميم · جميع النتائج محاكاة. لا تُنشأ حسابات أو رسائل بريد أو سجلات قاعدة بيانات. اعتُمدت السياسات والتصميم للتنفيذ في ٢٢ أكتوبر ٢٠٢٦؛ قبول المنتج العامل لا يزال معلقاً. استخدم بيانات اختبار فقط.');
 document.getElementById('controls').innerHTML=`${button('language',ar?'English':'العربية',ar?'English':'العربية')}<label>${t('Review scenario','حالة المراجعة')}<select id="scenario">${scenarios.map(([id,en,arabic])=>`<option value="${id}" ${id===scenario?'selected':''}>${t(en,arabic)}</option>`).join('')}</select></label>${button('phone','Phone','هاتف')}${button('desktop','Desktop','حاسوب')}${button('reset','Reset simulation','إعادة ضبط المحاكاة')}`;
 document.getElementById('nav').innerHTML=`<button id="platform" ${persona==='platform'?'aria-current="page"':''}>${t('Platform Owner view','عرض مالك المنصة')}</button><button id="owner" ${persona==='owner'?'aria-current="page"':''}>${t('Invited Owner view','عرض المالك المدعو')}</button>`;
 document.getElementById('nav').setAttribute('aria-label',t('Prototype personas','شخصيات المحاكاة'));
 document.getElementById('side').innerHTML=`<p>${t('Separate platform and academy authority. This persona switch exists only for design review.','صلاحيات المنصة والأكاديمية منفصلة. تبديل الشخصية متاح هنا لمراجعة التصميم فقط.')}</p><small>${t('Proposed: invite-led admission, one initial owner, setup-only workspace.','مقترح: قبول بالدعوة، مالك أول واحد، ومساحة للإعداد فقط.')}</small>`;
 document.getElementById('header').innerHTML=`<span class="badge">${t('Synthetic staging design','تصميم تجريبي ببيانات اختبار')}</span><span>${persona==='platform'?t('Platform / Admission','المنصة / القبول'):t('Academy Owner / Setup only','مالك الأكاديمية / الإعداد فقط')}</span>`;
 let content=statePanel();
 if(!content&&persona==='platform'){
  if(screen==='create'||(!saved.created&&screen!=='review'))content=`<p class="eyebrow">${t('PLATFORM · ACADEMY ADMISSION','المنصة · قبول الأكاديمية')}</p><h1>${t('Create a synthetic academy','إنشاء أكاديمية اختبار')}</h1><p class="muted">${t('The academy will wait for its intended owner to accept. Creation grants no tenant access to the Platform Owner.','ستنتظر الأكاديمية قبول المالك المقصود. الإنشاء لا يمنح مالك المنصة صلاحية الدخول إلى بيانات الأكاديمية.')}</p><div class="card"><h2>${t('First academy','الأكاديمية الأولى')}</h2><form id="createForm">${field('name','Academy name','اسم الأكاديمية',draft.name)}${field('email','Invited owner email (synthetic .example only)','بريد المالك المدعو (اختباري بنطاق .example فقط)',draft.email,'email','dir="ltr" pattern="[^@]+@[^@]+\\.example"')}<small>${t('No invitation is sent from this prototype.','لا يرسل هذا النموذج أي دعوة.')}</small><div class="actions"><button class="primary" type="submit">${t('Review academy and appointment','مراجعة الأكاديمية والتعيين')}</button></div></form></div>`;
  else if(screen==='review')content=`<h1>${t('Review the appointment','مراجعة التعيين')}</h1><div class="card"><dl><dt>${t('Academy','الأكاديمية')}</dt><dd>${esc(draft.name)}</dd><dt>${t('Intended owner','المالك المقصود')}</dt><dd><bdi dir="ltr">${esc(draft.email)}</bdi></dd><dt>${t('Authority on acceptance','الصلاحية عند القبول')}</dt><dd>${t('Academy-wide initial setup; no platform authority','إعداد الأكاديمية بجميع فروعها؛ دون صلاحيات المنصة')}</dd></dl><p class="warning">${t('Proposed invitation validity: 72 hours. Setup completion does not activate paid or operational modules.','صلاحية الدعوة المقترحة: ٧٢ ساعة. إكمال الإعداد لا يفعّل الوحدات المدفوعة أو التشغيلية.')}</p><div class="actions">${button('editCreate','Edit','تعديل')}${button('create','Create and prepare invitation','إنشاء وتجهيز الدعوة',true)}</div></div>`;
  else content=`<h1>${t('Academy saved; owner handoff pending','حُفظت الأكاديمية؛ بانتظار المالك')}</h1><div class="card">${receipt()}<p class="muted">${t('Creation and delivery are separate outcomes. Retry only the pending delivery.','الإنشاء وإرسال الدعوة نتيجتان منفصلتان. أعد محاولة الإرسال المعلق فقط.')}</p><div class="actions">${button('deliver',saved.delivery==='failed'?'Retry invitation delivery':'Simulate provider acceptance',saved.delivery==='failed'?'إعادة محاولة إرسال الدعوة':'محاكاة قبول المزود')}${button('recipient','Open recipient handoff','فتح مسار المستلم',true)}</div></div>`;
 }
 if(!content&&persona==='owner'){
  if(!saved.created)content=`<h1>${t('No active academy membership','لا توجد عضوية أكاديمية نشطة')}</h1><div class="card"><p>${t('Signing in does not grant academy access. A valid appointment must be accepted first.','تسجيل الدخول لا يمنح صلاحية الأكاديمية. يجب قبول تعيين صالح أولاً.')}</p>${button('start','Review Platform Owner creation','مراجعة الإنشاء لدى مالك المنصة')}</div>`;
  else if(!saved.accepted){
   const blocked=['wrong','expired','revokedInvite'].includes(scenario);
   const msg=scenario==='wrong'?t('This signed-in account is not the intended recipient.','الحساب المسجل ليس حساب المستلم المقصود.'):scenario==='expired'?t('This invitation has expired. Ask the inviter to issue a new one.','انتهت صلاحية الدعوة. اطلب من المرسل إصدار دعوة جديدة.'):scenario==='revokedInvite'?t('This invitation is no longer available. Ask the inviter for help.','هذه الدعوة لم تعد متاحة. اطلب المساعدة من المرسل.'):'';
   content=`<h1>${t('Your academy appointment','دعوتك لإدارة الأكاديمية')}</h1><div class="card">${blocked?`<p class="warning" role="alert">${msg}</p>${button(scenario==='wrong'?'switchAccount':'reissue',scenario==='wrong'?'Simulate correct account':'Return to inviter review',scenario==='wrong'?'محاكاة الحساب الصحيح':'العودة إلى مراجعة المرسل',true)}`:`<dl><dt>${t('Academy','الأكاديمية')}</dt><dd>${esc(saved.name)}</dd><dt>${t('Appointment','التعيين')}</dt><dd>${t('Academy Owner · all academy branches','مالك الأكاديمية · جميع فروع الأكاديمية')}</dd><dt>${t('Verified account (simulated)','الحساب الموثق (محاكاة)')}</dt><dd><bdi dir="ltr">${esc(saved.email)}</bdi></dd></dl><p>${t('Review the academy and role before accepting. No account email will be changed.','راجع الأكاديمية والدور قبل القبول. لن يتغير بريد أي حساب.')}</p>${button('accept','Accept owner appointment','قبول تعيين المالك',true)}`}</div>`;
  }else if(screen==='contexts')content=`<h1>${t('Choose a permitted workspace','اختيار مساحة مصرح بها')}</h1><div class="card">${scenario==='revoked'?`<p>${t('No active contexts in this simulated revoked state. Request access review; no fallback academy is selected.','لا توجد مساحات نشطة في حالة إلغاء الصلاحية المحاكاة. اطلب مراجعة الصلاحية؛ لن تُحدد أكاديمية بديلة تلقائياً.')}</p>`:`<p>${esc(saved.name)} · ${t('Academy Owner','مالك الأكاديمية')}</p>${button('enter','Enter setup workspace','دخول مساحة الإعداد',true)}`}</div>`;
  else if(screen==='branch')content=`<h1>${t('Save your first branch','حفظ الفرع الأول')}</h1><p>${esc(saved.name)} · ${t('Academy Owner','مالك الأكاديمية')}</p><div class="card"><form id="branchForm">${field('branch','Branch name','اسم الفرع',draft.branch||saved.branch)}${field('timezone','Academy timezone (IANA)','المنطقة الزمنية للأكاديمية (IANA)',draft.timezone||saved.timezone,'text','dir="ltr" placeholder="Area/City"')}<small>${t('Choose explicitly; no location is inferred from the browser.','اخترها صراحةً؛ لا يُستنتج الموقع من المتصفح.')}</small><div class="actions">${button('checklist','Back to saved checklist','العودة إلى القائمة المحفوظة')}<button type="submit" class="primary">${t('Save branch','حفظ الفرع')}</button></div></form></div>`;
  else if(screen==='sport')content=`<h1>${t('Configure your first sport','إعداد الرياضة الأولى')}</h1><div class="card"><form id="sportForm">${field('sportEn','Sport label — English','اسم الرياضة — الإنجليزية',draft.sportEn||saved.sportEn,'text','dir="ltr"')}${field('sportAr','Sport label — Arabic','اسم الرياضة — العربية',draft.sportAr||saved.sportAr,'text','dir="rtl"')}<small>${t('No sport is preselected or seeded by this design.','لا يحدد هذا التصميم رياضة مسبقاً.')}</small><div class="actions">${button('checklist','Back to saved checklist','العودة إلى القائمة المحفوظة')}<button type="submit" class="primary">${t('Save sport','حفظ الرياضة')}</button></div></form></div>`;
  else if(screen==='finish')content=`<h1>${t('Review initial setup','مراجعة الإعداد الأولي')}</h1><div class="card"><dl><dt>${t('Academy','الأكاديمية')}</dt><dd>${esc(saved.name)}</dd><dt>${t('Branch','الفرع')}</dt><dd>${esc(saved.branch)}</dd><dt>${t('Timezone','المنطقة الزمنية')}</dt><dd><bdi>${esc(saved.timezone)}</bdi></dd><dt>${t('Sport for this branch','رياضة هذا الفرع')}</dt><dd>${esc(ar?saved.sportAr:saved.sportEn)}</dd></dl><p>${t('Confirm the branch/sport association and mark initial setup complete. Operational activation is a later decision.','أكد ربط الرياضة بالفرع وإكمال الإعداد الأولي. التفعيل التشغيلي قرار لاحق.')}</p><div class="actions">${button('checklist','Back','رجوع')}${button('finish','Complete initial setup','إكمال الإعداد الأولي',true)}</div></div>`;
  else content=`<p class="eyebrow">${t('ACADEMY OWNER · SETUP ONLY','مالك الأكاديمية · الإعداد فقط')}</p><h1>${saved.complete?t('Initial setup saved','حُفظ الإعداد الأولي'):t('Continue your academy setup','متابعة إعداد الأكاديمية')}</h1><p>${esc(saved.name)} · ${t('Academy Owner','مالك الأكاديمية')}</p><ol class="steps"><li class="done">${t('Owner accepted','تم قبول المالك')}</li><li class="${saved.branch?'done':''}">${t(saved.branch?'Branch saved':'Branch',saved.branch?'حُفظ الفرع':'الفرع')}</li><li class="${saved.sportEn?'done':''}">${t(saved.sportEn?'Sport saved':'Sport',saved.sportEn?'حُفظت الرياضة':'الرياضة')}</li><li class="${saved.complete?'done':''}">${t(saved.complete?'Review complete':'Review',saved.complete?'اكتملت المراجعة':'المراجعة')}</li></ol><div class="card"><h2>${t('Saved progress','التقدم المحفوظ')}</h2><ul><li>${t('Branch: ','الفرع: ')}${esc(saved.branch)||t('Not saved','لم يُحفظ')}</li><li>${t('Sport: ','الرياضة: ')}${esc(ar?saved.sportAr:saved.sportEn)||t('Not saved','لم تُحفظ')}</li></ul><p class="muted">${t('Only confirmed saves count. Refresh or return later to resume this simulated checklist.','تُحتسب عمليات الحفظ المؤكدة فقط. يمكنك التحديث أو العودة لاحقاً لاستئناف القائمة المحاكاة.')}</p><div class="actions">${button('branch',saved.branch?'Edit branch':'Add branch',saved.branch?'تعديل الفرع':'إضافة فرع',!saved.branch)}${button('sport',saved.sportEn?'Edit sport':'Add sport',saved.sportEn?'تعديل الرياضة':'إضافة رياضة',!!saved.branch&&!saved.sportEn)}${saved.branch&&saved.sportEn&&!saved.complete?button('reviewFinish','Review and complete','المراجعة والإكمال',true):''}${button('resume','Simulate close and resume','محاكاة الإغلاق والاستئناف')}</div></div><p class="warning">${t('Setup-only workspace. Scheduling, billing and staff invitations are not available in this milestone.','مساحة للإعداد فقط. الجداول والفوترة ودعوات الموظفين غير متاحة في هذه المرحلة.')}</p>`;
 }
 if(scenario==='conflict'&&persona==='owner'&&saved.accepted&&!statePanel())content=`<div class="warning" role="alert"><h2>${t('Another setup edit was saved','حُفظ تعديل آخر للإعداد')}</h2><p>${t('Your local intent is retained in this tab. Load the current version and review before saving; no silent overwrite.','تظل تعديلاتك المحلية في هذه العلامة. حمّل الإصدار الحالي وراجعه قبل الحفظ؛ لن يحدث استبدال صامت.')}</p>${button('current','Load current version for review','تحميل الإصدار الحالي للمراجعة',true)}</div>`;
 if(scenario==='failed'&&!statePanel())content=`<p class="error" role="alert">${t('Save failure scenario: the next submit will retain inputs and leave saved records unchanged.','سيناريو فشل الحفظ: سيحتفظ الإرسال التالي بالمدخلات دون تغيير السجلات المحفوظة.')}</p>`+content;
 document.getElementById('main').innerHTML=(note?`<p class="status" role="status">${esc(note)}</p>`:'')+content+`<footer>${t('M1/v1 · Policy/design approved; simulated only · Working product acceptance pending.','M1/v1 · السياسات والتصميم معتمدان؛ محاكاة فقط · قبول المنتج العامل معلق.')} <a href="../06-delivery/onboarding-m1-decision-design-packet.md">${t('Decision and security packet','حزمة القرارات والأمان')}</a></footer>`;
 bind();if(focus)document.getElementById('main').focus();
}
function commit(fn){if(scenario==='failed'){note=t('Nothing was saved. Your entries remain; change the review scenario to retry.','لم يُحفظ شيء. تظل مدخلاتك موجودة؛ غيّر حالة المراجعة لإعادة المحاولة.');return}fn();saved.version++;persist();unknown=scenario==='unknown';if(!unknown)note=t('Simulated operation confirmed.','تم تأكيد العملية المحاكاة.');}
function bind(){
 action('language',()=>{ar=!ar;note=''});action('phone',()=>document.body.className='phone');action('desktop',()=>document.body.className='');
 document.getElementById('scenario').onchange=e=>{scenario=e.target.value;note='';render(true)};
 action('reset',()=>{saved=fresh();draft={name:'Synthetic Academy A',email:'owner@academy.example',branch:'',timezone:'',sportEn:'',sportAr:''};persona='platform';screen='create';scenario='normal';unknown=false;note='';persist()});
 action('platform',()=>{persona='platform';screen=saved.created?'receipt':'create';note=''});action('owner',()=>{persona='owner';screen=saved.accepted?'contexts':'invite';note=''});
 for(const id of ['recover','switchAccount','current'])action(id,()=>{scenario='normal';note=t('Simulation returned to the current saved state; review before continuing.','عادت المحاكاة إلى الحالة المحفوظة الحالية؛ راجعها قبل المتابعة.')});
 action('reconcile',()=>{unknown=false;scenario='normal';note=t('Original operation found: one simulated committed result. No replacement was sent.','عُثر على العملية الأصلية: نتيجة محاكاة واحدة محفوظة. لم يُرسل طلب بديل.')});
 action('contexts',()=>{scenario='revoked';screen='contexts';note=''});action('start',()=>{persona='platform';screen='create'});
 action('editCreate',()=>screen='create');action('create',()=>commit(()=>{saved.created=true;saved.name=draft.name;saved.email=draft.email;saved.delivery='queued';screen='receipt'}));
 action('deliver',()=>{saved.delivery=scenario==='delivery'?'failed':'accepted';persist();note=t(saved.delivery==='failed'?'Delivery failed; academy is still saved. Retry this delivery only.':'Simulated provider acceptance; inbox placement is not confirmed.',saved.delivery==='failed'?'تعذر الإرسال؛ الأكاديمية محفوظة. أعد محاولة هذا الإرسال فقط.':'محاكاة قبول المزود؛ الوصول إلى صندوق الوارد غير مؤكد.')});
 action('recipient',()=>{persona='owner';screen='invite';note=''});action('reissue',()=>{persona='platform';screen='receipt';scenario='normal';note=t('Inviter review required before revoking/reissuing. This does not restore an expired invite automatically.','تجب مراجعة المرسل قبل الإلغاء وإصدار دعوة جديدة. لا يعيد هذا صلاحية الدعوة المنتهية تلقائياً.')});
 action('accept',()=>commit(()=>{saved.accepted=true;screen='contexts'}));action('enter',()=>screen='checklist');
 action('branch',()=>{screen='branch';note=''});action('sport',()=>{screen='sport';note=''});action('checklist',()=>{screen='checklist';note=''});action('reviewFinish',()=>screen='finish');
 action('finish',()=>commit(()=>{if(!saved.branch||!saved.sportEn||!saved.sportAr||!saved.timezone)return;saved.complete=true;screen='checklist'}));
 action('resume',()=>{draft.branch='';draft.timezone='';draft.sportEn='';draft.sportAr='';screen='checklist';note=t('Resumed confirmed simulated records; unsaved changes were discarded. Use a browser refresh to test storage resume.','استُؤنفت السجلات المحاكاة المؤكدة؛ أُهملت التغييرات غير المحفوظة. جرّب تحديث المتصفح لاختبار الاستئناف.')});
 for(const id of ['name','email','branch','timezone','sportEn','sportAr']){const el=document.getElementById(id);if(el)el.oninput=()=>{draft[id]=el.value;el.setCustomValidity('')}}
 const createForm=document.getElementById('createForm');if(createForm)createForm.onsubmit=e=>{e.preventDefault();if(!draft.name.trim())return;screen='review';render(true)};
 const branchForm=document.getElementById('branchForm');if(branchForm)branchForm.onsubmit=e=>{e.preventDefault();const zone=document.getElementById('timezone');try{new Intl.DateTimeFormat('en',{timeZone:zone.value});zone.setCustomValidity('')}catch{zone.setCustomValidity(t('Enter a valid IANA timezone.','أدخل منطقة زمنية صحيحة بصيغة IANA.'));zone.reportValidity();return}const b=document.getElementById('branch').value.trim();if(!b)return;commit(()=>{saved.branch=b;saved.timezone=zone.value;saved.complete=false;screen='checklist'});render(true)};
 const sportForm=document.getElementById('sportForm');if(sportForm)sportForm.onsubmit=e=>{e.preventDefault();const en=document.getElementById('sportEn').value.trim(),arabic=document.getElementById('sportAr').value.trim();if(!en||!arabic)return;commit(()=>{saved.sportEn=en;saved.sportAr=arabic;saved.complete=false;screen='checklist'});render(true)};
}
render();
</script>
</body>
</html>
