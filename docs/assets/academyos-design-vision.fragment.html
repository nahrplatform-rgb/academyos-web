<div id="aos-vision" aria-label="AcademyOS design vision">
  <div class="viz-carousel" aria-label="AcademyOS interface directions">
    <section data-variant="Workspace" aria-label="Workspace design">
      <div class="aos-stage"><div id="aos-workspace" class="aos-product aos-workspace" aria-label="AcademyOS Workspace"></div></div>
    </section>
    <section data-variant="Daily brief" aria-label="Daily brief design" hidden>
      <div class="aos-stage"><div id="aos-brief" class="aos-product aos-brief" aria-label="AcademyOS Daily brief"></div></div>
    </section>
  </div>
</div>
<script>
(() => {
  'use strict';
  const root = document.getElementById('aos-vision');
  const settings = { appearance:'system', preview:'responsive', corners:16, language:'en' };
  const freshState = () => ({ role:'owner', page:'overview', filter:'all', query:'', child:0, modal:null, attendance:['present','present','unmarked','unmarked'], saved:false, notice:'' });
  const states = { workspace:freshState(), brief:freshState() };
  const products = { workspace:document.getElementById('aos-workspace'), brief:document.getElementById('aos-brief') };
  let narrow = root.getBoundingClientRect().width < 761;
  const t = (en,ar) => settings.language === 'ar' ? ar : en;
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const button = (label,action,primary=false,extra='') => `<button type="button" class="aos-button ${primary?'aos-primary':''} cursor-interaction" data-action="${action}" ${extra}>${label}</button>`;
  const badge = (label,kind='') => `<span class="aos-badge ${kind==='warn'?'aos-warn':kind==='neutral'?'aos-neutral':''}">${label}</span>`;
  const people = [
    { en:'Omar Hassan', ar:'عمر حسن', initials:'OH', program:'football', age:11 },
    { en:'Lina Ahmed', ar:'لينا أحمد', initials:'LA', program:'swimming', age:10 },
    { en:'Adam Ali', ar:'آدم علي', initials:'AA', program:'football', age:12 },
    { en:'Youssef Samir', ar:'يوسف سمير', initials:'YS', program:'football', age:11 }
  ];
  const sessions = [
    { id:0, time:'16:00', end:'17:15', en:'Football · U12', ar:'كرة القدم · تحت ١٢', place:['Pitch A · East branch','ملعب أ · الفرع الشرقي'], coach:['Karim Mansour','كريم منصور'], count:16, cap:18, sport:'football' },
    { id:1, time:'17:00', end:'18:00', en:'Swimming · Level 2', ar:'السباحة · المستوى الثاني', place:['Pool 1 · East branch','مسبح ١ · الفرع الشرقي'], coach:['Salma Adel','سلمى عادل'], count:10, cap:12, sport:'swimming' },
    { id:2, time:'18:00', end:'19:15', en:'Football · U16', ar:'كرة القدم · تحت ١٦', place:['Pitch B · West branch','ملعب ب · الفرع الغربي'], coach:['Trainer needed','مطلوب مدرب'], count:18, cap:20, sport:'football' }
  ];
  const sportName = sport => sport === 'football' ? t('Football','كرة القدم') : t('Swimming','السباحة');
  const titleFor = page => ({overview:t('Overview','نظرة عامة'),schedule:t('Schedule','الجدول'),people:t('Players','اللاعبون'),finance:t('Finance','المالية'),attendance:t('Attendance','الحضور'),progress:t('Progress','التطور'),payments:t('Payments','المدفوعات'),earnings:t('Earnings','مستحقاتي')})[page] || '';
  const roleName = role => ({owner:t('Academy owner','مالك الأكاديمية'),trainer:t('Trainer','المدرب'),guardian:t('Guardian','ولي الأمر')})[role];
  const nameOf = person => t(person.en,person.ar);
  function save() {
    const details = Object.fromEntries(Object.entries(states).map(([k,s]) => [k,{...s,modal:null,notice:''}]));
    if (window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{concept:'AcademyOS',language:settings.language,appearance:settings.appearance,preview:settings.preview,workspaces:Object.fromEntries(Object.entries(states).map(([k,s])=>[k,{role:s.role,page:s.page}]))},privateContent:{version:1,settings:{...settings},states:details}}).catch(()=>{});
  }
  function restore(snapshot) {
    const p=snapshot?.privateContent;
    if (!p || p.version!==1) return;
    if (['system','light','dark'].includes(p.settings?.appearance)) settings.appearance=p.settings.appearance;
    if (['responsive','phone'].includes(p.settings?.preview)) settings.preview=p.settings.preview;
    if (['en','ar'].includes(p.settings?.language)) settings.language=p.settings.language;
    if (Number.isFinite(p.settings?.corners)) settings.corners=Math.max(8,Math.min(24,p.settings.corners));
    for (const k of Object.keys(states)) {
      const s=p.states?.[k]; if (!s) continue;
      if (['owner','trainer','guardian'].includes(s.role)) states[k].role=s.role;
      if (['overview','schedule','people','finance','attendance','progress','payments','earnings'].includes(s.page)) states[k].page=s.page;
      if (['all','football','swimming'].includes(s.filter)) states[k].filter=s.filter;
      states[k].child=s.child===1?1:0;
      if (Array.isArray(s.attendance)&&s.attendance.length===4&&s.attendance.every(v=>['present','absent','unmarked'].includes(v))) states[k].attendance=s.attendance;
      states[k].saved=s.saved===true;
    }
  }
  restore(window.openai?.widgetState);
  const brand = () => `<div class="aos-brand"><span class="aos-brandmark" aria-hidden="true">a</span><span>AcademyOS<small>BY NAHR</small></span></div>`;
  const rolePicker = (s,k) => `<label class="aos-rolelabel" for="aos-role-${k}">${t('Your workspace','مساحة العمل')}</label><select id="aos-role-${k}" class="aos-role cursor-interaction" data-control="role" aria-label="${t('Choose workspace role','اختر دورك')}">${['owner','trainer','guardian'].map(r=>`<option value="${r}" ${r===s.role?'selected':''}>${roleName(r)}</option>`).join('')}</select>`;
  const navItems = s => s.role==='owner' ? [['overview','layout-dashboard'],['schedule','calendar-days'],['people','users-round'],['finance','wallet']] : s.role==='trainer' ? [['overview','house'],['attendance','clipboard-check'],['progress','chart-no-axes-combined'],['earnings','wallet']] : [['overview','house'],['schedule','calendar-days'],['progress','chart-no-axes-combined'],['payments','wallet']];
  const nav = s => `<nav class="aos-nav" aria-label="${t('Main navigation','التنقل الرئيسي')}">${navItems(s).map(([p,i])=>`<button type="button" class="cursor-interaction" data-page="${p}" ${s.page===p?'aria-current="page"':''}>${icon(i)}<span>${titleFor(p)}</span></button>`).join('')}</nav>`;
  function shell(s,k,content) {
    const user=s.role==='owner'?t('Moamen Ghareeb','مؤمن غريب'):s.role==='trainer'?t('Karim Mansour','كريم منصور'):t('Nour Hassan','نور حسن');
    const topActions=`<div class="aos-topactions"><span class="aos-sub">${t('River Sports Academy','أكاديمية ريفر الرياضية')}</span><button type="button" class="aos-iconbutton aos-language cursor-interaction" data-action="language" aria-label="${t('Switch to Arabic','Switch to English')}">${settings.language==='en'?'العربية':'English'}</button></div>`;
    const mobile = settings.preview==='phone'||narrow;
    const header=k==='workspace'?`${mobile?`<div class="aos-mobilechrome">${brand()}<div>${rolePicker(s,k)}</div></div>`:''}<header class="aos-topbar"><div class="aos-breadcrumb">${t('Workspace','مساحة العمل')}<span>/</span><b>${titleFor(s.page)}</b></div>${topActions}${mobile?nav(s):''}</header>`:`<header class="aos-masthead">${brand()}<div>${rolePicker(s,k)}</div></header><div class="aos-topbar">${nav(s)}${topActions}</div>`;
    const side=k==='workspace'&&!mobile?`<aside class="aos-sidebar">${brand()}<div class="aos-academy"><strong>${t('River Sports Academy','أكاديمية ريفر الرياضية')}</strong><span class="aos-sub">${t('2 branches · Cairo','فرعان · القاهرة')}</span></div>${nav(s)}<div class="aos-sidebottom">${rolePicker(s,k)}<div class="aos-user"><span class="aos-avatar">${s.role==='owner'?'MG':s.role==='trainer'?'KM':'NH'}</span><span><strong>${user}</strong><span class="aos-sub">${roleName(s.role)}</span></span></div></div></aside>`:'';
    return `${side}<div class="aos-main">${header}<main class="aos-content">${s.notice?`<div class="aos-notice" role="status">${s.notice}</div>`:''}${content}<footer class="aos-bottomnote"><span><span class="aos-dot"></span>${t('Design concept · Sample data','تصور تصميمي · بيانات تجريبية')}</span><span>${t('AcademyOS by NAHR','AcademyOS من NAHR')}</span></footer></main></div>${s.modal?dialog(s):''}`;
  }
  function heading(eyebrow,title,description,action='') { return `<div class="aos-titleline"><div><div class="aos-eyebrow">${eyebrow}</div><h1>${title}</h1><p class="aos-intro">${description}</p></div>${action}</div>`; }
  function stat(label,value,foot,i) {return `<div class="aos-stat"><div class="aos-statlabel"><span>${label}</span>${icon(i)}</div><div class="aos-statvalue">${value}</div><div class="aos-statfoot">${foot}</div></div>`;}
  function sessionRow(x) {return `<button type="button" class="aos-session cursor-interaction" data-session="${x.id}" data-sessionday="${x.day||'today'}" aria-label="${t('View','عرض')} ${t(x.en,x.ar)}"><span class="aos-time" dir="ltr">${x.time}<small>${x.end}</small></span><span class="aos-sessionbody"><span class="aos-sessionname">${t(x.en,x.ar)}</span><span class="aos-sessionmeta" style="display:block">${t(...x.place)}</span><span class="aos-sessionstatus">${badge(x.id===2?t('Needs trainer','بحاجة إلى مدرب'):t(`${x.count}/${x.cap} players`,`${x.count}/${x.cap} لاعبًا`),x.id===2?'warn':'neutral')}<span class="aos-sub">${x.id===2?'':t(...x.coach)}</span></span></span>${icon('chevron-right')}</button>`;}
  function attendanceChart() {
    const values=[88,91,86,94,90,96,94], days=t(['W','T','F','S','S','M','T'],['أ','خ','ج','س','ح','ن','ث']);
    return `<section class="aos-panel"><div class="aos-panelhead"><h2>${t('Attendance','الحضور')}</h2><span class="aos-sub">${t('Last 7 days','آخر ٧ أيام')}</span></div><div class="aos-chartsummary"><strong>94<small style="font-size:17px">%</small></strong><span class="aos-sub">${t('today · +4 pts this week','اليوم · تحسن ٤ نقاط')}</span></div><div class="aos-bars" role="img" aria-label="${t('Attendance over seven days: 88, 91, 86, 94, 90, 96, 94 percent','نسب الحضور لسبعة أيام: ٨٨، ٩١، ٨٦، ٩٤، ٩٠، ٩٦، ٩٤ بالمئة')}">${values.map((v,i)=>`<div class="aos-baritem"><div class="aos-bar" style="height:${v*.65}px" data-tooltip="${v}%"></div><span>${days[i]}</span></div>`).join('')}</div></section>`;
  }
  function ownerHome(k) {
    return heading(t('Tuesday, 20 October 2026','الثلاثاء، ٢٠ أكتوبر ٢٠٢٦'),k==='workspace'?t('Your academy, in focus.','أكاديميتك، بوضوح.'):t('A clear view of today.','رؤية واضحة ليومك.'),t('Two branches. One connected day.','فرعان. ويوم واحد متصل.'),button(icon('calendar-days')+t('View schedule','عرض الجدول'),'schedule'))+
    `<div class="aos-stats">${stat(t('Active players','اللاعبون النشطون'),'248',t('Across 12 programs','في ١٢ برنامجًا'),'users-round')}${stat(t('Sessions today','جلسات اليوم'),'8',t('5 complete · 3 upcoming','٥ مكتملة · ٣ قادمة'),'calendar-days')}${stat(t('October collections','تحصيلات أكتوبر'),'184k <small>EGP</small>',t('92% of EGP 200,000 billed','٩٢٪ من فواتير بقيمة ٢٠٠٬٠٠٠ جنيه'),'wallet')}</div>`+
    `<div class="aos-grid"><div class="aos-stack"><section class="aos-panel"><div class="aos-panelhead"><h2>${t('Next up today','القادم اليوم')}</h2><span class="aos-sub">${t('3 sessions','٣ جلسات')}</span></div>${sessions.map(sessionRow).join('')}</section><section class="aos-panel"><div class="aos-panelhead"><h2>${t('This month, moving forward','تقدم هذا الشهر')}</h2>${icon('sprout')}</div><div class="aos-data-row"><span>${t('New enrollments','اشتراكات جديدة')}</span><strong>18 <span class="aos-sub" style="display:inline">${t('players','لاعبًا')}</span></strong></div><div class="aos-data-row"><span>${t('Evaluations shared','تقييمات تمت مشاركتها')}</span><strong>42 <span class="aos-sub" style="display:inline">${t('with families','مع العائلات')}</span></strong></div></section></div><div class="aos-stack"><section class="aos-panel"><div class="aos-panelhead"><h2>${t('Needs your attention','يحتاج انتباهك')}</h2>${badge('2','warn')}</div><div class="aos-attention"><span class="aos-attentionicon">${icon('user-round')}</span><div><strong>${t('A trainer is needed','جلسة تحتاج إلى مدرب')}</strong><p>${t('U16 football · Today, 18:00','كرة القدم تحت ١٦ · اليوم ١٨:٠٠')}</p><button type="button" class="aos-link cursor-interaction" data-session="2">${t('Review session','مراجعة الجلسة')}${icon('arrow-up-right')}</button></div></div><div class="aos-attention"><span class="aos-attentionicon">${icon('receipt-text')}</span><div><strong>${t('6 invoices overdue','٦ فواتير متأخرة')}</strong><p>${t('EGP 9,600 across 5 families','٩٬٦٠٠ جنيه لدى ٥ عائلات')}</p><button type="button" class="aos-link cursor-interaction" data-page="finance">${t('View balances','عرض الأرصدة')}${icon('arrow-up-right')}</button></div></div></section>${attendanceChart()}</div></div>`;
  }
  function filters(s,search=false) {
    return `<div class="aos-toolbar">${['all','football','swimming'].map(f=>`<button type="button" class="aos-chip cursor-interaction" data-filter="${f}" aria-pressed="${s.filter===f}">${f==='all'?t('All sports','كل الرياضات'):sportName(f)}</button>`).join('')}${search?`<label class="aos-field">${icon('search')}<input type="search" data-control="search" aria-label="${t('Search players','البحث عن لاعب')}" placeholder="${t('Search players','البحث عن لاعب')}"></label>`:''}</div>`;
  }
  function schedulePage(s) {
    const guardian=s.role==='guardian';
    const chosen=guardian?[sessions[s.child]]:sessions.filter(x=>s.filter==='all'||s.filter===x.sport);
    return heading(t('Your week, organized','أسبوعك، بتنظيم'),t('Schedule','الجدول'),t('Tuesday, 20 October · Cairo time','الثلاثاء، ٢٠ أكتوبر · بتوقيت القاهرة'))+
      (guardian?children(s):filters(s))+
      `<section class="aos-panel"><div class="aos-panelhead"><h2>${t('Today','اليوم')}</h2>${badge(t(`${chosen.length} upcoming`,`${chosen.length} قادمة`),'neutral')}</div>${chosen.map(sessionRow).join('')}</section>`+
      `<section class="aos-panel" style="margin-top:16px"><div class="aos-panelhead"><h2>${t('Thursday, 22 October','الخميس، ٢٢ أكتوبر')}</h2><span class="aos-sub">${t('Next training day','يوم التدريب القادم')}</span></div>${chosen.filter(x=>x.id!==2).map(x=>sessionRow({...x,day:'thursday'})).join('')||`<p class="aos-sub">${t('No sessions scheduled.','لا توجد جلسات مجدولة.')}</p>`}</section>`;
  }
  function playerRows(s) {
    const chosen=people.filter(p=>(s.filter==='all'||p.program===s.filter)&&(!s.query||`${p.en} ${p.ar}`.toLowerCase().includes(s.query.toLowerCase())));
    return chosen.map(p=>`<div class="aos-person"><span class="aos-avatar">${p.initials}</span><div class="aos-persontext"><strong>${nameOf(p)}</strong><small>${sportName(p.program)} · ${t(`Age ${p.age}`,`${p.age} عامًا`)}</small></div>${badge(t('Active','نشط'))}<button type="button" class="aos-iconbutton cursor-interaction" data-person="${people.indexOf(p)}" aria-label="${t('View','عرض')} ${nameOf(p)}">${icon('chevron-right')}</button></div>`).join('')||`<div class="aos-empty">${t('No players match this search.','لا يوجد لاعبون يطابقون هذا البحث.')}</div>`;
  }
  function peoplePage(s) {
    return heading(t('People at the center','اللاعبون في القلب'),t('Your players','لاعبوك'),t('One profile for every player and their family.','ملف واحد لكل لاعب وعائلته.'))+filters(s,true)+`<section class="aos-panel"><div class="aos-panelhead"><h2>${t('Player directory','دليل اللاعبين')}</h2><span class="aos-sub">${t('4 sample profiles','٤ ملفات تجريبية')}</span></div><div data-player-list>${playerRows(s)}</div></section>`;
  }
  function financePage() {
    return heading(t('Academy finances','مالية الأكاديمية'),t('Every payment, clear.','كل دفعة، بوضوح.'),t('October 2026 · Family billing','أكتوبر ٢٠٢٦ · فواتير العائلات'))+
    `<div class="aos-stats">${stat(t('Collected','تم تحصيله'),'184k <small>EGP</small>',t('92% of billed amount','٩٢٪ من إجمالي الفواتير'),'wallet')}${stat(t('Outstanding','المتبقي'),'16k <small>EGP</small>',t('12 open invoices','١٢ فاتورة مفتوحة'),'receipt-text')}${stat(t('Overdue','المتأخر'),'9.6k <small>EGP</small>',t('Included in outstanding','ضمن المبلغ المتبقي'),'clock-3')}</div>`+
    `<div class="aos-grid"><section class="aos-panel"><div class="aos-panelhead"><h2>${t('Recent family invoices','آخر فواتير العائلات')}</h2><span class="aos-sub">EGP</span></div>${[['Hassan family','عائلة حسن','1,600','Due 25 Oct','تستحق ٢٥ أكتوبر'],['Ahmed family','عائلة أحمد','1,200','Paid 18 Oct','مدفوعة ١٨ أكتوبر'],['Ali family','عائلة علي','1,600','Overdue · 5 days','متأخرة · ٥ أيام']].map((r,i)=>`<div class="aos-data-row"><div><strong>${t(r[0],r[1])}</strong><span class="aos-sub">${t(r[3],r[4])}</span></div><div style="text-align:end"><strong class="aos-num">${r[2]}</strong><button type="button" class="aos-link cursor-interaction" style="display:flex" data-invoice="${i}">${t('View invoice','عرض الفاتورة')}</button></div></div>`).join('')}</section><div class="aos-stack"><section class="aos-panel"><div class="aos-panelhead"><h2>${t('Collection progress','تقدم التحصيل')}</h2><strong>92%</strong></div><div class="aos-progress" role="progressbar" aria-label="${t('Collection progress','تقدم التحصيل')}" aria-valuenow="92" aria-valuemin="0" aria-valuemax="100"><span style="width:92%"></span></div><p class="aos-sub" style="margin-top:12px">${t('EGP 184,000 of EGP 200,000','١٨٤٬٠٠٠ من ٢٠٠٬٠٠٠ جنيه')}</p></section><section class="aos-panel"><div class="aos-panelhead"><h2>${t('Trainer compensation','مستحقات المدربين')}</h2>${icon('briefcase-business')}</div><div class="aos-statvalue">32,400 <small>EGP</small></div><p class="aos-sub" style="margin-top:8px">${t('Approved for the October pay run','معتمدة لدورة صرف أكتوبر')}</p><button type="button" class="aos-link cursor-interaction" data-action="compensation">${t('View pay summary','عرض ملخص المستحقات')}${icon('arrow-up-right')}</button></section></div></div>`;
  }
  function trainerHome(s) {
    return heading(t('Tuesday, 20 October','الثلاثاء، ٢٠ أكتوبر'),t('Ready for a great session?','جاهز لتدريب مميز؟'),t('Good afternoon, Karim. Here is your day.','مساء الخير يا كريم. هذا جدول يومك.'))+
    `<div class="aos-sessionhero"><div><span class="aos-eyebrow">${t('Your next session','جلستك القادمة')}</span><h2>${t('Football · U12','كرة القدم · تحت ١٢')}</h2><p class="aos-sub">${t('16:00–17:15 · Pitch A · East branch','١٦:٠٠–١٧:١٥ · ملعب أ · الفرع الشرقي')}</p><div style="margin-top:13px">${badge(t('16 players on the roster','١٦ لاعبًا في القائمة'))}</div></div>${button(icon('clipboard-check')+t('Take attendance','تسجيل الحضور'),'attendance',true)}</div>`+

      if(!states[k].modal)return;
      if(event.key==='Escape') {event.preventDefault();states[k].modal=null;refreshFocus(k,returnFocus);}
      if(event.key==='Tab') {const controls=p.querySelectorAll('.aos-dialog button');const first=controls[0],last=controls[controls.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
    });
  }
  renderAll();
  new ResizeObserver(entries=>{const next=entries[0].contentRect.width<761;if(next!==narrow){narrow=next;renderAll();}}).observe(root);
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);renderAll();}});
  if(globalThis.Tweak) {
    const tweak=new Tweak({container:root,onChange:()=>{renderAll();save();}});
    tweak.addSelect(settings,'appearance',{label:'Appearance',options:[{label:'Follow system',value:'system'},{label:'Light',value:'light'},{label:'Dark',value:'dark'}]});
    tweak.addSelect(settings,'preview',{label:'Screen',options:[{label:'Responsive workspace',value:'responsive'},{label:'Phone',value:'phone'}]});
    tweak.addSlider(settings,'corners',{label:'Corner radius',min:8,max:24,step:2,unit:'px',reference:'--aos-radius'});
  }
})();
</script>
