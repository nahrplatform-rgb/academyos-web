<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AcademyOS · Whole-app experience review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#182a42;font:14px/1.5 system-ui,sans-serif}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button,a{touch-action:manipulation}button{border:1px solid #c5cede;border-radius:6px;background:white;color:#183555;padding:8px 12px}button:hover,button[aria-pressed=true]{background:#e8f0ff;border-color:#3276d2}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f0a420;outline-offset:2px}button:disabled{opacity:.45;cursor:default}header{background:#14283f;color:white;padding:16px 24px}header h1{font-size:22px;margin:0}header p{margin:4px 0;max-width:1150px;color:#d6e2ef}.meta{font-size:12px}nav{background:white;display:flex;gap:6px;flex-wrap:wrap;padding:10px 24px;border-bottom:1px solid #d2dae6}main{padding:20px;max-width:1800px;margin:auto}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}label{display:grid;gap:4px}input,select,textarea{border:1px solid #bac7d6;border-radius:5px;padding:8px;background:white;color:#182a42}input[type=search]{min-width:260px}.grid{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px}aside,.card{background:white;border:1px solid #d2dbe6;border-radius:8px;padding:16px;min-width:0}aside{max-height:80vh;overflow:auto}.card h2,.card h3{margin:0 0 12px}.journey{display:block;width:100%;text-align:left;margin:0 0 8px;padding:12px}.journey small{display:block;color:#54667c}.badge{display:inline-block;font-size:12px;padding:3px 7px;border-radius:4px;background:#e8eff9;color:#304a6b}.warn{background:#fff5d9;border:1px solid #e4cd8b;padding:12px;border-radius:6px;margin:10px 0}.viewer{overflow:auto;background:#d5deeb;padding:12px;border-radius:8px;max-height:85vh}iframe{display:block;border:0;background:white;margin:0 auto;max-width:none}table{width:100%;border-collapse:collapse;background:white}th,td{padding:10px;border:1px solid #d8e0eb;text-align:left;vertical-align:top}th{background:#edf2f8}details{margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#edf2f7;padding:10px;max-height:600px;overflow:auto}a{color:#075cba}.small{font-size:12px;color:#54667c}.scroll{overflow:auto;max-height:72vh}.frame-row{display:block;text-align:left;width:100%;margin:6px 0}.notes{width:100%;min-height:110px}.hidden{display:none!important}.actions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.flow{white-space:pre-line;background:#f4f7fb;padding:12px;border-radius:6px}.reviewline{padding:8px;border-bottom:1px solid #e0e7ef}#status{min-height:22px}#toast{color:#905700}#frameinfo{overflow-wrap:anywhere}#loading{padding:40px;font-size:20px}@media(max-width:800px){.grid{grid-template-columns:1fr}aside{max-height:300px}main{padding:10px}header,nav{padding:12px}.toolbar{align-items:stretch}.viewer{padding:4px}}
</style>
<header><h1>AcademyOS · Whole-app experience review</h1><p>Current baseline — actual component layout, words and recorded workflow states. Review the problems here; this is not a proposed redesign.</p><p class="meta" id="provenance">Loading embedded source record…</p></header>
<nav aria-label="Review sections" id="tabs"></nav><main><div id="loading">Opening the self-contained review…</div><div id="content" hidden></div><p role="status" id="status"></p></main>
<script>
const PAYLOAD=/*PAYLOAD*/;
let D,tab='Journeys',journey='onboarding',frameId=null,search='',locale='all',width='all',notes=[],fit=true;const $=x=>document.getElementById(x),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const repo=(path,line)=>'https://github.com/nahrplatform-rgb/academyos-web/blob/'+D.source+'/'+path+(line?'#L'+line:'');
function pathLink(p){return '<a target="_blank" rel="noopener" href="'+escape(repo(p))+'">'+escape(p)+'</a>'}
function frames(){return D.frames.filter(f=>f.journey===journey&&(locale==='all'||language(f)===locale)&&(width==='all'||f.viewport?.width==width)&&(!search||[f.label,f.text,f.id].join(' ').toLowerCase().includes(search.toLowerCase())))}
function language(f){return /(?:\s|<)(?:lang="ar"|dir="rtl")/.test(f.html)?'ar':'en'}
function journeyNav(){return D.journeys.map(j=>'<button class="journey" data-journey="'+j.id+'" aria-pressed="'+(journey===j.id)+'">'+escape(j.title)+'<small>'+escape(j.roles)+' · '+D.frames.filter(f=>f.journey===j.id).length+' recorded states</small></button>').join('')}
function footer(){return '<div class="warn">Read-only replay with fictional data. Inputs do not save. A recorded control opens its observed result; unrecorded controls report a coverage gap. No login, API, email, camera or hosted writes.</div>'}
function render(){ $('tabs').innerHTML=['Journeys','Screen & state directory','Words & controls','Coverage & source','Review notes','Read first'].map(t=>'<button data-tab="'+escape(t)+'" aria-pressed="'+(t===tab)+'">'+escape(t)+'</button>').join('');const c=$('content');c.hidden=false;
if(tab==='Journeys'||tab==='Screen & state directory'){const j=D.journeys.find(j=>j.id===journey),ff=frames();if(!ff.some(f=>f.id===frameId))frameId=(ff.find(f=>!f.text.includes('Loading current authorized')&&f.text.length>250)||ff[0])?.id; c.innerHTML='<div class="grid"><aside><h2>Connected workflows</h2>'+journeyNav()+'</aside><section class="card"><h2>'+escape(j.title)+'</h2><p>'+escape(j.roles)+' · '+escape(j.actions)+'</p><div class="flow">'+escape(j.sequence)+'</div><p class="small">Contract / evidence: '+pathLink(j.reference)+'</p>'+footer()+'<div class="toolbar"><label>Find a word or state<input id="search" type="search" value="'+escape(search)+'" placeholder="Search all recorded states in this journey"></label><label>Captured language<select id="locale"><option value="all">EN + AR</option><option value="en">EN</option><option value="ar">AR</option></select></label><label>Captured width<select id="width"><option value="all">All captured widths</option>'+[320,360,926,1440].map(w=>'<option>'+w+'</option>').join('')+'</select></label><button id="reset">Start this journey</button></div><div class="actions"><button id="back">Previous recorded state</button><button id="next">Next recorded state</button><button id="note">Comment on this state</button><button id="fit">View at captured size</button></div><div id="frameinfo"></div><div id="toast" role="status"></div><div class="viewer"><div id="previewScale"><iframe id="preview" title="Actual AcademyOS component state" sandbox="allow-same-origin"></iframe></div></div><div id="alternatives"></div><details '+(tab==='Screen & state directory'?'open':'')+'><summary>All '+ff.length+' matching states · select directly</summary><div class="scroll">'+ff.map(f=>'<button class="frame-row" data-frame="'+f.id+'">'+escape(f.id)+' · '+language(f)+' · '+f.viewport?.width+'px · '+escape(f.label)+'<small> '+escape(f.text.replace(/\s+/g,' ').slice(0,180))+'</small></button>').join('')+'</div></details><details><summary>Visible words and controls in the selected state</summary><div id="stateWords"></div></details></section></div>'; $('locale').value=locale;$('width').value=width;$('search').onchange=e=>{search=e.target.value;render()};$('locale').onchange=e=>{locale=e.target.value;render()};$('width').onchange=e=>{width=e.target.value;render()};$('reset').onclick=()=>{search='';locale='all';width='all';frameId=null;render()};$('back').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('note').onclick=()=>addNote();$('fit').onclick=()=>{fit=!fit;showFrame(frameId)};showFrame(frameId);}
else if(tab==='Words & controls'){c.innerHTML='<section class="card"><h2>Exact wording and control inventory</h2><p>Search rendered states or every source literal. Source literals include conditional labels and technical strings; they are not all user-visible. Every entry has its original file and line.</p><div class="toolbar"><input id="wordSearch" type="search" placeholder="Search English, العربية, label or file"><select id="wordMode"><option value="source">All source literals</option><option value="controls">Observed controls</option></select></div><div id="wordResults"></div></section>'; $('wordSearch').oninput=wordResults;$('wordMode').onchange=wordResults;wordResults();}
else if(tab==='Coverage & source'){const screens=D.tables['docs/06-delivery/app-implementation-screen-matrix.csv'],actions=D.tables['docs/06-delivery/app-implementation-action-matrix.csv'];c.innerHTML='<section class="card"><h2>Coverage without completion inflation</h2><p>'+D.frames.length+' captured states; '+D.edges.length+' observed transitions; '+D.sources.length+' current UI source files; '+screens.length+' catalog screen IDs; 180 retained requirements. Counts are inventory, not finished features.</p><div class="warn">Manager and Player have no completed operational portal in this slice. Provider sign-in/account menus, physical camera and browser-native dialogs require live review. Existing screen-register summaries may be older than action evidence. No fabricated dashboard is supplied.</div><h3>App routes and source — every line</h3><p>Source is embedded for offline inspection. Files below can be searched with your browser’s Find. Conditional copy not rendered in captured states remains visible here.</p>'+D.sources.map((s,i)=>'<details><summary>'+escape(s.path)+'</summary>'+pathLink(s.path)+'<pre>'+escape(s.source.split('\n').map((l,n)=>String(n+1).padStart(4)+' '+l).join('\n'))+'</pre></details>').join('')+'<h3>All screen IDs</h3><div class="scroll"><table><tr><th>ID / screen</th><th>Implementation scope</th><th>Evidence / next gate</th></tr>'+screens.map(r=>'<tr><td>'+escape(r.screen_id+' · '+r.screen)+'</td><td>'+escape(r.implementation_status)+'<br>'+escape(r.implementation_source)+'</td><td>'+escape(r.verification_status)+'<br>'+escape(r.next_gate)+'</td></tr>').join('')+'</table></div><h3>Current action contracts</h3>'+actions.map(r=>'<details><summary>'+escape(r.work_item_id+' · '+r.journey_action_ids+' · '+r.actor_context)+'</summary><pre>'+escape(JSON.stringify(r,null,2))+'</pre>'+pathLink(r.action_contract)+'</details>').join('')+'<h3>Full register records</h3>'+Object.entries(D.tables).map(([p,rows])=>'<details><summary>'+escape(p)+' · '+rows.length+' rows</summary><pre>'+escape(JSON.stringify(rows,null,2))+'</pre></details>').join('')+'<h3>Capture gaps and native dialogs</h3><pre>'+escape(JSON.stringify({gaps:D.gaps,dialogs:D.dialogs},null,2))+'</pre></section>';}
else if(tab==='Review notes'){c.innerHTML='<section class="card"><h2>Reviewer findings / proposed improvements</h2><p>Keep baseline findings separate from proposed designs and policy changes. Notes stay in memory until downloaded; reload clears them. Nothing is sent anywhere.</p><button id="newNote">Add finding</button> <button id="export">Download review notes</button><div id="notes">'+notes.map((n,i)=>'<article class="reviewline"><strong>'+escape(n.frame||'Whole app')+'</strong><p>'+escape(n.text)+'</p><small>'+escape(n.category)+'</small> <button data-delete="'+i+'">Remove</button></article>').join('')+'</div></section>';$('newNote').onclick=()=>addNote();$('export').onclick=()=>download({source:D.source,baseline:'current app; no proposed changes accepted',notes},'AcademyOS-review-findings.json');}
else {c.innerHTML='<section class="card"><h2>How to review the whole experience</h2><p>'+escape(D.scope)+'</p><ol><li>Follow each guided journey. Use the actual recorded buttons or Next recorded state. Resets in tests start a different scenario; they are not product navigation.</li><li>Use the directory to inspect loading, empty, stale, denied, pending, response-loss and recovery states.</li><li>Compare EN/AR and captured phone/tablet/desktop widths. Desktop views preserve their original width and may need horizontal scrolling in this review tool.</li><li>Inspect the screen register and source for conditional or uncaptured surfaces. A visible control with no recorded edge is a gap, not a broken hosted function.</li><li>Download findings with stable state IDs. Separate appearance, navigation, copy, sequence, accessibility, recovery and policy proposals.</li></ol><h3>Boundaries</h3><ul>'+D.limits.map(l=>'<li>'+escape(l)+'</li>').join('')+'</ul><h3>PYSA reference</h3><p>PYSA remains the read-only functional reference. Its role-aware navigation, connected list/calendar/detail and task handoffs are useful comparison points. Its audit documented translation gaps, incomplete search and false-success behaviours; do not copy those assumptions. This file reproduces AcademyOS, not PYSA.</p>'+pathLink('docs/03-design/pysa-behavior-preservation.md')+'<br>'+pathLink('docs/03-design/pysa-scheduling-reference-review.md')+'<h3>Keeping it current</h3><p>Run the relevant existing UI checks through the capture tool after UI/workflow changes, then rebuild this file. The manifest hashes current UI routes/components/CSS, tests and registers. CI rejects source drift; a current hash does not prove every state was reviewed. No app redesign or account grant is introduced by generating this review.</p><pre>node scripts/experience-review/collect.mjs\nnode scripts/experience-review/build.mjs\nnode scripts/experience-review/build.mjs --check</pre></section>';}
bind();}
function bind(){document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{tab=e.dataset.tab;render()});document.querySelectorAll('[data-journey]').forEach(e=>e.onclick=()=>{journey=e.dataset.journey;frameId=null;search='';locale=width='all';render()});document.querySelectorAll('[data-frame]').forEach(e=>e.onclick=()=>showFrame(e.dataset.frame));document.querySelectorAll('[data-delete]').forEach(e=>e.onclick=()=>{notes.splice(+e.dataset.delete,1);render()});}
function showFrame(id){const f=D.frames.find(f=>f.id===id);if(!f){$('frameinfo').textContent='No captured state matches these filters.';return}frameId=id;location.hash=id;const ff=frames(),ix=ff.findIndex(x=>x.id===id);$('back').disabled=ix<=0;$('next').disabled=ix<0||ix>=ff.length-1;$('frameinfo').innerHTML='<p><span class="badge">'+escape(id)+'</span> '+language(f).toUpperCase()+' · '+f.viewport.width+' × '+f.viewport.height+' · '+escape(f.label)+'</p>';
const iframe=$('preview');iframe.style.width=f.viewport.width+'px';iframe.style.height=f.viewport.height+'px';const scale=fit?Math.min(1,(document.querySelector('.viewer').clientWidth-24)/f.viewport.width):1;iframe.style.transform='scale('+scale+')';iframe.style.transformOrigin='top left';$('previewScale').style.width=(f.viewport.width*scale)+'px';$('previewScale').style.height=(f.viewport.height*scale)+'px';$('fit').textContent=fit?'View at captured size':'Fit preview to available width';iframe.srcdoc='<!doctype html><html lang="'+(language(f))+'"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src &apos;none&apos;; style-src &apos;unsafe-inline&apos;; img-src data:; font-src data:; form-action &apos;none&apos;"><style>'+D.styles[f.cssId]+'</style><body>'+f.html+'</body></html>';
iframe.onload=()=>{const doc=iframe.contentDocument;if(!doc)return;doc.addEventListener('submit',e=>e.preventDefault());doc.addEventListener('click',e=>{const el=e.target.closest('[data-review-node]');if(!el)return;e.preventDefault();const candidates=D.edges.filter(x=>x.before===id&&x.node===el.dataset.reviewNode);if(candidates.length===1){showFrame(candidates[0].after)}else if(candidates.length>1){$('alternatives').innerHTML='<h3>Observed outcomes for this control</h3>'+candidates.map(x=>'<button data-frame="'+x.after+'">'+escape(x.method+' '+x.label+(x.value?' → '+x.value:''))+'</button>').join('');bind()}else $('toast').textContent='This control has no recorded transition from this state. Inspect its source or use the next recorded state; this replay performs no app operation.'});};$('alternatives').innerHTML='';$('toast').textContent='';$('stateWords').innerHTML='<pre>'+escape(f.text)+'</pre><table><tr><th>Control</th><th>State</th><th>Recorded outcome</th></tr>'+f.controls.filter(c=>c.visible).map(c=>'<tr><td>'+escape(c.tag+' · '+c.label)+'</td><td>'+(c.disabled?'Disabled':'Enabled')+'</td><td>'+D.edges.filter(e=>e.before===id&&e.node===c.node).map(e=>'<button data-frame="'+e.after+'">'+escape(e.method)+'</button>').join(' ')+'</td></tr>').join('')+'</table>';bind();}
window.addEventListener('resize',()=>{if(D&&fit&&$('preview'))showFrame(frameId)});
function step(n){const ff=frames(),i=ff.findIndex(x=>x.id===frameId);if(ff[i+n])showFrame(ff[i+n].id)}
function wordResults(){const q=$('wordSearch').value.toLowerCase(),mode=$('wordMode').value;let items;if(mode==='source'){items=D.words.filter(w=>!q||(w.text+' '+w.path).toLowerCase().includes(q));$('wordResults').innerHTML='<p>'+items.length+' matching literals; first 150 shown. Narrow the search for more.</p>'+items.slice(0,150).map(w=>'<div class="reviewline"><p dir="auto">'+escape(w.text)+'</p><a target="_blank" rel="noopener" href="'+escape(repo(w.path,w.line))+'">'+escape(w.path+':'+w.line)+'</a> · '+w.kind+'</div>').join('')}else{items=D.frames.flatMap(f=>f.controls.filter(c=>c.visible&&(!q||c.label.toLowerCase().includes(q))).map(c=>({...c,frame:f.id,journey:f.journey})));$('wordResults').innerHTML='<p>'+items.length+' occurrences; first150 shown.</p>'+items.slice(0,150).map(w=>'<div class="reviewline"><p dir="auto">'+escape(w.label)+'</p>'+escape(w.frame)+' · '+w.tag+' · '+(w.disabled?'Disabled':'Enabled')+'</div>').join('')}}
function addNote(){const section=document.createElement('dialog');section.innerHTML='<form method="dialog"><h2>Review finding</h2><p>State: '+escape(frameId||'Whole app')+'</p><label>Category<select name="category"><option>Appearance / spacing / alignment</option><option>Navigation / task sequence</option><option>Wording / ENAR</option><option>Accessibility</option><option>Failure / recovery</option><option>Coverage gap</option><option>Proposed policy change — needs decision</option></select></label><label>Finding and proposed improvement<textarea class="notes" name="finding" required></textarea></label><div class="actions"><button value="save">Keep finding</button><button value="cancel" formnovalidate>Cancel</button></div></form>';document.body.append(section);section.addEventListener('close',()=>{if(section.returnValue==='save')notes.push({frame:frameId,journey,category:section.querySelector('select').value,text:section.querySelector('textarea').value});section.remove();if(tab==='Review notes')render();$('status').textContent=notes.length+' review findings in memory. Download them before closing.'});section.showModal()}
function download(data,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
(async()=>{try{const bytes=Uint8Array.from(atob(PAYLOAD),c=>c.charCodeAt(0)),stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));D=JSON.parse(await new Response(stream).text());const id=location.hash.slice(1),f=D.frames.find(f=>f.id===id);if(f){journey=f.journey;frameId=id} $('provenance').textContent='Source '+D.source.slice(0,12)+' · generated '+D.built+' · '+D.frames.length+' states / '+D.journeys.length+' journey groups · fictional offline replay';$('loading').hidden=true;render();window.__reviewReady=true;}catch(e){$('loading').textContent='Could not open embedded review: '+e+'. Use a current browser supporting DecompressionStream.'}})();
</script></html>
