<script type="module">// Fictional preview storage only. This is not the AcademyOS private-data adapter.
const DB_NAME = 'academyos-lf-review-v2';
const DB_VERSION = 1;
const request = r => new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const completion = tx => new Promise((resolve,reject)=>{tx.oncomplete=()=>resolve();tx.onabort=()=>reject(tx.error ?? new Error('Transaction aborted'));tx.onerror=()=>{}});
const metaKey=(ns,dataset)=>`${ns}|${dataset}`;
const rowKey=(ns,dataset,gen,id)=>`${ns}|${dataset}|${gen}|${id}`;
const partition=(ns,dataset,gen)=>IDBKeyRange.only([ns,dataset,gen]);
const rowWithKey=(ns,dataset,gen,row)=>({...row,ns,dataset,gen,key:rowKey(ns,dataset,gen,row.id)});
class ReviewRepository {
  constructor(db){this.db=db;this.localQueries=0;this.queryTimes=[];db.onversionchange=()=>db.close()}
  static async open(){
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{
      const db=req.result;
      const rows=db.createObjectStore('rows',{keyPath:'key'});
      rows.createIndex('partition',['ns','dataset','gen']);
      rows.createIndex('name',['ns','dataset','gen','search','id']);
      rows.createIndex('nameAr',['ns','dataset','gen','nameAr','id']);
      rows.createIndex('day',['ns','dataset','gen','day','id']);
      const meta=db.createObjectStore('meta',{keyPath:'key'});meta.createIndex('scope','ns');
      db.createObjectStore('control',{keyPath:'key'});
      const ops=db.createObjectStore('operations',{keyPath:'key'});ops.createIndex('scope','ns');
    };
    return new ReviewRepository(await request(req));
  }
  async control(key,value){const write=arguments.length===2;const tx=this.db.transaction('control',write?'readwrite':'readonly');const done=completion(tx);const s=tx.objectStore('control');if(write)s.put({key,value});const result=write?undefined:await request(s.get(key));await done;return result?.value}
  async summaries(ns){this.localQueries++;const tx=this.db.transaction('meta');return request(tx.objectStore('meta').index('scope').getAll(ns))}
  async stagePage(ns,dataset,manifest,offset,rows,{abort=false}={}){
    const tx=this.db.transaction(['rows','meta'],'readwrite');const done=completion(tx);const store=tx.objectStore('rows'),meta=tx.objectStore('meta');
    try{
      let m=await request(meta.get(metaKey(ns,dataset))) ?? {key:metaKey(ns,dataset),ns,dataset,active:null,pending:null};
      if(m.active?.revision===manifest.revision && !m.pending)throw new Error('Already complete');
      if(!m.pending)m.pending={gen:`${manifest.revision}-${crypto.randomUUID()}`,revision:manifest.revision,total:manifest.total,cursor:0};
      const p=m.pending;
      if(p.revision!==manifest.revision || p.total!==manifest.total || p.cursor!==offset || offset+rows.length>p.total || (rows.length===0&&p.total!==0))throw new Error('Snapshot/cursor mismatch');
      if(new Set(rows.map(r=>r.id)).size!==rows.length || rows.some(r=>r.academy!==ns.split(':')[1]))throw new Error('Invalid page scope');
      for(const row of rows){if(await request(store.get(rowKey(ns,dataset,p.gen,row.id))))throw new Error('Repeated row');store.put(rowWithKey(ns,dataset,p.gen,row))}
      p.cursor+=rows.length;
      if(p.cursor===p.total){
        const actual=await request(store.index('partition').count(partition(ns,dataset,p.gen)));
        if(actual!==p.total)throw new Error('Incomplete snapshot');
        if(m.active){const old=store.index('partition').openCursor(partition(ns,dataset,m.active.gen));old.onsuccess=()=>{const c=old.result;if(c){c.delete();c.continue()}}}
        m.active={...p,appliedAt:new Date().toISOString()};m.pending=null;
      }
      meta.put(m);
      if(abort)tx.abort();
      await done;return m;
    }catch(e){try{tx.abort()}catch{}await done.catch(()=>{});throw e}
  }
  async discardStaging(ns,dataset){
    const tx=this.db.transaction(['rows','meta'],'readwrite');const done=completion(tx);const m=await request(tx.objectStore('meta').get(metaKey(ns,dataset)));
    if(m?.pending){const r=tx.objectStore('rows').index('partition').openCursor(partition(ns,dataset,m.pending.gen));r.onsuccess=()=>{const c=r.result;if(c){c.delete();c.continue()}};m.pending=null;tx.objectStore('meta').put(m)}
    await done;
  }
  async read(ns,dataset,{prefix='',after=null,limit=25,day='',locale='en'}={}){
    const start=performance.now();this.localQueries++;
    const tx=this.db.transaction(['rows','meta']);const done=completion(tx);const m=await request(tx.objectStore('meta').get(metaKey(ns,dataset)));
    const generation=m?.active??m?.pending;
    if(!generation){await done;return {items:[],more:false,meta:null}}
    const arabicSearch=prefix?/\p{Script=Arabic}/u.test(prefix):locale==='ar';
    const indexName=dataset==='players'?(arabicSearch?'nameAr':'name'):'day';
    const term=indexName==='day'?day:prefix.toLocaleLowerCase().trim();
    const base=[ns,dataset,generation.gen];
    const lower=after??[...base,term];
    const upper=[...base,term?term+'\uffff':'\uffff','\uffff'];
    const range=IDBKeyRange.bound(lower,upper,Boolean(after),false);
    const result=await new Promise((resolve,reject)=>{
      const items=[];let next=null;const r=tx.objectStore('rows').index(indexName).openCursor(range);
      r.onerror=()=>reject(r.error);r.onsuccess=()=>{const c=r.result;if(!c){resolve({items,more:false,next});return}if(items.length===limit){resolve({items,more:true,next});return}items.push(c.value);next=c.key;c.continue()};
    });
    await done;this.queryTimes.push(performance.now()-start);return {...result,meta:m};
  }
  async countsByDay(ns,dataset){
    const tx=this.db.transaction(['rows','meta']);const done=completion(tx);const m=await request(tx.objectStore('meta').get(metaKey(ns,dataset)));const generation=m?.active??m?.pending;const counts={};
    if(generation)await new Promise((resolve,reject)=>{const r=tx.objectStore('rows').index('day').openKeyCursor(IDBKeyRange.bound([ns,dataset,generation.gen],[ns,dataset,generation.gen,'\uffff','\uffff']));r.onerror=()=>reject(r.error);r.onsuccess=()=>{const c=r.result;if(!c){resolve();return}const day=c.key[3];counts[day]=(counts[day]??0)+1;c.continue()}});
    await done;return counts;
  }
  async getRow(ns,dataset,id){const tx=this.db.transaction(['rows','meta']);const m=await request(tx.objectStore('meta').get(metaKey(ns,dataset)));const gen=m?.active??m?.pending;return gen?request(tx.objectStore('rows').get(rowKey(ns,dataset,gen.gen,id))):undefined}
  async applyDelta(ns,dataset,base,manifest,changes,{abort=false}={}){
    const tx=this.db.transaction(['rows','meta'],'readwrite');const done=completion(tx);
    try{
      const ms=tx.objectStore('meta'),rs=tx.objectStore('rows');const m=await request(ms.get(metaKey(ns,dataset)));
      if(!m?.active || m.active.revision!==base || m.pending)throw new Error('Stale change base');
      for(const c of changes){if(c.kind==='remove')rs.delete(rowKey(ns,dataset,m.active.gen,c.id));else{if(c.row.academy!==ns.split(':')[1])throw new Error('Wrong delta scope');rs.put(rowWithKey(ns,dataset,m.active.gen,c.row))}}
      const count=await request(rs.index('partition').count(partition(ns,dataset,m.active.gen)));
      if(count!==manifest.total)throw new Error('Changed count mismatch');
      m.active={...m.active,total:count,cursor:count,revision:manifest.revision,appliedAt:new Date().toISOString()};ms.put(m);
      if(abort)tx.abort();await done;
    }catch(e){try{tx.abort()}catch{}await done.catch(()=>{});throw e}
  }
  async clearReplicas(ns){
    const tx=this.db.transaction(['rows','meta'],'readwrite');const done=completion(tx);
    const m=tx.objectStore('meta').index('scope').openCursor(IDBKeyRange.only(ns));m.onsuccess=()=>{const c=m.result;if(c){c.delete();c.continue()}};
    const r=tx.objectStore('rows').openCursor();r.onsuccess=()=>{const c=r.result;if(c){if(c.value.ns===ns)c.delete();c.continue()}};
    await done;
  }
  async operation(ns,value){const tx=this.db.transaction('operations',value?'readwrite':'readonly');const done=completion(tx);const s=tx.objectStore('operations');if(value)s.put({...value,key:ns,ns});const result=value??await request(s.get(ns));await done;return result}
  async reset(){const tx=this.db.transaction(['rows','meta','control','operations'],'readwrite');const done=completion(tx);for(const n of ['rows','meta','control','operations'])tx.objectStore(n).clear();await done}
}

// In-browser fictional source. No app, Supabase, Clerk or other service is called.
const FIXTURE_VERSION='LF-review-2026-11-02.1';
const SCOPE_A='review-user:academy-A:owner';
const SCOPE_B='review-user:academy-B:owner';

function baseRows(ns,dataset){
  const academy=ns.split(':')[1];
  if(academy==='academy-B')return [];
  if(dataset==='players')return Array.from({length:128},(_,i)=>({id:`player-${String(i+1).padStart(3,'0')}`,academy,name:`${names[i%8][0]} ${String(i+1).padStart(3,'0')}`,nameAr:`${names[i%8][1]} ${String(i+1).padStart(3,'0')}`,search:`${names[i%8][0].toLocaleLowerCase()} ${String(i+1).padStart(3,'0')}`,branch:'Demo Main Branch',branchAr:'الفرع التجريبي الرئيسي',revision:1,day:''}));
  const count=dataset==='2026-11'?64:['2026-10','2026-12'].includes(dataset)?24:0;
  return Array.from({length:count},(_,i)=>{
    const day=`${dataset}-${String(i% (dataset==='2026-11'?30:28)+1).padStart(2,'0')}`;
    const program=i<30?'Football Demo':i<60?'Swimming Demo':'Fitness Demo';const title=i<30?'Football practice':i<60?'Swimming practice':'Fitness practice';
    const hour=i<30?'14':i<60?'16':'18';
    return {id:`${dataset}-session-${String(i+1).padStart(3,'0')}`,academy,day,date:day,title,titleAr:i<30?'تدريب كرة القدم':i<60?'تدريب السباحة':'تدريب اللياقة',program,branch:'Demo Main Branch',branchAr:'الفرع التجريبي الرئيسي',sport:i<30?'Football':i<60?'Swimming':'Fitness',sportAr:i<30?'كرة القدم':i<60?'السباحة':'اللياقة',starts_at:`${day}T${hour}:00:00Z`,ends_at:`${day}T${Number(hour)+1}:00:00Z`,timezone:'Africa/Cairo',state:i%5===0?'draft':'published',capacity:18,roster_count:12,revision:1,search:''};
  });
}
function changeSet(ns,dataset){
  const rows=baseRows(ns,dataset);
  if(ns!==SCOPE_A)return [];
  if(dataset==='players')return [{kind:'upsert',row:{...rows[0],name:'Alex Demo Updated 001',nameAr:'أليكس تجريبي محدّث 001',search:'alex demo updated 001',revision:2}},{kind:'remove',id:'player-002'}];
  if(dataset==='2026-11')return [{kind:'upsert',row:{...rows[0],day:'2026-11-03',date:'2026-11-03',starts_at:'2026-11-03T14:00:00Z',ends_at:'2026-11-03T15:00:00Z',state:'moved',revision:2}},{kind:'remove',id:rows[1].id}];
  return [];
}
function sourceRows(ns,dataset,revision=1){let rows=baseRows(ns,dataset);if(revision>=2)for(const c of changeSet(ns,dataset)){rows=rows.filter(r=>r.id!==(c.kind==='remove'?c.id:c.row.id));if(c.kind==='upsert')rows.push(c.row)}return rows.sort((a,b)=>a.id.localeCompare(b.id))}
function manifest(ns,dataset,revision=1){return {revision:`r${revision}`,total:sourceRows(ns,dataset,revision).length,pageSize:dataset==='players'?25:50,epoch:'owner-summary-v1',dataset,ns}}

async function fixtureManifest(dataset){if(offline||failRead)throw new Error('read');counters.manifests++;const m=manifest(ns,dataset,revision);counters.bytes+=new TextEncoder().encode(JSON.stringify(m)).byteLength;emit('manifest',{ns,dataset,revision:m.revision});return m}
function broadcast(){channel?.postMessage({scope:ns})}
async function prepareOne(dataset,token){
 const m=await fixtureManifest(dataset);
 let state=(await repo.summaries(ns)).find(x=>x.dataset===dataset);
 if(state?.active?.revision===m.revision)return;
 if(state?.pending?.revision!==m.revision&&state?.pending){await repo.discardStaging(ns,dataset);state=(await repo.summaries(ns)).find(x=>x.dataset===dataset)}
 if(state?.active&&state.active.revision==='r1'&&m.revision==='r2'){
   const changes=changeSet(ns,dataset);if(!changes.length)return;
   await wait(450);if(token!==generation||denial||pauseRequested||offline)throw new Error('paused');
   counters.deltas++;counters.bytes+=new TextEncoder().encode(JSON.stringify(changes)).byteLength;const abort=abortNext;abortNext=false;
   await repo.applyDelta(ns,dataset,'r1',m,changes,{abort});emit('delta-committed',{ns,dataset,changes:changes.length});broadcast();await refreshStable();return;
 }
 let offset=state?.pending?.cursor??0;
 do{
   await wait(500);if(token!==generation||denial||pauseRequested||offline)throw new Error('paused');
   const rows=sourceRows(ns,dataset,revision).slice(offset,offset+m.pageSize);counters.pages++;counters.bytes+=new TextEncoder().encode(JSON.stringify(rows)).byteLength;const abort=abortNext;abortNext=false;
   await repo.stagePage(ns,dataset,m,offset,rows,{abort});offset+=rows.length;emit('page-committed',{ns,dataset,offset,total:m.total,revision:m.revision});broadcast();await refreshStable();
 }while(offset<m.total);
}
async function synchronize(datasets=route==='calendar'?[month,'players']:['2026-11','players']){
 if(busy||!unlocked||offline||denial||storageBlocked||shared)return;
 const token=++generation;busy=true;pauseRequested=false;setMessage(t('preparing'));
 const work=async lock=>{
   if(lock===null){setMessage(t('resumeOther'));return}
   try{
     const before=counters.pages+counters.deltas;
     for(const dataset of datasets){if(pauseRequested||token!==generation)throw new Error('paused');await prepareOne(dataset,token)}
     if(token===generation)setMessage(counters.pages+counters.deltas===before?t('unchanged'):revision===2?t('changed'):t('done'));
   }catch(e){if(token===generation&&!denial)setMessage(t(e.message==='paused'?'paused':e.message==='read'?'readFailure':'storageFailure'),e.message==='paused'?'warning':'error');emit('stopped',{reason:e.message})}
 };
 try{await refreshStable();if(navigator.locks)await navigator.locks.request('academyos-lf-review:'+ns,{ifAvailable:true},work);else await work({fallback:true})}finally{busy=false;if(token===generation)await refreshStable();emit('sync-finished',{ns,token})}
}

 dialog.setAttribute('aria-labelledby','dialog-title');$('#dialog-actions').innerHTML=`<button value="cancel" autofocus>${esc(cancelLabel)}</button><button id="dialog-confirm" type="button" class="danger">${esc(confirmLabel)}</button>`;
 $('#dialog-confirm').onclick=async()=>{dialog.close();await onConfirm()};
 dialog.addEventListener('close',()=>{previous?.isConnected&&previous.focus()},{once:true});dialog.showModal();
}

async function runScenario(){

 if(value==='changes'){revision=2;await repo.control('sourceRevision',revision);setMessage(t('sourceChanged'));await synchronize();return}
 if(value==='offline'){offline=true;pauseRequested=true;setMessage(t('offlineNote'),'warning')}
 if(value==='online'){offline=false;setMessage(t('online'));await synchronize();return}
 if(value==='read-fail'){failRead=true;await synchronize();return}
 if(value==='storage-abort'){abortNext=true;setMessage(t('transactionTest'),'warning')}
 if(value==='denied'){generation++;pauseRequested=true;denial=true;unlocked=false;selected=null;view=null;note='';await repo.control('denied:'+ns,true);setMessage(t('denied'),'error')}
 if(value==='expired'||value==='clock'){generation++;pauseRequested=true;unlocked=false;selected=null;expired=value==='expired';clockBad=value==='clock';setMessage(t(value==='clock'?'clock':'expired'),'warning')}
 if(value==='scope'){generation++;pauseRequested=true;ns=ns===SCOPE_A?SCOPE_B:SCOPE_A;selected=null;view=null;prefix='';after=null;previousCursors=[];note='';month='2026-11';selectedDay='';denial=Boolean(await repo.control('denied:'+ns));unlocked=!denial;setMessage(ns===SCOPE_B?t('scopeNote'):t('workspace'));await render();await synchronize();return}
 if(value==='cursor'){generation++;pauseRequested=true;for(const m of await repo.summaries(ns))if(m.pending)await repo.discardStaging(ns,m.dataset);revision++;await repo.control('sourceRevision',revision);setMessage(t('cursorExpired'),'warning')}
 if(value==='unknown'||value==='confirmed-read-fail'){
   const prior=await repo.operation(ns);if(prior?.status!=='unknown')await repo.operation(ns,{id:'review-op-'+crypto.randomUUID(),status:value==='unknown'?'unknown':'confirmed',receipt:value==='unknown'?null:'fictional-committed-receipt'});
   route='home';history.replaceState(null,'','#home');
 }
 await refreshStable();
}

 if(id==='reopen'){location.reload();return}
 if(id==='reset-preview'){await modal(t('reset'),t('resetBody'),t('reset'),async()=>{generation++;pauseRequested=true;await wait(550);await repo.reset();location.reload()});return}
 if(id==='clear-local'){await modal(t('clearConfirm'),t('clearBody'),t('confirmClear'),async()=>{await repo.clearReplicas(ns);selected=null;await render()});return}
 if(id==='next'&&view?.more){previousCursors.push(after);after=view.next;await render();return}
 if(id==='previous'&&previousCursors.length){after=previousCursors.pop();await render();return}
 if(id==='all-days'){selectedDay='';after=null;previousCursors=[];await render();return}
 if(id==='check-original'){if(offline){setMessage(t('offlineNote'),'warning');return}await repo.operation(ns,{...operation,status:'confirmed',receipt:'fictional-committed-receipt'});emit('original-reconciled',{id:operation.id});await render();return}
 if(el.dataset.day){selectedDay=el.dataset.day;after=null;previousCursors=[];await render();return}
 if(el.dataset.select){selected={id:el.dataset.select,dataset:route==='people'?'players':month};await refreshStable();document.querySelector(`[data-select="${el.dataset.select}"]`)?.focus({preventScroll:true});if(innerWidth<1280)await modal(t('details'),t('noSelected'),t('close'),async()=>{}, {cancelLabel:t('close')});if(innerWidth<1280){const detail=$('#inspector section').outerHTML;$('#dialog-content').innerHTML=detail;$('#dialog-content h2').id='dialog-title';$('#dialog-actions').innerHTML=`<button autofocus value="close">${esc(t('close'))}</button>`;$('#dialog-actions button').focus()}return}
 }catch(error){emit('ui-error',{reason:error.message});setMessage(t('storageFailure'),'error')}finally{interactions--}
});
document.addEventListener('input',async e=>{if(e.target.id==='working-note')note=e.target.value;if(e.target.id==='player-search'){prefix=e.target.value;after=null;previousCursors=[];await refreshStable()}});
document.addEventListener('change',async e=>{if(e.target.id==='month'){month=e.target.value;after=null;previousCursors=[];selectedDay='';selected=null;await render()}});
document.addEventListener('keydown',e=>{
 if(!menuOpen||$('#dialog').open)return;
 if(e.key==='Escape'){menuOpen=false;labels();$('#menu').focus();e.preventDefault()}
 if(e.key==='Tab'){const items=[...$('#navigation').querySelectorAll('button,a')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}
});
window.addEventListener('hashchange',async()=>{const next=location.hash.slice(1);if(['home','people','calendar','device'].includes(next)&&next!==route){if(!await navigate(next))history.replaceState(null,'','#'+route)}});
window.addEventListener('beforeunload',e=>{if(note.trim()){e.preventDefault();e.returnValue=''}});
async function boot(){
 try{repo=await ReviewRepository.open();enrolled=Boolean(await repo.control('enrolled'));revision=await repo.control('sourceRevision')??1;denial=Boolean(await repo.control('denied:'+ns));
 if(typeof BroadcastChannel!=='undefined'){channel=new BroadcastChannel('academyos-lf-review-invalidation');channel.onmessage=async e=>{if(e.data?.scope===ns&&unlocked&&!busy)await refreshStable()}}
 }catch{storageBlocked=true}await render();
}
// Read-only, synthetic-only diagnostics for the review harness. No app hooks or tokens.
window.localDataReview={get state(){return {ns,route,unlocked,busy:busy||interactions>0,offline,denial,revision,counters:{...counters},localQueries:repo?.localQueries??0,queryTimes:[...repo?.queryTimes??[]],audit:[...audit],summaries:structuredClone(summaries),operation:operation?{id:operation.id,status:operation.status}:null}},database:DB_NAME,fixture:FIXTURE_VERSION};
await boot();
</script>
