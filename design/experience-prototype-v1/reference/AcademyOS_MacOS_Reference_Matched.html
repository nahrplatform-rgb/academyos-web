/* More focused reference-style workspace screens */
.ref-schedule-workspace{display:grid;grid-template-columns:minmax(0,1fr) 285px;min-height:555px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ref-schedule-main{padding:12px 14px 18px;min-width:0}
.ref-schedule-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ref-schedule-inspector{border-inline-start:1px solid var(--line);background:var(--subtle);padding:17px;display:flex;flex-direction:column;min-width:0}
.ref-schedule-inspector .info-title{font-weight:740;font-size:13px}
.ref-schedule-inspector .info-sub{font-size:11px;color:var(--muted);margin-top:5px}
.ref-session-detail{display:flex;justify-content:space-between;font-size:11px;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ref-session-detail .icon{color:var(--muted);width:14px;height:14px}
.ref-session-detail>span:first-child{color:var(--muted);display:flex;align-items:center;gap:8px}
.ref-session-detail strong{font-weight:620}
.ref-calendar.pro{grid-template-rows:32px repeat(8,58px)}
.ref-calendar.pro .cal-cell{padding:6px;font-size:10px}
.ref-calendar.pro .cal-event{cursor:pointer;transition:filter .12s}
.ref-calendar.pro .cal-event:hover{filter:brightness(.97)}
.ref-roster-preview{display:flex;align-items:center;gap:4px;padding:13px 0}
.ref-roster-preview .avatar{width:29px;height:29px;border-radius:50%;font-size:10px;border:2px solid var(--surface);margin-inline-end:-5px;background:linear-gradient(145deg,#efd0bd,#b8bfd4);color:#26354e}
.ref-tabbar{display:flex;gap:13px;border-bottom:1px solid var(--line);margin:0 0 13px}
.ref-tabbar button{border:0;border-bottom:2px solid transparent;background:transparent;padding:11px 4px;font-size:11px;color:var(--muted)}
.ref-tabbar button.active{border-color:var(--blue);color:var(--blue);font-weight:700}
.ref-profile-hero{display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--line);padding-bottom:17px;margin-bottom:18px}
.ref-profile-hero .avatar{width:52px;height:52px;border-radius:50%;font-size:17px}
.ref-profile-hero h2{font-size:17px}
.ref-profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 20px}
.ref-profile-grid .property{border-bottom:1px solid var(--line)}
.ref-profile-grid .property span:last-child{font-weight:600}
.ref-avatar{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:50%;height:32px;width:32px;background:linear-gradient(145deg,#e7c1aa,#b7c8dd);border:1px solid #e3e6ed;color:#20344c;font-size:10px;font-weight:750}
.dark .ref-avatar,.dark .ref-roster-preview .avatar{background:linear-gradient(145deg,#b87b6e,#556b88);color:#f7fafc;border-color:#45566c}
.dark .ref-schedule-inspector{background:#182434}
.dark .ref-calendar .cal-event small{color:#bed0e7}
.dark .search-field{background:#1b2a3c;border-color:#324359}
.dark .search-field input{color:#e9f0fa}
.dark .ref-request-table .type-icon{background:#243d5b;color:#8ab1ff}
.dark .badge-count{background:#344559;color:#dceaff}
.dark .filter.active .badge-count{background:#5d91ed;color:#fff}
.dark .ref-session-detail{border-color:#334254}
@media(max-width:1140px){.ref-schedule-workspace{grid-template-columns:minmax(0,1fr) 220px}.ref-schedule-main{padding:10px}.ref-schedule-inspector{padding:12px}}
@media(max-width:980px){.ref-schedule-workspace{grid-template-columns:1fr}.ref-schedule-inspector{display:none}}

function action(a){if(!a)return;
 if(a.startsWith('goto:')){S.modal=null;navigate(a.substring(5));return}
 if(a.startsWith('modal:')){showModal(a.substring(6));return}
 if(a.startsWith('role:')){setRole(a.substring(5));return}
 if(a.startsWith('filter:')){S.filter=a.substring(7);render();return}
 if(a.startsWith('serviceFilter:')){S.serviceFilter=a.substring(14);render();return}
 if(a.startsWith('child:')){S.guardianChild=a.substring(6);S.modal=null;showToast('Switched to an authorized child (demo)');return}
 if(a.startsWith('openAcademy:')){S.academy=a.substring(12);S.role='owner';navigate('ownerHome');return}
 if(a.startsWith('session:')){S.selectedSession=a.substring(8);showModal('roster');return}
 if(a.startsWith('mark:')){let [id,v]=a.substring(5).split(':');S.attendance[id]=v;S.attendanceSaveState='pending';render();return}
 if(a.startsWith('setupStep:')){const name=a.substring(10);S.setupDone=[...new Set([...S.setupDone,name])];showToast(`${name} marked complete in demo checklist`);return}
 if(a.startsWith('journey:')){const n=+a.substring(8);S.modal=null;switch(n){case 1:setRole('platform');navigate('requests');break;case 2:setRole('manager');navigate('people');break;case 3:setRole('manager');navigate('programs');break;case 4:setRole('trainer');navigate('evaluations');break;case 5:setRole('owner');navigate('familyFinance');break;case 6:setRole('platform');navigate('services');break}return}
 if(a.startsWith('submit:')){submitForm(a.substring(7));return}
 if(a.startsWith('dark:')){S.dark=a.endsWith('on');render();return}
 if(a.startsWith('lang:')){S.lang=a.substring(5);render();return}
 switch(a){
 case 'closeModal':case 'scrim':closeModal();return;
 case 'toggleDark':S.dark=!S.dark;render();return;
 case 'toggleLang':S.lang=S.lang==='en'?'ar':'en';render();return;
 case 'toggleInspector':S.inspector=!S.inspector;render();return;
 case 'filterAcademy':showToast('Type in the search field to filter academy records');return;
 case 'serviceIncident':showModal('serviceIncident');return;
 case 'incidentProposal':reviewAction('incident','INC-014','Observation only','Proposed recovery action requires authorized approval. No service commands are executed.');return;
 case 'programPreview':S.programPreview=true;S.modal=null;navigate('programs');S.programPreview=true;render();return;
 case 'publishProgram':if(!S.programPreview){showToast('Preview dated sessions before publication');return};reviewAction('publishProgram','U16 Boys · Conditioning','Preview checked','Publishing would notify affected people and consume capacity; review the example first.');return;
 case 'calendarView':showToast('Day, week and list layouts are design states in this single-file prototype');return;
 case 'networkIssue':S.syncFlag=!S.syncFlag;showToast(S.syncFlag?'Network issue simulation enabled · saves will not confirm':'Network restored · next save can confirm');return;
 case 'saveAttendance':if(!countUnsaved()){showToast('All current attendance marks are already saved');return}if(S.syncFlag){S.attendanceSaveState='unknown';showToast('Save result unknown · marks have NOT been confirmed on server (simulated)');return};S.attendanceSaved=structuredClone(S.attendance);S.attendanceSaveState='saved';showToast('Saved on server (simulated) · no pending marks');return;
 case 'rosterToAttendance':S.modal=null;S.role='trainer';navigate('attendance');return;
 case 'rescheduleToSchedule':S.modal=null;navigate('schedule');return;
 case 'acceptInvitation':S.invitation='Accepted';S.setupDone=[...new Set([...S.setupDone,'Owner appointment'])];S.modal=null;S.role='owner';navigate('setup');showToast('Invitation accepted in demo; academy setup ready');return;
 case 'useExisting':S.selectedPlayer='p8';S.modal=null;navigate('people');showToast('Existing player record selected · no duplicate created');return;
 case 'createSeparate':if(S.playerDraft?.name){S.players.push({id:'p'+(S.players.length+1),name:S.playerDraft.name,age:12,team:S.playerDraft.team||'U12 Boys',position:'—',status:'Review required',guardian:S.playerDraft.guardian||'Not linked'});}S.modal=null;navigate('people');showToast('Separate sample record created · needs review');return;
 case 'verifyGuardian':S.guardianLinks[S.selectedPlayer]='Verified';S.guardianChild=S.selectedPlayer;S.modal=null;S.role='guardian';navigate('guardianHome');showToast('Guardian verification simulated; authorized child view opened');return;
 case 'evalSubmit':S.evalState='Submitted for review';showToast('Evaluation submitted for review (demo)');return;
 case 'evalReturn':S.evalState='Returned for changes';showToast('Returned with comments (demo)');return;
 case 'evalApprove':if(S.evalState==='Approved'){S.evalState='Published';S.modal=null;navigate('evaluations');showToast('Feedback published to family-visible sample view');return}S.evalState='Approved';showToast('Evaluation approved · publication still required');return;

 case 'sampleExport':{const csv=['Player,Team,Attendance','Omar Khalid,U12 Boys,Present','Liam Brooks,U12 Boys,Present','Noah Wilson,U12 Boys,Pending'].join('\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const link=document.createElement('a');link.href=url;link.download='AcademyOS_sample_export.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),3000);S.modal=null;showToast('Downloaded fictional sample CSV · not real report data');return}
 case 'demoClose':S.modal=null;showToast('Review recorded in visual demo only');return;

 }

function submitForm(type){const form=$('#action-form');if(form&&!form.reportValidity())return;const d=dataFromForm();switch(type){
 case 'createAcademy':{const id='aca'+(S.academies.length+1),n=d.name?.trim()||'Harbor Youth Academy';S.academies.push({id,name:n,city:d.city||'Cairo · Egypt',letter:n[0],plan:'Policy to confirm',players:0,status:'Draft'});S.selected=id;S.modal=null;S.page='academies';S.inspector=true;showToast('Draft academy created · owner still needs invitation');return}

 case 'reject':if(!(d.reason||'').trim()){showToast('Reason required');return}reviewAction('requestDecision',S.selected,d.reason,'Reject selected academy application?');S.modalData.decision='Reject application';return;
 case 'inviteOwner':S.invitation='Sent';S.modal=null;S.setupDone=S.setupDone.filter(x=>x!=='Owner appointment');showToast('Invitation marked SENT, not accepted (demo) · open invitation next');showModal('invitation');return;
 case 'branch':S.setupDone=[...new Set([...S.setupDone,'Add main branch'])];S.modal=null;showToast('Branch setup updated in demo');return;
 case 'program':S.programPreview=true;S.modal=null;navigate('programs');S.programPreview=true;render();showToast('Preview generated · sessions remain draft');return;
 case 'session':S.sessions.push({id:'s'+(S.sessions.length+1),title:d.title||'New session',day:d.date,time:d.time,branch:'Main Branch',pitch:'Unassigned',trainer:'Unassigned',state:'Draft',capacity:'0 / Policy to confirm',color:'purple'});S.modal=null;navigate('schedule');showToast('Draft session added locally');return;
 case 'addPlayer':S.playerDraft=d;showModal('duplicates');return;
 case 'guardianLink':S.guardianLinks[S.selectedPlayer]='Invitation pending';S.modal=null;showModal('guardianVerify');return;
 case 'staff':S.modal=null;showToast('Staff invitation pending acceptance (demo)');return;
 case 'reconcile':S.billState=d.outcome==='Verified as paid'?'Paid':d.outcome==='Rejected / not paid'?'Rejected':'Verification pending';S.modal=null;showToast(`Payment review recorded: ${S.billState} (demo)`);return;
 case 'message':reviewAction('message','Permitted recipient group',d.message||'(empty)','Message preview only. Sending and delivery are distinct; no message is actually sent.');return;
 case 'inventory':reviewAction('inventory',d.item,d.reason||'Stock adjustment','Stock movement proposed; no stock is changed without review.');return;
 case 'privacy':reviewAction('privacy',d.person,d.reason||'Privacy case','Privacy request submitted for review; no deletion or archive occurs.');return;
 case 'planChange':reviewAction('planChange','Selected academy',d.reason||'Requested plan change','Proposed plan change only. Pricing and effective date policy to confirm.');return;
 case 'support':S.modal=null;showToast(`${d.visibility==='Internal note (staff only)'?'Internal note':'Customer reply'} recorded as demo draft`);return;
 case 'substitute':reviewAction('substitute',d.trainer,d.reason||'Coverage issue','Affected assignments and notifications require review.');return;
 default:S.modal=null;showToast('Demo form action saved locally');return;
}}

 <div class="ref-schedule-workspace"><div class="ref-schedule-main"><div class="ref-schedule-head"><div class="ref-view-switch"><button class="active" data-action="goto:schedule">Day</button><button data-action="modal:states">Week</button><button data-action="modal:states">Month</button></div><span class="spacer"></span>${btn(ico('calendar')+' Example day','modal:states','small')} ${btn('Main Branch '+ico('down','sm'),'modal:workspaces','small')}</div><div class="ref-calendar pro">${cells}</div><p class="mini dim mt12">Select a session for roster and attendance details. Publishing or rescheduling requires review.</p></div>
 <aside class="ref-schedule-inspector"><div class="inline">${status('Published')}<span class="mini dim right">Session detail</span></div><h3 class="info-title mt16">U12 Boys</h3><p class="info-sub">Technical Training · Assigned coach Omar Khalid</p><div class="mt12">${[['Time','9:00–10:30 AM','clock'],['Location','Main Pitch 1','home'],['Branch','Main Branch','building'],['Capacity','8 of 16 players','users']].map(([key,val,icon])=>`<div class="ref-session-detail"><span>${ico(icon,'sm')}${key}</span><strong>${val}</strong></div>`).join('')}</div><div class="ref-tabbar mt16"><button class="active" data-action="modal:roster">Players (8)</button><button data-action="modal:roster">Notes</button><button data-action="goto:attendance">Attendance</button></div><div class="mini dim">Roster preview · all 8 records loaded</div><div class="ref-roster-preview">${['OK','LB','NW','EP','MG','LM','AH'].map(x=>`<span class="avatar">${x}</span>`).join('')}<span class="mini dim" style="margin-left:9px">+1</span></div><div class="divider"></div><div class="mini dim">Your branch permissions control available actions. Reschedule consequences: Policy to confirm.</div><div class="spacer"></div>${btn('View roster','modal:roster','primary block')}<div style="height:8px"></div>${btn('Edit session','modal:session','block')}</aside></div>`;
};
inspector=function(){
 if(S.lang==='ar')return _originalInspector();
 if(S.page!=='requests')return _originalInspector();
 const r=S.requests.find(x=>x.id===S.selected)||S.requests[0];if(!r)return '';
 const tab=S.inspectTab||'Overview';
 let content='';
 if(tab==='Overview'){
 content=`<div class="ref-box"><div class="ref-status-row"><span class="mini dim">Request type</span>${status(r.status)}</div><div class="inline" style="gap:9px;margin-top:10px"><span class="type-icon">${ico('file','sm')}</span><div><strong style="font-size:11px">${escapeHtml(r.description)}</strong><p class="ref-small-note" style="margin-top:5px">Submitted ${escapeHtml(r.submitted)} by ${escapeHtml(r.owner)}</p></div></div></div><div class="ref-section"><h3>Academy information</h3>${property('Name',escapeHtml(r.academy))}${property('Country','Egypt · example')}${property('City',escapeHtml(r.city))}${property('Proposed start','01 November 2026')}${property('Main sports','<span class="chip">Football</span> <span class="chip">Basketball</span>')}${property('Players (initial)','120 · example')}${property('Owner account',S.invitation==='Accepted'?'Verified member':S.invitation==='Sent'?'Invitation pending':'Not appointed')}</div><div class="ref-section"><h3>Review checklist</h3>${[['Registration form','Received'],['Trade license','Received'],['Facility photos','Awaiting review']].map(([n,s])=>`<div class="ref-doc">${ico(s==='Received'?'check':'clock','sm')}<span>${n}</span><button data-action="modal:reviewRequest" class="action-link">${s==='Received'?'View':'Review'}</button></div>`).join('')}</div>`;
 } else if(tab==='Documents'){
 content=`<div class="ref-section"><h3>Documents (${r.docs})</h3><p class="ref-small-note">Sample attachment names. Files are not uploaded in this demo.</p><div style="margin-top:12px">${['Registration form.pdf','Trade license.pdf','Facility photos.zip'].map(x=>`<div class="ref-doc">${ico('file','sm')}<span>${x}</span><button class="action-link" data-action="modal:reviewRequest">Review</button></div>`).join('')}</div></div><div class="ref-box">${notice('Verification and approval permissions: Policy to confirm.','info')}</div>`;
 }else{
 content=`<div class="ref-section"><h3>Review history</h3><div class="task-row"><div class="task-icon">${ico('file','sm')}</div><div class="task-info"><b>Request received</b><span>${escapeHtml(r.submitted)} · fictional event</span></div></div><div class="task-row"><div class="task-icon">${ico('eye','sm')}</div><div class="task-info"><b>Awaiting administrative review</b><span>Requires a reason and confirmation</span></div></div></div>`;
 }
 return `<aside class="inspector ref-inspector"><div class="ref-ins-top">${academyMark(r.academy)}<div style="flex:1;min-width:0"><div class="ins-name">${escapeHtml(r.academy)}</div><div class="ins-city">${escapeHtml(r.city)}</div></div><button class="tool-btn" data-action="toggleInspector" aria-label="Close inspector">${ico('close','sm')}</button></div><div class="ins-tabs">${['Overview','Documents','Activity'].map(n=>`<button class="ins-tab ${tab===n?'active':''}" data-action="inspectTab:${n}">${n}${n==='Documents'?` (${r.docs})`:''}</button>`).join('')}</div><div class="ins-content">${content}</div><div class="ref-footer">${btn('Reject','modal:reject','warn')}${btn('Review request','modal:reviewRequest','primary')}</div></aside>`;
};
const _origRender=render;
render=function(){
 _origRender();
 const bar=$('.topbar');if(!bar)return;
 const current=S.page;
 const labelsEn={requests:'Requests',academies:'Academies',services:'Service Health',setup:'Academy Setup',schedule:'Schedule',people:'Players',ownerHome:'Academy',managerHome:'Operations',overview:'Overview',subscriptions:'Subscriptions',attendance:'Attendance'}; const labelsAr={requests:'الطلبات',academies:'الأكاديميات',services:'حالة الخدمات',setup:'إعداد الأكاديمية',schedule:'الجدول',people:'اللاعبون',ownerHome:'الأكاديمية',managerHome:'العمليات',overview:'نظرة عامة',subscriptions:'الاشتراكات',attendance:'الحضور'};const label=(S.lang==='ar'?labelsAr:labelsEn)[current]||current.replace(/([a-z])([A-Z])/g,'$1 $2');
 const context=S.lang==='ar'?(S.role==='platform'?'المنصة':S.role==='guardian'?'العائلة':S.role==='player'?'شخصي':'أكاديمية ريفرسايد'):(S.role==='platform'?'Platform':S.role==='guardian'?'Family':S.role==='player'?'Personal':'Riverside Academy');
 bar.innerHTML=`<div class="traffic"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div><span class="toolbar-icon">${ico('package','sm')}</span><span class="crumb">${context}</span><span class="crumb">${ico('chevron','sm')}</span><span class="top-context">${escapeHtml(label)}</span><span class="spacer"></span><button class="chip" data-action="modal:workspaces" title="Current role and academy">${ico(S.role==='platform'?'shield':'building','sm')} ${S.lang==='ar'?(S.role==='platform'?'مالك المنصة':S.role==='manager'?'ريفيرسايد · الفرع الرئيسي':S.role==='owner'?'ريفيرسايد · المالك':t(roles[S.role].label)):(S.role==='platform'?'Platform Owner':S.role==='manager'?'Riverside · Main Branch':S.role==='owner'?'Riverside · Owner':t(roles[S.role].label))} ${ico('down','sm')}</button><button class="tool-btn" data-action="modal:journeys" title="Guided workflow journeys">${ico('list')}</button><button class="tool-btn" data-action="modal:states" title="States and components">${ico('package')}</button><button class="tool-btn" data-action="toggleDark" title="Light / dark">${ico(S.dark?'sun':'moon')}</button><button class="tool-btn" data-action="toggleLang" title="English / Arabic">${ico('globe')}</button>`;
 const sbHead=$('.sb-head');if(sbHead){sbHead.innerHTML=`<div class="sb-logo">A</div><div class="details"><b style="font-size:15px">AcademyOS</b><div class="mini dim mt8">${S.lang==='ar'?(S.role==='platform'?'إدارة المنصة':'مساحة عمل الأكاديمية'):(S.role==='platform'?'Platform administration':'Academy workspace')}</div></div>`;}
 const nav=$('.sb-nav');if(nav&&S.role==='platform'){
   const ar=S.lang==='ar';const quick=`<div class="nav-group">${ar?'وصول سريع':'Quick Access'}</div><button class="nav-item" data-action="modal:createAcademy">${ico('plus')}<span>${ar?'أكاديمية جديدة':'New academy'}</span></button><button class="nav-item" data-action="modal:support">${ico('headphones')}<span>${ar?'حالة دعم جديدة':'New support case'}</span></button><button class="nav-item" data-action="goto:services">${ico('alert')}<span>${ar?'عرض الحوادث':'View incidents'}</span></button>`;
   nav.insertAdjacentHTML('beforeend',quick);
 }
};
const _refAction=action;
action=function(a){
 if(a.startsWith('inspectTab:')){S.inspectTab=a.split(':')[1];render();return;}
 if(a==='toggleInspector'){S.inspector=!S.inspector;render();return;}
 if(a==='filterAcademy'){showToast('Use the search field or table filters to narrow results.');return;}
 if(a.startsWith('goto:'))S.inspectTab='Overview';
 _refAction(a);
};

render();
</script>
</body>
</html>
