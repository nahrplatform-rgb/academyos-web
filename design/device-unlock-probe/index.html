<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AcademyOS · Device unlock diagnostic</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#1a1e27;color:#edf0f7;font-size:16px;line-height:1.6}*{box-sizing:border-box}body{margin:0}header{background:#171a21;border-block-end:1px solid #414c60;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}main{max-width:860px;padding:32px 24px;margin:auto}h1{font-size:30px;line-height:1.25;margin:0 0 16px}h2{font-size:20px;margin:0 0 12px}p{margin:0 0 14px;color:#b4bed0}section{border:1px solid #414c60;border-radius:12px;background:#242a35;padding:24px;margin:20px 0}.boundary{background:#31324c;color:#c6b7ff}.boundary p{color:inherit}.step{color:#72dbc8;font-size:13px;text-transform:uppercase;letter-spacing:.08em}button{font:inherit;min-height:48px;border:1px solid #65738c;background:#2c3442;color:#edf0f7;border-radius:8px;padding:10px 16px;font-weight:650;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button.primary{background:#edf0f7;color:#171a21;border-color:#edf0f7}button.danger{background:#452d37;color:#ffacb0}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #f3d28c;outline-offset:3px}.actions{display:flex;gap:12px;flex-wrap:wrap}.confirm{display:flex;gap:12px;align-items:flex-start;padding:14px 0}.confirm input{margin:7px 0 0;width:22px;height:22px;flex-shrink:0}.result{padding:16px;background:#202b40;border:1px solid #65738c;border-radius:10px;color:#97c9ff}.result.error{background:#452d37;color:#ffacb0}.result.success{background:#273d32;color:#b1e5bf}dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin:12px 0}dd{margin:0;font-weight:700}dt{color:#b4bed0}details{margin-top:20px}summary{min-height:48px;cursor:pointer;display:flex;align-items:center}li{margin:8px 0}dialog{max-width:520px;width:calc(100vw - 32px);background:#242a35;color:#edf0f7;border:1px solid #65738c;border-radius:12px;padding:24px}dialog::backdrop{background:#0b0e18bb}[hidden]{display:none!important}@media(max-width:600px){header{padding:12px 16px}main{padding:24px 16px}section{padding:18px}h1{font-size:26px}.actions{display:grid}button{width:100%}header button{width:auto}dl{grid-template-columns:minmax(0,1fr)}dd{margin-bottom:10px}}
</style></head><body><header><strong>AcademyOS · <span data-en="Device research" data-ar="اختبار الجهاز"></span></strong><button id="language">العربية</button></header><main>
<p class="step" data-en="Local diagnostic · no AcademyOS account" data-ar="اختبار محلي · دون حساب AcademyOS"></p><h1 data-en="Can this device unlock encrypted offline data?" data-ar="هل يستطيع هذا الجهاز فتح البيانات المشفرة دون إنترنت؟"></h1>
<section class="boundary"><h2 data-en="Fictional test only" data-ar="اختبار اصطناعي فقط"></h2><p data-en="No academy records, login or permissions are changed. Creating the diagnostic passkey adds a real credential for localhost to the provider you choose. You perform that step and any device verification yourself. Do not use your AcademyOS password or enter a code here." data-ar="لا تتغير سجلات الأكاديمية أو دخولها أو صلاحياتها. إنشاء مفتاح الاختبار يضيف اعتماداً حقيقياً لـ localhost إلى موفر تختاره. أنت تنفذ هذه الخطوة والتحقق على جهازك. لا تستخدم كلمة مرور AcademyOS ولا تدخل رمزاً هنا."></p><p data-en="This is not production key storage, a security audit or proof that every device supports this feature." data-ar="هذا ليس مخزن مفاتيح للإنتاج أو تدقيقاً أمنياً أو إثباتاً لدعم جميع الأجهزة لهذه الميزة."></p></section>
<div id="result" class="result" role="status" aria-live="polite"></div>
<section><p class="step" data-en="1 · Check and prepare" data-ar="١ · التحقق والتحضير"></p><h2 data-en="Create one diagnostic passkey" data-ar="إنشاء مفتاح اختبار واحد"></h2><p data-en="The browser/device will ask you to approve. Some passkeys work for sign-in but cannot provide the PRF output needed for this encryption test. If unsupported, nothing falls back to unencrypted storage." data-ar="سيطلب المتصفح أو الجهاز موافقتك. بعض المفاتيح تصلح للدخول لكنها لا توفر خرج PRF اللازم لاختبار التشفير. إذا لم تدعم الميزة فلن نخزن بديلاً غير مشفر."></p><label class="confirm"><input id="consent" type="checkbox"><span data-en="I understand this creates a real diagnostic credential for localhost, using fictional data only." data-ar="أفهم أن هذا ينشئ اعتماد اختبار حقيقياً لـ localhost ببيانات اصطناعية فقط."></span></label><button id="create" class="primary" disabled data-en="Create diagnostic passkey" data-ar="إنشاء مفتاح الاختبار"></button></section>
<section><p class="step" data-en="2 · Save and reopen" data-ar="٢ · الحفظ وإعادة الفتح"></p><h2 data-en="Encrypt a fictional record" data-ar="تشفير سجل اصطناعي"></h2><p data-en="Save a sample, then reload or reopen this same localhost address. If testing without internet, keep the local diagnostic server running. This does not prove the hosted app can cold-launch offline." data-ar="احفظ العينة ثم أعد تحميل عنوان localhost نفسه أو فتحه. للاختبار دون إنترنت أبقِ الخادم المحلي قيد التشغيل. لا يثبت هذا تشغيل التطبيق المستضاف من البداية دون شبكة."></p><div class="actions"><button id="seal" disabled data-en="Save encrypted sample" data-ar="حفظ العينة مشفرة"></button><button id="unlock" disabled data-en="Unlock existing sample" data-ar="فتح العينة المحفوظة"></button><button id="cancel" hidden data-en="Cancel this request" data-ar="إلغاء هذا الطلب"></button></div><p style="margin-top:16px" data-en="Cancel once to check recovery, then try unlocking again. Do not deliberately fail fingerprints repeatedly; a device may require its normal PIN/password recovery." data-ar="ألغِ مرة لاختبار الاسترجاع ثم حاول الفتح مجدداً. لا تتعمد تكرار فشل البصمة؛ قد يحتاج الجهاز طريقة استرجاعه المعتادة بالرمز أو كلمة المرور."></p></section>
<section><h2 data-en="Observed on this browser" data-ar="النتائج على هذا المتصفح"></h2><dl><dt data-en="Browser PRF hint (not credential proof)" data-ar="إشارة دعم PRF في المتصفح (ليست إثباتاً للاعتماد)"></dt><dd id="browser-prf"></dd><dt data-en="Diagnostic credential" data-ar="اعتماد الاختبار"></dt><dd id="credential-status"></dd><dt data-en="PRF available for that credential" data-ar="توفر PRF لهذا الاعتماد"></dt><dd id="prf-status"></dd><dt data-en="Encrypted sample stored" data-ar="العينة المشفرة محفوظة"></dt><dd id="sample-status"></dd><dt data-en="Most recent unlock" data-ar="آخر فتح"></dt><dd id="unlock-status"></dd><dt data-en="Browser connection signal (not a full network test)" data-ar="إشارة اتصال المتصفح (ليست اختبار شبكة كاملاً)"></dt><dd id="network-status"></dd></dl><details><summary data-en="What this test does and does not prove" data-ar="ما يثبته الاختبار وما لا يثبته"></summary><ul><li data-en="Real WebAuthn PRF and browser encryption are used if supported. Public credential metadata, a salt, wrapped key and ciphertext remain in this local test database. No raw PRF output, password, raw data key or telemetry is saved or sent by this page." data-ar="يستخدم الاختبار WebAuthn PRF وتشفير المتصفح إن توفرا. تبقى بيانات اعتماد عامة وملح ومفتاح مغلف ونص مشفر في قاعدة الاختبار المحلية. لا تحفظ أو ترسل الصفحة خرج PRF الخام أو كلمة مرور أو مفتاح بيانات خاماً أو تتبعاً."></li><li data-en="Passkey-provider/device services may have their own behaviour. No native hardware protection, server identity, role access, key-loss recovery or private app readiness is certified." data-ar="قد يكون لخدمات الجهاز أو موفر المفتاح سلوكها الخاص. لا نعتمد حماية عتادية أو هوية خادم أو صلاحيات أدوار أو استرجاع مفاتيح مفقودة أو جاهزية بيانات التطبيق الخاصة."></li><li data-en="Clearing this local sample does not delete the passkey from your device/provider. Remove the localhost diagnostic entry there yourself after the test if desired." data-ar="مسح العينة المحلية لا يحذف المفتاح من الجهاز أو الموفر. يمكنك إزالة اعتماد localhost التجريبي هناك بنفسك بعد الاختبار."></li></ul></details></section>
<button id="clear" class="danger" data-en="Remove local diagnostic data" data-ar="إزالة بيانات الاختبار المحلية"></button>
<dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title" data-en="Remove only local diagnostic data?" data-ar="إزالة بيانات الاختبار المحلية فقط؟"></h2><p data-en="The fictional encrypted sample and public test metadata will be removed. The device/provider passkey remains. AcademyOS data is untouched." data-ar="ستزال العينة المشفرة الاصطناعية وبيانات الاختبار العامة. يبقى المفتاح لدى الجهاز أو الموفر. لا تتأثر بيانات AcademyOS."></p><div class="actions"><button id="clear-cancel" data-en="Keep data" data-ar="الاحتفاظ بالبيانات"></button><button id="clear-confirm" class="danger" data-en="Remove local data" data-ar="إزالة البيانات المحلية"></button></div></dialog>
</main><script type="module">
const $=id=>document.getElementById(id),utf=s=>new TextEncoder().encode(s),bytes=a=>new Uint8Array(a),scope='AcademyOS:fictional-device-unlock:v1';
let lang='en',db,meta=null,envelope=null,busy=false,controller=null,lastUnlock='not_tested',browserPRF=null;
const t=(a,b)=>lang==='en'?a:b,request=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const txDone=tx=>new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error??new Error('Storage failed'));tx.onerror=()=>{}});
function say(en,ar,type=''){ $('result').textContent=t(en,ar);$('result').className='result '+type }
async function read(){if(!db)return;meta=(await request(db.transaction('probe').objectStore('probe').get('meta')))??null;envelope=(await request(db.transaction('probe').objectStore('probe').get('sample')))??null;render()}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-en]').forEach(n=>n.textContent=n.dataset[lang]);$('language').textContent=lang==='en'?'العربية':'English';const supported=Boolean(db&&isSecureContext&&window.PublicKeyCredential&&crypto.subtle&&location.hostname==='localhost');$('consent').disabled=busy||Boolean(meta);$('create').disabled=!supported||busy||Boolean(meta)||!$('consent').checked;$('seal').disabled=!supported||busy||!meta?.enabled;$('unlock').disabled=!supported||busy||!envelope;$('cancel').hidden=!busy;$('clear').disabled=busy||!db||!meta&&!envelope;$('browser-prf').textContent=browserPRF===null?t('Unknown','غير معروف'):browserPRF?t('Browser reports support','المتصفح يعلن الدعم'):t('Browser reports unsupported','المتصفح يعلن عدم الدعم');$('credential-status').textContent=meta?t('Created','أُنشئ'):t('Not created','لم ينشأ');$('prf-status').textContent=!meta?t('Not tested','لم يختبر'):meta.enabled?t('Available','متاح'):t('Unsupported','غير مدعوم');$('sample-status').textContent=envelope?t('Yes · ciphertext','نعم · نص مشفر'):t('No','لا');$('unlock-status').textContent=lastUnlock==='matched'?t('Fictional record matched','تطابق السجل الاصطناعي'):lastUnlock==='refused'?t('Not unlocked · retained','لم يفتح · محفوظ'):t('Not tested this visit','لم يختبر في هذه الزيارة');$('network-status').textContent=navigator.onLine?t('Online signal','إشارة اتصال'):t('Offline signal','إشارة انقطاع')}
async function write(key,value){const tx=db.transaction('probe','readwrite'),done=txDone(tx);tx.objectStore('probe').put(value,key);await done}
async function deriveKey(){
 const credential=await navigator.credentials.get({signal:controller.signal,publicKey:{rpId:'localhost',challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:bytes(meta.id)}],userVerification:'required',extensions:{prf:{eval:{first:bytes(meta.salt)}}},timeout:60000}});
 const output=credential.getClientExtensionResults().prf?.results?.first;if(!output)throw new Error('unsupported');
 const base=await crypto.subtle.importKey('raw',output,'HKDF',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:bytes(meta.salt),info:utf(location.origin+'|'+scope)},base,{name:'AES-GCM',length:256},false,['wrapKey','unwrapKey']);
}
async function run(kind){if(busy)return;busy=true;controller=new AbortController();render();say('Complete the browser/device prompt, or cancel. Existing encrypted data is retained.','أكمل مطالبة المتصفح أو الجهاز، أو ألغها. تبقى البيانات المشفرة الحالية محفوظة.');
 try{
  if(kind==='create'){
   const salt=crypto.getRandomValues(new Uint8Array(32));const credential=await navigator.credentials.create({signal:controller.signal,publicKey:{rp:{id:'localhost',name:'AcademyOS Local Unlock Research'},user:{id:utf(crypto.randomUUID()),name:'fictional-device-test',displayName:'Fictional device test'},challenge:crypto.getRandomValues(new Uint8Array(32)),pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'required',userVerification:'required'},attestation:'none',extensions:{prf:{}},timeout:60000}});
   const next={id:Array.from(new Uint8Array(credential.rawId)),salt:Array.from(salt),enabled:credential.getClientExtensionResults().prf?.enabled===true};await write('meta',next);meta=next;
   if(meta.enabled)say('Diagnostic passkey created with PRF available. You can now save the fictional sample.','أُنشئ مفتاح الاختبار مع توفر PRF. يمكنك الآن حفظ العينة الاصطناعية.','success');else say('Passkey created, but PRF is unavailable for this credential. Encryption test remains disabled. The provider credential still exists.','أُنشئ المفتاح لكن PRF غير متاح له. يبقى اختبار التشفير معطلاً. لا يزال الاعتماد موجوداً لدى الموفر.','error');
  }else if(kind==='seal'){
   const wrapping=await deriveKey(),dataKey=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);const wrapIV=crypto.getRandomValues(new Uint8Array(12)),dataIV=crypto.getRandomValues(new Uint8Array(12)),aad=utf(scope);
   const wrapped=await crypto.subtle.wrapKey('raw',dataKey,wrapping,{name:'AES-GCM',iv:wrapIV,additionalData:aad});const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv:dataIV,additionalData:aad},dataKey,utf(JSON.stringify({fictionalPlayer:'Fictional device demo',mark:'present',originalSave:'fictional-original-save'})));
   const next={version:1,origin:location.origin,wrapIV:Array.from(wrapIV),dataIV:Array.from(dataIV),wrapped:Array.from(new Uint8Array(wrapped)),cipher:Array.from(new Uint8Array(cipher))};await write('sample',next);envelope=next;lastUnlock='not_tested';say('Fictional sample saved as ciphertext. Reload/reopen, then use Unlock existing sample.','حُفظت العينة الاصطناعية كنص مشفر. أعد الفتح ثم استخدم فتح العينة المحفوظة.','success');
  }else{
   if(envelope.origin!==location.origin||envelope.version!==1)throw new Error('incompatible');const wrapping=await deriveKey(),aad=utf(scope);
   const key=await crypto.subtle.unwrapKey('raw',bytes(envelope.wrapped),wrapping,{name:'AES-GCM',iv:bytes(envelope.wrapIV),additionalData:aad},{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(envelope.dataIV),additionalData:aad},key,bytes(envelope.cipher));const record=JSON.parse(new TextDecoder().decode(plain));
   if(record.fictionalPlayer!=='Fictional device demo'||record.mark!=='present'||record.originalSave!=='fictional-original-save')throw new Error('mismatch');lastUnlock='matched';say('Unlocked: the original fictional record matches. No academy record or access was involved.','فُتح السجل الاصطناعي الأصلي وتطابق. لم تستخدم أي سجلات أكاديمية أو صلاحيات.','success');
  }
 }catch(error){lastUnlock='refused';if(kind==='create')say('Credential preparation did not finish here. If the provider completed creation before a local storage failure, its diagnostic passkey may still exist. Check the provider; no encrypted sample is confirmed and nothing is silently removed.','لم يكتمل تحضير الاعتماد هنا. إن أكمل الموفر الإنشاء قبل فشل التخزين المحلي فقد يبقى مفتاح الاختبار لديه. راجع الموفر؛ لم تؤكد عينة مشفرة ولم يمسح شيء بصمت.','error');else say('Not unlocked or saved. Existing encrypted data is retained. If you cancelled, try again when ready. Device verification/PRF/storage failure needs review; this page never resets your passkey or silently clears data.','لم يتم الفتح أو الحفظ. البيانات المشفرة الحالية باقية. إن ألغيت، أعد المحاولة عند الاستعداد. فشل تحقق الجهاز أو PRF أو التخزين يحتاج مراجعة؛ لا تعيد الصفحة ضبط المفتاح ولا تمسح البيانات بصمت.','error')}
 finally{busy=false;controller=null;render()}
}
$('consent').addEventListener('change',render);$('language').onclick=()=>{lang=lang==='en'?'ar':'en';render();say('Local diagnostic only. Create a credential only after the explained Owner handoff.','اختبار محلي فقط. لا تنشئ اعتماداً إلا بعد التسليم المشروح للمالك.')};for(const kind of ['create','seal','unlock'])$(kind).onclick=()=>run(kind);$('cancel').onclick=()=>controller?.abort();window.addEventListener('online',render);window.addEventListener('offline',render);
$('clear').onclick=()=>{$('dialog').showModal();$('clear-cancel').focus()};$('clear-cancel').onclick=()=>{$('dialog').close();$('clear').focus()};$('dialog').addEventListener('cancel',e=>{e.preventDefault();$('dialog').close();$('clear').focus()});$('dialog').addEventListener('keydown',e=>{if(e.key==='Tab'){const a=$('clear-cancel'),b=$('clear-confirm');if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}}});$('clear-confirm').onclick=async()=>{const tx=db.transaction('probe','readwrite'),done=txDone(tx);tx.objectStore('probe').clear();try{await done;meta=null;envelope=null;lastUnlock='not_tested';$('consent').checked=false;$('dialog').close();render();say('Local fictional data removed. The passkey remains in your device/provider; remove that diagnostic credential there yourself if desired.','أزيلت البيانات الاصطناعية المحلية. يبقى المفتاح لدى الجهاز أو الموفر؛ يمكنك إزالة اعتماد الاختبار هناك بنفسك إن أردت.');$('consent').focus()}catch{say('Cleanup failed. Local data has not been confirmed removed.','فشل التنظيف. لم يؤكد حذف البيانات المحلية.','error')}};
try{const r=indexedDB.open('academyos-device-unlock-probe-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('probe');db=await request(r);db.onversionchange=()=>{db.close();db=null;render();say('Diagnostic storage changed. Reload before creating or unlocking; existing data was not intentionally removed.','تغير تخزين الاختبار. أعد التحميل قبل الإنشاء أو الفتح؛ لم تحذف البيانات الحالية عمداً.','error')};await read();if(typeof window.PublicKeyCredential?.getClientCapabilities==='function'){const capabilities=await window.PublicKeyCredential.getClientCapabilities().catch(()=>null);browserPRF=capabilities?.['extension:prf']??null;render()}say('Local diagnostic only. No passkey has been created automatically.','اختبار محلي فقط. لم ينشأ أي مفتاح تلقائياً.')}catch{db=null;render();say('Local test storage is unavailable. No credential creation or encrypted save is enabled.','تخزين الاختبار المحلي غير متاح. لا يتاح إنشاء اعتماد أو حفظ مشفر.','error')}
</script></body></html>
