<script>
const names=[['Alex Demo','أليكس التجريبي'],['Sam Demo','سام التجريبي'],['Jordan Demo','جوردان التجريبي'],['Casey Demo','كيسي التجريبي'],['Taylor Demo','تايلور التجريبي'],['Robin Demo','روبين التجريبي'],['Jamie Demo','جيمي التجريبي'],['Riley Demo','رايلي التجريبي'],['Morgan Demo','مورغان التجريبي'],['Drew Demo','درو التجريبي'],['Avery Demo','أفيري التجريبي'],['Quinn Demo','كوين التجريبي'],['Blair Demo','بلير التجريبي'],['Cameron Demo','كاميرون التجريبي'],['Reese Demo','ريس التجريبي'],['Skyler Demo','سكايلر التجريبي'],['Rowan Demo','روان التجريبي'],['Finley Demo','فينلي التجريبي']];
let s={lang:'en',mode:'dark',actor:'trainer',screen:'schedule',scenario:'normal',players:[],draft:{},selected:null,q:'',filter:'all',loaded:50,phase:'ready',notice:'',op:null,requests:{},history:{},dialog:null};
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),t=(en,ar)=>s.lang==='ar'?ar:en,name=p=>s.lang==='ar'?p.ar:p.name,mark=m=>({present:t('Present','حاضر'),absent:t('Absent','غائب'),unmarked:t('Unmarked','لم يُسجّل')}[m||'unmarked']),btn=(label,action,attrs='')=>'<button data-action="'+action+'" '+attrs+'>'+label+'</button>';
function reset(scenario='normal'){s.scenario=scenario;s.players=Array.from({length:scenario==='large'?120:scenario==='empty'?0:18},(_,i)=>({id:String(i+1),name:names[i%18][0]+(i>=18?' '+(i+1):''),ar:names[i%18][1]+(i>=18?' '+(i+1):''),saved:i===0?'present':i===3?'absent':null,version:i===0||i===3?1:0}));s.draft={};s.selected=null;s.q='';s.filter='all';s.loaded=50;s.phase=scenario==='loading'?'loading':scenario==='failed'?'readfail':scenario==='revoked'?'denied':'ready';s.notice='';s.op=null;s.requests={};s.history={};s.correctionDrafts={};if(s.phase==='denied')s.players=[];for(const p of s.players)if(p.saved)s.history[p.id]=[{from:null,to:p.saved,reason:'',actor:'trainer'}];render()}
const locked=()=>['saving','unknown','confirmedRead'].includes(s.phase),readOnly=()=>['before','closed','cancelled'].includes(s.scenario),selectedCount=()=>Object.keys(s.draft).length;
function summary(){const c={present:0,absent:0,unmarked:0};for(const p of s.players)c[s.draft[p.id]||p.saved||'unmarked']++;return c}
function inspector(){const p=s.players.find(p=>p.id===s.selected);if(!p)return '<div class="eyebrow">'+t('Session context','سياق التدريب')+'</div><h2>'+t('Keep the roster in view.','القائمة أمامك دائماً.')+'</h2><p class="muted small">'+t('Choose attendance in the roster. Select a player name only when you need their saved history or a correction.','اختر الحضور من القائمة. افتح اسم اللاعب فقط لعرض السجل أو التصحيح.')+'</p><dl><dt>'+t('Recording window','فترة التسجيل')+'</dt><dd><bdi>4 Nov 17:00 → 5 Nov 18:00</bdi></dd><dt>'+t('Branch time','توقيت الفرع')+'</dt><dd>'+t('Cairo · Africa/Cairo','القاهرة · Africa/Cairo')+'</dd><dt>'+t('Saved marks','التسجيلات المحفوظة')+'</dt><dd>'+s.players.filter(p=>p.saved).length+' / '+s.players.length+'</dd></dl><section><h3>'+t('Protected history','سجل محفوظ')+'</h3><p class="small muted">'+t('Recorded attendance protects this session’s time, roster and publication. Changing a saved mark uses the correction workflow.','الحضور المحفوظ يحمي الموعد والقائمة والنشر. تغيير تسجيل محفوظ يتطلب مسار التصحيح.')+'</p></section>';
const req=s.requests[p.id];let actions='';if(p.saved&&!readOnly()&&!locked()){if(s.actor==='owner')actions=btn(t('Correct saved mark','تصحيح التسجيل المحفوظ'),'correction:'+p.id);else if(!req)actions=btn(t('Request a correction','طلب تصحيح'),'request:'+p.id);}
let request=req?'<section><h3>'+t('Correction request','طلب التصحيح')+'</h3><p>'+mark(req.from)+' → '+mark(req.to)+'</p><p>'+esc(req.reason)+'</p><span class="tag">'+(req.state==='pending'?t('Awaiting Owner review','بانتظار مراجعة المالك'):req.state==='approved'?t('Approved','مقبول'):t('Rejected','مرفوض'))+'</span>'+(s.actor==='owner'&&req.state==='pending'&&!readOnly()?btn(t('Review request','مراجعة الطلب'),'requestReview:'+p.id):'')+'</section>':'';
return '<div class="eyebrow">'+t('Player attendance','حضور اللاعب')+'</div><h2>'+esc(name(p))+'</h2><span class="tag '+(p.saved||'unmarked')+'">'+mark(p.saved)+'</span><p class="small muted">'+(p.saved?t('Saved record','تسجيل محفوظ'):s.draft[p.id]?t('New choice is not saved yet.','الاختيار الجديد لم يُحفظ بعد.'):t('No attendance has been recorded.','لم يُسجّل حضور بعد.'))+'</p>'+actions+request+'<section><h3>'+t('History','السجل')+'</h3>'+((s.history[p.id]||[]).length?'<ol>'+s.history[p.id].map(h=>'<li>'+mark(h.from)+' → '+mark(h.to)+'<br>'+(h.actor==='trainer'?t('Assigned Trainer','المدرب المعيّن'):h.actor==='reviewer'?t('Different-account Owner','المالك من حساب مختلف'):t('Academy Owner','مالك الأكاديمية'))+(h.reason?'<p>'+esc(h.reason)+'</p>':'')+'</li>').join('')+'</ol>':'<p class="small muted">'+t('No saved marks yet.','لا تسجيلات محفوظة بعد.')+'</p>')+'</section>'}
function message(){if(s.phase==='saving')return '<div class="banner" role="status"><strong>'+t('Saving your register…','جارٍ حفظ الحضور…')+'</strong><p>'+t('Keep this view open. Do not submit again.','ابقَ هنا ولا تُرسل مرة أخرى.')+'</p>'+'</div>';
if(s.phase==='unknown')return '<div class="banner warning" role="alert"><strong>'+t('We couldn’t confirm your save.','تعذر تأكيد الحفظ.')+'</strong><p>'+t('Your changes may have been saved. Check their status before trying again.','قد تكون التغييرات حُفظت. تحقّق قبل المحاولة مرة أخرى.')+'</p>'+btn(t('Check save status','التحقق من حالة الحفظ'),'reconcile')+'</div>';
if(s.phase==='confirmedRead')return '<div class="banner warning" role="alert"><strong>'+t('Your changes were saved.','حُفظت التغييرات.')+'</strong><p>'+t('We couldn’t reload the register. Load the saved result without saving again.','تعذر تحميل القائمة. حمّل النتيجة المحفوظة دون إعادة الحفظ.')+'</p>'+btn(t('Load saved register','تحميل الحضور المحفوظ'),'readSaved')+'</div>';
if(s.phase==='stale')return '<div class="banner warning" role="alert"><strong>'+t('A saved mark changed elsewhere. Nothing from this save was applied.','تغيّر تسجيل من حساب آخر. لم تُطبّق تغييرات هذه المحاولة.')+'</strong><p>'+t('A selected player was recorded by another authorized account. Compare the newer register with your retained choices.','سُجّل أحد اللاعبين المختارين من حساب مخوّل آخر. قارن القائمة الجديدة باختياراتك المحتفظ بها.')+'</p>'+btn(t('Review latest register','مراجعة أحدث قائمة'),'latest')+'</div>';
if(s.notice)return '<div class="banner '+(s.notice==='saved'||s.notice==='corrected'?'success':'warning')+'" role="status">'+({saved:t('Your selected marks are saved. Remaining unmarked players stay unmarked.','حُفظت الاختيارات. من لم يُسجّل يبقى دون تسجيل.'),corrected:t('Correction saved with its reason and history.','حُفظ التصحيح مع السبب والسجل.'),request:t('Request sent for review. Attendance has not changed.','أُرسل الطلب للمراجعة دون تغيير الحضور.'),fenced:t('This save did not happen. Your choices are retained; review them before saving again.','لم يُحفظ هذا الطلب. اختياراتك باقية؛ راجعها قبل الحفظ مجدداً.'),latest:t('Latest register loaded. Your other choices are retained. A changed saved mark must use correction; review the remaining new marks.','حُمّلت القائمة الأحدث. بقية اختياراتك باقية. التسجيل المحفوظ المتغير يحتاج تصحيحاً؛ راجع التسجيلات الجديدة المتبقية.'),deadline:t('The recording window closed. Nothing from this save was applied.','انتهت فترة التسجيل. لم يُطبّق شيء من هذه المحاولة.'),rejected:t('Request rejected. The saved attendance is unchanged.','رُفض الطلب دون تغيير الحضور.')}[s.notice]||'')+'</div>';return ''}
function roster(){if(s.phase==='denied')return '<div class="banner error" role="alert"><h2>'+t('Access is no longer available','لم تعد الصلاحية متاحة')+'</h2><p>'+t('Your session and player details have been cleared. Check your account and workspace.','مُسحت تفاصيل التدريب واللاعبين. تحقّق من الحساب ومساحة العمل.')+'</p></div>';

if(s.phase==='readfail')return '<h1>'+t('Attendance unavailable','الحضور غير متاح')+'</h1><div class="banner error" role="alert">'+t('We couldn’t load this roster. No player is assumed absent.','تعذر تحميل القائمة. لا يُفترض غياب أي لاعب.')+'</div>'+btn(t('Try loading again','إعادة التحميل'),'loaded');
