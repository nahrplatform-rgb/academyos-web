<!doctype html>
<html lang="en" dir="ltr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AcademyOS — working-day behaviour review</title>
<style>
:root{color-scheme:dark;--canvas:#1a1e27;--surface:#242a35;--nav:#171a21;--ink:#edf0f7;--muted:#bdc6d7;--border:#566177;--sky:#a6d6ff;--teal:#9fe6d7;--gold:#f3cf88;--violet:#ded0ff;--coral:#ffb7ac}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.6 system-ui,Arial,Tahoma}button,select,input{font:inherit;color:inherit;background:var(--nav);border:1px solid var(--border);border-radius:8px;padding:10px 14px;min-height:46px}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:3px}.review{padding:16px 24px;border-bottom:1px solid var(--border);background:#31324c}.review p{margin:4px 0}.review-controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-top:12px}label{display:grid;gap:5px}select{max-width:100%}.frame{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:78vh}nav{padding:24px;background:var(--nav)}nav button{display:block;width:100%;text-align:start;margin:12px 0}nav .selected{background:#202b40;color:var(--sky)}main{padding:24px;max-width:1100px;width:100%;margin:auto;align-self:start;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:28px;line-height:1.3;margin:12px 0}h2{font-size:20px}p{overflow-wrap:anywhere}.scope,.small{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px}.card{border:1px solid var(--border);border-radius:12px;padding:20px;background:var(--surface);margin:16px 0}.training{background:#202b40;border-inline-start:4px solid var(--sky)}.attendance{border-inline-start:4px solid var(--teal)}.notice{padding:16px;border-radius:8px;border:1px solid var(--border)}.warning{color:var(--gold)}.failure{color:var(--coral)}.success{color:var(--teal)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.primary{background:var(--ink);color:var(--nav);font-weight:650}.metrics{padding:16px;background:#31324c;border-radius:8px}.metrics strong{display:block;font-size:24px}.item{padding:16px 0;border-bottom:1px solid var(--border)}a{color:var(--sky)}input{width:100%}details{margin-top:20px}summary{cursor:pointer;min-height:44px}.scenario-note{max-width:90ch}footer{padding:20px 24px;color:var(--muted)}@media(max-width:1100px){.grid{grid-template-columns:1fr}}@media(max-width:767px){.frame{grid-template-columns:1fr}nav{display:flex;gap:10px;padding:12px;overflow:auto}nav strong{display:none}nav button{width:auto;flex-shrink:0;margin:0}main{padding:16px}.review{padding:16px}.review-controls label{width:100%}h1{font-size:25px}.top{align-items:start;flex-direction:column}.card{padding:16px}.actions button{flex:1}button{min-height:48px}}
nav,main,aside,section,.review-controls label{min-width:0}select{width:100%;min-width:0}
</style>
<header class="review"><strong id="review-label"></strong><p id="review-note"></p><div class="review-controls"><label><span id="scenario-label"></span><select id="scenario"></select></label><button id="language" type="button">العربية</button><button id="reset" type="button"></button></div></header>
<div class="frame"><nav aria-label="Fictional navigation"><strong>AcademyOS</strong><button id="home" type="button"></button><button id="calendar" type="button"></button><button id="people" type="button"></button></nav><main id="main" tabindex="-1"><div class="top"><div><p class="scope" id="scope"></p><h1 id="title"></h1></div><span class="small" id="zone"></span></div><div class="grid"><section><div id="status" class="notice" role="status" aria-live="polite"></div><div id="task"></div><div class="actions" id="actions"></div></section><aside><div class="metrics"><span id="metric-label"></span><strong id="metric"></strong><span class="small" id="metric-note"></span></div><div class="card"><h2 id="why-title"></h2><p class="scenario-note" id="why"></p></div></aside></div><details><summary id="limits-title"></summary><p id="limits"></p><a href="../../docs/04-engineering/working-day-pilot-architecture.md" id="packet-link"></a></details></main></div><footer id="footer"></footer>
<script>
// Fictional storyboard only. No API, persistence, camera, identity or real operation.
const $=id=>document.getElementById(id);let ar=false,scene='cold',resolved=false,draft='',destination='home';const t=(en,a)=>ar?a:en;
const scenes={
 cold:['First entry','الدخول الأول'],warm:['Return within 30 seconds — proposed','عودة خلال ٣٠ ثانية — مقترح'],aged:['Return after 30 seconds','عودة بعد ٣٠ ثانية'],offline:['Network unavailable','الشبكة غير متاحة'],dirty:['Refresh while typing','تحديث أثناء الكتابة'],unknown:['Save reply lost','فقد رد الحفظ'],confirmed:['Save confirmed; view refresh failed','تأكد الحفظ وتعذر تحديث العرض'],denied:['Access removed','أُزيل الوصول'],storage:['Recovery storage unavailable','تخزين الاسترداد غير متاح']};
function action(text,fn,primary=false,disabled=false){const b=document.createElement('button');b.type='button';b.textContent=text;b.className=primary?'primary':'';b.disabled=disabled;b.onclick=fn;$('actions').append(b)}
function card(title,body,kind='training'){const d=document.createElement('div');d.className='card '+kind;const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=body;d.append(h,p);$('task').append(d)}
function render(){document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';$('review-label').textContent=t('PROPOSED BEHAVIOUR · FICTIONAL STORYBOARD','سلوك مقترح · عرض توضيحي خيالي');$('review-note').textContent=t('Manual story steps. No real login, requests, saves or measured timings. Policies are awaiting your review.','خطوات يدوية. لا تسجيل دخول أو طلبات أو حفظ حقيقي أو قياسات زمنية. السياسات تنتظر مراجعتك.');$('scenario-label').textContent=t('Review a changed state','راجع حالة متغيرة');$('scenario').replaceChildren(...Object.entries(scenes).map(([v,l])=>{const o=new Option(l[ar?1:0],v);o.selected=v===scene;return o}));$('language').textContent=ar?'English':'العربية';$('reset').textContent=t('Restart this story','إعادة بدء الحالة');$('home').textContent=t('Today','اليوم');$('calendar').textContent=t('Calendar','التقويم');$('people').textContent=t('People','الأشخاص');for(const id of ['home','calendar','people'])$(id).className=destination===id?'selected':'';$('scope').textContent=t('Synthetic Academy · Academy Owner','أكاديمية تجريبية · مالك الأكاديمية');$('zone').textContent='Africa/Cairo';$('title').textContent=scene==='unknown'||scene==='confirmed'||scene==='storage'?t('Attendance register','سجل الحضور'):scene==='dirty'?t('New fictional player','لاعب تجريبي جديد'):destination==='calendar'?t('This week','هذا الأسبوع'):destination==='people'?t('People directory','دليل الأشخاص'):t('Your academy today','أكاديميتك اليوم');$('metric-label').textContent=t('Illustrated API budget — not observed traffic','ميزانية طلبات توضيحية — ليست حركة فعلية');$('metric-note').textContent=t('Excludes page/code/identity requests. A failed request may still reach the server.','لا تشمل طلبات الصفحة والكود والهوية. قد يصل الطلب الفاشل إلى الخادم.');$('why-title').textContent=t('What this changes','ما الذي يتغير');$('limits-title').textContent=t('Scope and privacy limits','حدود النطاق والخصوصية');$('limits').textContent=t('Only Owner Home/Calendar summary reuse is proposed. Names, roster rows, profiles, feedback and commands are excluded. No offline private display or write queue. An already open idle page is not guaranteed to learn revocation within 30 seconds. New writes always check current server authority.','المقترح يعيد استخدام ملخصات رئيسية المالك والتقويم فقط. لا يشمل أسماء اللاعبين أو القوائم أو الملفات أو الملاحظات أو الأوامر. لا عرض خاص دون اتصال أو قائمة انتظار للحفظ. لا ضمان لمعرفة الصفحة المفتوحة الخاملة بسحب الصلاحية خلال ٣٠ ثانية. يتحقق كل حفظ جديد من الصلاحية على الخادم.');$('packet-link').textContent=t('Read the complete architecture and policy packet','اقرأ حزمة الهندسة والسياسات كاملة');$('footer').textContent=t('Separate from the factual app review and approved full-design reference. Reload resets the simulation.','منفصل عن مراجعة التطبيق الفعلية ومرجع التصميم المعتمد. إعادة التحميل تمسح المحاكاة.');$('task').replaceChildren();$('actions').replaceChildren();$('status').className='notice';let status='',why='',metric='';
if(scene==='cold'||scene==='aged'){status=resolved?t('Current view checked — fictional response received.','تم التحقق من العرض — استُلم رد خيالي.'):t('Checking the current view. Navigation stays available; private rows wait for the response.','جارٍ التحقق من العرض الحالي. يبقى التنقل متاحاً وتنتظر البيانات الخاصة الرد.');why=t('One resource owner handles the requested task. It does not load every page or fetch Home first for a direct Calendar link.','مالك بيانات واحد يتولى المهمة المطلوبة. لا يحمّل كل الصفحات أو الرئيسية أولاً لرابط تقويم مباشر.');metric=resolved?'1 / 1':t('1 pending','١ قيد الانتظار');if(resolved)card(t('Football · Main Demo Branch','كرة القدم · الفرع التجريبي'),t('One fictional session summary. Open a task for its current authorized detail.','ملخص تدريب خيالي. افتح المهمة لتفاصيلها الحالية المصرح بها.'));else action(t('Deliver fictional read response','تسليم رد القراءة الخيالي'),()=>{resolved=true;render()},true)}
if(scene==='warm'){status=t('Illustration: returning after 8 seconds. Same Owner scope, no invalidation; reuse the permitted summary.','مثال: عودة بعد ٨ ثوانٍ. نفس نطاق المالك بلا تغيير؛ يُستخدم الملخص المسموح.');why=t('The task can reappear without a duplicate data read. This requires P01/P03 approval; it is not implemented by this storyboard.','يمكن أن تظهر المهمة دون قراءة مكررة. يتطلب ذلك قبول P01/P03؛ هذا العرض لا ينفذه في التطبيق.');metric='0';card(t('Football · Main Demo Branch','كرة القدم · الفرع التجريبي'),t('Summary checked 8 seconds ago. Roster/player names are not cached here.','تم التحقق من الملخص منذ ٨ ثوانٍ. لا تُخزن هنا قوائم اللاعبين أو أسماؤهم.'));action(t('Compare an older return','قارن عودة أقدم'),()=>{scene='aged';resolved=false;render()},true)}
if(scene==='offline'){status=t('Current information unavailable. Private rows are hidden; local navigation remains.','المعلومات الحالية غير متاحة. أُخفيت البيانات الخاصة وبقي التنقل.');why=t('No private offline cache is proposed. A failed read must not appear as an empty academy. Retry starts one current read; it does not claim the connection has recovered.','لا تُقترح ذاكرة خاصة دون اتصال. فشل القراءة لا يعني أن الأكاديمية فارغة. إعادة المحاولة تبدأ قراءة ولا تدعي عودة الاتصال.');metric=t('1 failed','١ فشل');$('status').classList.add('warning');action(t('Retry fictional current read','إعادة القراءة الخيالية'),()=>{scene='cold';resolved=false;render()},true)}
if(scene==='dirty'){status=resolved?t('Refresh noticed. Typed name retained; duplicate review must run again before saving.','لوحظ التحديث. بقي الاسم المكتوب؛ يجب مراجعة التكرار قبل الحفظ.'):t('Local input belongs to this task, separately from retrieved records.','الإدخال المحلي يخص هذه المهمة منفصلاً عن البيانات المقروءة.');why=t('A background check cannot overwrite a name or submit it. Leaving requires the existing dirty-task guard. Reload recovery does not promise to restore private input.','لا يكتب التحديث فوق الاسم ولا يرسله. المغادرة تخضع لحماية المدخلات غير المحفوظة. لا وعد باستعادة النص الخاص بعد إعادة التحميل.');metric=t('0 saves','٠ حفظ');const l=document.createElement('label');l.textContent=t('Fictional player name','اسم لاعب خيالي');const input=document.createElement('input');input.id='draft-name';input.value=draft;input.oninput=()=>{draft=input.value};l.append(input);$('task').append(l);action(t('Simulate current-view refresh','محاكاة تحديث العرض'),()=>{resolved=true;render()},true)}
if(scene==='unknown'){status=resolved?t('Original outcome confirmed. The original operation saved; no replacement was sent.','تأكدت نتيجة العملية الأصلية. تم الحفظ دون إرسال بديل.'):t('Save outcome unknown. Check the original operation before another save.','نتيجة الحفظ غير معروفة. تحقق من العملية الأصلية قبل أي حفظ آخر.');why=t('A lost reply is not failure or success. The same scoped operation locator is reconciled under current authority. No generic retry or duplicate marks.','الرد المفقود لا يعني نجاحاً أو فشلاً. يُتحقق من معرف العملية الأصلي بصلاحية حالية دون تكرار التسجيلات.');metric=resolved?t('1 original + 1 check','١ أصلي + ١ تحقق'):t('1 original; unknown','١ أصلي؛ غير معروف');$('status').classList.add(resolved?'success':'warning');if(!resolved)action(t('Deliver original-operation result','تسليم نتيجة العملية الأصلية'),()=>{resolved=true;render()},true);action(t('Save a replacement','حفظ بديل'),()=>{},false,true)}
if(scene==='confirmed'){status=resolved?t('Register view reloaded. The save was already confirmed.','أُعيد تحميل السجل. كان الحفظ مؤكداً بالفعل.'):t('Attendance saved. The updated view could not load. Retry the view, not the save.','تم حفظ الحضور وتعذر تحميل العرض المحدّث. أعد تحميل العرض لا الحفظ.');why=t('Keep confirmed status separate from read failure. Invalidate affected Home counts; do not guess totals from the loaded register.','افصل تأكيد الحفظ عن فشل القراءة. حدّث عدادات الرئيسية المتأثرة ولا تخمن الإجماليات من القائمة المعروضة.');metric=resolved?t('1 save + 2 reads','١ حفظ + ٢ قراءة'):t('1 save + 1 failed read','١ حفظ + ١ قراءة فاشلة');$('status').classList.add('success');if(!resolved)action(t('Deliver retried view response','تسليم رد إعادة تحميل العرض'),()=>{resolved=true;render()},true)}
if(scene==='denied'){status=t('Access unavailable. Previous private rows and speculative work are cleared.','الوصول غير متاح. أُزيلت البيانات الخاصة السابقة والعمل الاستباقي.');why=t('An old result must not repopulate this view. Cached membership cannot grant access. The next allowed step is current workspace verification, not restoring a role.','لا يُسمح لرد قديم بإعادة البيانات. العضوية المخزنة لا تمنح صلاحية. الخطوة التالية تحقق مساحة العمل لا استعادة دور.');metric=t('1 denied','١ مرفوض');$('status').classList.add('failure');action(t('Show current workspace check story','عرض حالة التحقق من مساحة العمل'),()=>{scene='cold';resolved=false;render()},true)}
if(scene==='storage'){status=t('Save not sent. This browser could not retain the original-operation locator. Your choices stay here.','لم يُرسل الحفظ. تعذر الاحتفاظ بمعرف العملية الأصلية في المتصفح. بقيت اختياراتك هنا.');why=t('Recommended uniform fail-closed recovery. Same-tab refresh only works while sessionStorage survives. Closing/clearing storage needs future server discovery; no such guarantee is claimed.','الحماية المقترحة تمنع الإرسال دون هوية استرداد. استرداد التحديث يعمل فقط مع بقاء التخزين. إغلاق التبويب أو مسحه يحتاج آلية خادم لاحقة بلا ضمان حالي.');metric=t('0 writes','٠ كتابة');$('status').classList.add('warning');card(t('18-player register · 2 unsaved selections','سجل ١٨ لاعباً · اختياران غير محفوظين'),t('Selections remain local; none is labelled Saved.','تبقى الاختيارات محلية ولا تظهر كمحفوظة.'),'attendance');action(t('Save selected marks','حفظ الاختيارات'),()=>{},true,true)}
$('status').textContent=status;$('why').textContent=why;$('metric').textContent=metric;}
$('scenario').onchange=e=>{scene=e.target.value;resolved=false;draft='';render()};$('language').onclick=()=>{ar=!ar;render()};$('reset').onclick=()=>{resolved=false;draft='';render()};for(const id of ['home','calendar','people'])$(id).onclick=()=>{destination=id;if(draft){$('status').textContent=t('Unsaved input retained. This storyboard blocks departure; resolve it before changing tasks.','بقي الإدخال غير المحفوظ. يمنع العرض المغادرة حتى معالجة المهمة.');return}scene=id==='people'?'dirty':'cold';resolved=false;render()};render();
</script></html>
