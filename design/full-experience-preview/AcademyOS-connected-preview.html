function deliver(){const p=S.pending;if(!p)return;S.pending=null;if(S.reply==='lost-commit'){p.apply();p.applied=true;S.unknown=p;}else if(S.reply==='lost-no-commit'){S.unknown=p;}else{p.apply();dirty=false;S.noticeKind='success';S.notice=t('Changes saved. This demonstration now shows the confirmed result.','حُفظت التغييرات. تعرض المحاكاة الآن النتيجة المؤكدة.');S.scenario='normal';draftBaseline=null;history.replaceState(null,'','#'+S.view);}render();}

function statePanel(override=''){const busy=asyncPanel();if(busy)return busy;const s=override||S.scenario;if(s==='denied')return `<div class="empty" role="alert">${icon('info')}<h2>${t('This workspace is unavailable','هذه المساحة غير متاحة')}</h2><p>${t('Your current account no longer has access. Choose an available workspace. Private records have been removed from this view.','حسابك الحالي لا يملك الوصول. اختر مساحة متاحة. أُزيلت السجلات الخاصة من هذا العرض.')}</p>${go('workspaces','Choose workspace','اختيار مساحة','primary')}</div>`;if(s==='loading')return `<div role="status" aria-busy="true"><h2>${t('Loading your workspace','جارٍ تحميل مساحتك')}</h2><div class="skeleton"></div><div class="skeleton large"></div><p>${t('Checking current access and saved information.','جارٍ التحقق من الصلاحيات والمعلومات المحفوظة.')}</p></div>`;if(s==='read-failed')return `<div class="empty" role="alert">${icon('info')}<h2>${t('We couldn’t load this view','تعذر تحميل هذا العرض')}</h2><p>${t('Your saved records have not been changed. Try loading again.','لم تتغير سجلاتك المحفوظة. حاول التحميل مجدداً.')}</p>${btn('Try loading again','إعادة التحميل','normal','primary')}</div>`;if(s==='empty'||s==='filtered')return `<div class="empty">${icon('calendar')}<h2>${t(s==='filtered'?'No matching results':'Nothing here yet',s==='filtered'?'لا توجد نتائج مطابقة':'لا يوجد شيء هنا بعد')}</h2><p>${t(s==='filtered'?'Try a different search or clear your filters.':'When an authorized record is available, it will appear here.',s==='filtered'?'جرّب بحثاً مختلفاً أو امسح عوامل التصفية.':'ستظهر السجلات هنا عندما تتوفر وتملك صلاحية عرضها.')}</p>${btn(s==='filtered'?'Clear filters':'Return to example',s==='filtered'?'مسح التصفية':'العودة إلى المثال','normal','primary')}</div>`;if(s==='expired'||s==='recipient')return `<div class="empty" role="alert"><h2>${t(s==='expired'?'This invitation has expired':'Use the invited account',s==='expired'?'انتهت صلاحية هذه الدعوة':'استخدم الحساب المدعو')}</h2><p>${t(s==='expired'?'Ask the academy owner for a new invitation. No access was granted.':'Sign in using the verified address named in the invitation. Signing in alone grants no academy access.',s==='expired'?'اطلب دعوة جديدة من مالك الأكاديمية. لم تُمنح صلاحية.':'سجّل الدخول بالبريد المؤكد المحدد في الدعوة. تسجيل الدخول وحده لا يمنح الوصول.')}</p>${go('signin','Sign in / switch account','الدخول / تبديل الحساب','primary')}</div>`;return '';}
function banners(){let out=S.notice?notice(esc(S.notice),esc(S.notice),S.noticeKind||'success'):'';if(S.scenario==='validation')out+=notice('Please check the highlighted details before continuing. No changes were saved.','يرجى التحقق من التفاصيل قبل المتابعة. لم تُحفظ تغييرات.','danger');if(S.scenario==='stale')out+=notice('This record changed since you reviewed it. Your unsaved choices remain available; load the latest version before reviewing again.','تغير السجل منذ مراجعته. اختياراتك غير المحفوظة موجودة؛ حمّل الأحدث قبل المراجعة مجدداً.','warning')+btn('Load latest version','تحميل أحدث نسخة','normal');if(S.scenario==='blocked')out+=notice('A conflict needs attention. No selected changes can be saved until it is resolved.','يوجد تعارض يحتاج للمراجعة. لن تُحفظ التغييرات المحددة حتى حله.','danger');if(S.scenario==='saved')out+=notice('Saved result · refreshed from the simulated record.','نتيجة محفوظة · محدثة من السجل المحاكى.','success');return out;}
function render(){const focusId=document.activeElement?.id,focusAction=document.activeElement?.dataset?.action;const x=VIEWS[S.view];document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';document.documentElement.dataset.mode=S.mode;document.documentElement.style.setProperty('--accent',`var(--${x[3]})`);document.documentElement.style.setProperty('--tint',`var(--${x[3]}-bg)`);tools();const privateViews=['trainerhome','trainerschedule','attendance','scanner','development','corrections'];const familyViews=['guardianhome','guardiantraining','guardianfeedback'];const roleMismatch=(S.role==='guardian'&&!familyViews.includes(S.view)&&!['workspaces','guardianinvite','welcome','signin','future'].includes(S.view));const scopeDenied=roleMismatch||(S.role==='trainer'&&!S.trainerActive&&privateViews.includes(S.view))||(S.role==='guardian'&&!S.guardianActive&&familyViews.includes(S.view));const restricted=scopeDenied||['denied','loading','empty','filtered','read-failed','expired','recipient','saving'].includes(S.scenario)||S.scenario.startsWith('lost-')||S.pending||S.unknown;const main=restricted?statePanel(scopeDenied?'denied':''):banners()+renderView();$('app').innerHTML=`<header class="topbar"><button class="menu-button icon" data-action="menu" aria-label="${t('Open navigation','فتح التنقل')}">${icon('menu')}</button><a class="brand" href="#${S.role==='guardian'?'guardianhome':S.role==='trainer'?'trainerhome':S.role==='platform'?'platform':'ownerhome'}" data-go="${S.role==='guardian'?'guardianhome':S.role==='trainer'?'trainerhome':S.role==='platform'?'platform':'ownerhome'}"><span class="brand-mark">A</span>AcademyOS</a><div class="crumb">${t('Northfield Academy','أكاديمية نورثفيلد')} / <strong>${t(x[0],x[1])}</strong></div><div class="tools"><span class="role-pill">${roleLabel()}</span>${btn('<span class="mode-full">'+(S.mode==='dark'?'Light mode':'Dark mode')+'</span><span class="mode-short">'+(S.mode==='dark'?'Light':'Dark')+'</span>','<span class="mode-full">'+(S.mode==='dark'?'الوضع الفاتح':'الوضع الداكن')+'</span><span class="mode-short">'+(S.mode==='dark'?'فاتح':'داكن')+'</span>','theme','quiet')}${btn(S.lang==='en'?'العربية':'English',S.lang==='en'?'العربية':'English','language','quiet',S.pending||S.unknown?'disabled':'')}</div></header><div class="workspace" data-role="${S.role}"><nav class="sidebar desktop-nav" aria-label="${t('Workspace navigation','تنقل مساحة العمل')}">${navHTML()}</nav><main id="main" class="content"><button class="context-button" data-action="context" ${restricted?'disabled':''}>${icon('info')}${t('Details & context','التفاصيل والسياق')}</button>${main}</main><aside class="inspector desktop-inspector" aria-label="${t('Contextual inspector','التفاصيل السياقية')}">${restricted?`<h2>${t('Workspace status','حالة المساحة')}</h2><p class="muted">${t('Details appear after current access and saved information are confirmed.','تظهر التفاصيل بعد تأكيد الصلاحية والمعلومات المحفوظة.')}</p>`:renderInspector()}</aside></div>${mobileNav()}`;if(focusId)document.getElementById(focusId)?.focus({preventScroll:true});else if(focusAction)document.querySelector(`[data-action="${CSS.escape(focusAction)}"]`)?.focus({preventScroll:true});}
function roleLabel(){return t(...({owner:['Academy Owner','مالك الأكاديمية'],trainer:['Trainer','مدرب'],guardian:['Guardian','ولي أمر'],platform:['Platform Owner','مالك المنصة']}[S.role]));}
function renderView(){switch(S.view){case'welcome':return welcome();case'signin':return signIn();case'ownerinvite':case'trainerinvite':case'guardianinvite':return invitation();case'workspaces':return workspaces();case'setup':return setup();case'platform':return platform();case'ownerhome':return ownerHome();case'people':return people();case'guardians':return guardianLinks();case'trainers':return trainers();case'training':case'trainerschedule':return training();case'program':return program();case'newprogram':return newProgram();case'planning':return planning();case'publication':return publication();case'change':return change();case'trainerhome':return trainerHome();case'attendance':return attendance();case'corrections':return corrections();case'scanner':return scanner();case'cards':return cards();case'settings':return settings();case'guardianhome':return familyHome();case'guardiantraining':return familyTraining();case'guardianfeedback':return familyFeedback();case'development':return development();case'future':return future();default:return'';}}
function welcome(){return header('Your academy, connected.','أكاديميتك، متصلة.','A clear place for the people, training and progress that matter.','مساحة واضحة للأشخاص والتدريب والتطور.')+`<section class="hero"><div class="eyebrow">AcademyOS</div><h2>${t('Less administration. More time for coaching.','إدارة أبسط. وقت أكثر للتدريب.')}</h2><p>${t('Enter your workspace, or open the academy invitation you received.','ادخل مساحتك أو افتح دعوة الأكاديمية التي تلقيتها.')}</p><div class="actions">${go('signin','Sign in','تسجيل الدخول','primary')}${go('ownerinvite','Review an invitation','مراجعة دعوة')}</div></section><div class="two">${[['sky','Training that stays connected','تدريب مترابط','Programs, dates and attendance in one clear journey.','البرامج والمواعيد والحضور في رحلة واحدة.'],['violet','Progress worth sharing','تطور يستحق المشاركة','Written feedback, reviewed before it reaches families.','ملاحظات مكتوبة تُراجع قبل مشاركتها مع الأسرة.']].map(([c,en,ar,d,a])=>`<section class="card" style="--accent:var(--${c});--tint:var(--${c}-bg)"><div class="eyebrow">${icon(c==='sky'?'calendar':'leaf')}</div><h2>${t(en,ar)}</h2><p class="muted">${t(d,a)}</p></section>`).join('')}</div><p class="preview-note">${t('This proposal covers existing functions and the new connected read-only homes. Future modules are separate.','المقترح يشمل الوظائف الحالية والصفحات الرئيسية الجديدة للقراءة. الوحدات المستقبلية منفصلة.')}</p>`;}
function signIn(){return header('Welcome to AcademyOS','مرحباً بك في AcademyOS','Your identity is separate from academy access.','هويتك منفصلة عن صلاحيات الأكاديمية.')+`<section class="card"><div class="tabs">${btn('Sign in','تسجيل الدخول','auth-tab:signin','',`aria-pressed="${S.authTab!=='signup'}"`)}${btn('Create account','إنشاء حساب','auth-tab:signup','',`aria-pressed="${S.authTab==='signup'}"`)}</div><h2>${t(S.authTab==='signup'?'Create your account':'Sign in to continue',S.authTab==='signup'?'إنشاء حسابك':'سجّل الدخول للمتابعة')}</h2><p>${t('Provider-owned verification will open in the actual app. This preview uses a fictional verified identity. Never enter a real password or code here.','يفتح التحقق الخاص بمزود الهوية في التطبيق الفعلي. يستخدم هذا العرض هوية خيالية مؤكدة. لا تُدخل كلمة مرور أو رمزاً حقيقياً.')}</p><form data-submit="auth-demo">${field('Fictional email','بريد خيالي','demoEmail','alex@example.invalid','email','required pattern=".+@example\\.invalid"')}<div class="actions">${btn('Continue with demo identity','متابعة بهوية العرض','auth-demo','primary')}${go('ownerinvite','Return to invitation','العودة إلى الدعوة')}</div></form></section>`;}
function invitation(){const kind=S.view==='ownerinvite'?'owner':S.view==='trainerinvite'?'trainer':'guardian',accepted=kind==='owner'?S.ownerAccepted:kind==='trainer'?S.trainerAccepted:S.guardianAccepted;const title={owner:['Your Owner invitation','دعوتك كمالك'],trainer:['Your Trainer invitation','دعوتك كمدرب'],guardian:['Your Guardian invitation','دعوتك كولي أمر']}[kind];return header(...title,'Review the exact access before accepting.','راجع الصلاحية المحددة قبل القبول.')+`<section class="card tinted"><div class="eyebrow">${t('Northfield Academy','أكاديمية نورثفيلد')}</div><h2>${kind==='trainer'?'Casey Demo':kind==='guardian'?'Alex Demo':t('Academy Owner','مالك الأكاديمية')}</h2>${badge(accepted?'Accepted':'Verified recipient',accepted?'مقبولة':'المستلم مؤكد',accepted?'success':'module')}<p style="margin-top:20px">${kind==='owner'?t('Initial academy setup authority, across this academy’s branches. Platform authority is not included.','صلاحية إعداد الأكاديمية عبر فروعها. لا تشمل صلاحيات المنصة.'):kind==='trainer'?t('Your Trainer appointment and assigned branch. Published assigned sessions and permitted coaching tasks follow current access checks. No Owner or financial access.','تعيينك كمدرب والفرع المحدد. تظهر التدريبات المنشورة المسندة ومهام التدريب وفق الصلاحية الحالية. لا صلاحية مالك أو وصول مالي.'):t('One approved link to Alex Demo. Only separately enabled published sessions, attendance and feedback are visible. No other players or staff notes.','رابط معتمد واحد مع Alex Demo. تظهر التدريبات والحضور والملاحظات المنشورة المفعّلة بشكل منفصل فقط. لا لاعبين آخرين أو ملاحظات موظفين.')}</p><p class="meta">${t('Invitation is intended for demo.recipient@example.invalid. Verified-recipient acceptance is simulated.','الدعوة مخصصة إلى demo.recipient@example.invalid. قبول المستلم المؤكد محاكاة.')}</p><div class="actions">${accepted?go(kind==='owner'?'setup':kind==='trainer'?'trainerhome':'guardianhome','Open workspace','فتح المساحة','primary'):btn('Review and accept','مراجعة وقبول','accept-invitation:'+kind,'primary')}${go('signin','Use a different account','استخدام حساب آخر')}</div></section>`;}
function workspaces(){return header('Choose your workspace','اختر مساحتك','Choose the academy and role for this visit. Signing in grants no extra authority.','اختر الأكاديمية والدور لهذه الزيارة. الدخول لا يمنح صلاحيات إضافية.')+`<div class="card"><h2>${t('Northfield Academy','أكاديمية نورثفيلد')}</h2><div class="list">${[['ownerhome','Academy Owner','مالك الأكاديمية'],['trainerhome','Trainer · Casey Demo','مدرب · Casey Demo'],['guardianhome','Guardian · Alex Demo','ولي أمر · Alex Demo'],['platform','Platform Owner','مالك المنصة']].map(([v,en,ar])=>`<div class="card" style="margin:12px 0;padding:16px"><div class="section-title" style="margin:0"><strong>${t(en,ar)}</strong>${go(v,'Open workspace','فتح المساحة','primary')}</div></div>`).join('')}</div><p class="meta">${t('The review fixture includes these separate roles. This does not add memberships to any real account.','تتضمن عينة العرض هذه الأدوار المنفصلة. لا تضيف عضويات لأي حساب فعلي.')}</p></div>`;}
function setup(){return header('Start with your academy','ابدأ بأكاديميتك','Save your branch, sport and timezone. Return whenever you need to finish.','احفظ الفرع والرياضة والمنطقة الزمنية، ثم أكمل في أي وقت.')+`<ol class="stepper"><li class="current"><b>1</b>${t('Branch & timezone','الفرع والمنطقة الزمنية')}</li><li><b>2</b>${t('Sport','الرياضة')}</li></ol><form class="card" data-submit="setup-save">${field('Branch name','اسم الفرع','branch',S.setup.branch,'text','required maxlength="120"')}<label>${t('Branch timezone','المنطقة الزمنية للفرع')}<select name="timezone"><option value="Africa/Cairo">${t('Cairo time · Africa/Cairo','توقيت القاهرة · Africa/Cairo')}</option><option value="Asia/Riyadh">${t('Riyadh time · Asia/Riyadh','توقيت الرياض · Asia/Riyadh')}</option></select></label><p class="meta">${t('Times are interpreted in this branch’s timezone. The stored IANA zone remains available in details.','تُفسَّر المواعيد بمنطقة الفرع الزمنية. يظهر معرّف المنطقة في التفاصيل.')}</p>${field('Sport name','اسم الرياضة','sport',S.setup.sport,'text','required')}<div class="actions">${btn('Save setup','حفظ الإعداد','setup-save','primary')}${S.setup.saved?go('ownerhome','Open academy overview','فتح نظرة الأكاديمية','primary'):''}</div></form>${S.setup.saved?notice('Branch, sport and timezone saved. Your academy remains in its current activation state.','حُفظ الفرع والرياضة والمنطقة الزمنية. حالة تفعيل الأكاديمية لم تتغير.','success'):''}`;}
function platform(){return header('Academy admission','قبول الأكاديمية','Manage academy entry and Owner invitations.','إدارة قبول الأكاديميات ودعوات المالك.',btn('Create academy','إنشاء أكاديمية','academy-create','primary'))+notice('Staging demonstration · fictional academies only. No real invitation is sent.','عرض تجريبي · أكاديميات خيالية فقط. لا تُرسل دعوات فعلية.')+`<div class="table-wrap"><table><caption>${t('Admitted academies','الأكاديميات المقبولة')}</caption><thead><tr><th>${t('Academy','الأكاديمية')}</th><th>${t('Owner invitation','دعوة المالك')}</th><th>${t('Setup','الإعداد')}</th></tr></thead><tbody>${[['Northfield Academy',true],['Harbour Demo Academy',false],...(S.academyCreated?[[S.invite.name||'New Demo Academy',false]]:[])].map(([name,ready],i)=>`<tr class="${S.selected?.id===i?'selected':''}"><th>${btn(esc(name),esc(name),'inspect:academy:'+i,'link')}</th><td>${badge(ready?'Accepted':i===1&&S.invitationRevoked?'Revoked':'Pending',ready?'مقبولة':i===1&&S.invitationRevoked?'ملغاة':'بانتظار القبول',ready?'success':i===1&&S.invitationRevoked?'danger':'warning')}</td><td>${t(ready?'Initial setup saved':'Awaiting Owner',ready?'حُفظ الإعداد الأولي':'بانتظار المالك')}</td></tr>`).join('')}</tbody></table></div>`;}
function ownerHome(){return header('Your academy today','أكاديميتك اليوم','Sunday, 1 November · Cairo time','الأحد، ١ نوفمبر · توقيت القاهرة',go('training','Open calendar','فتح التقويم','primary'))+`<div class="hero"><div class="eyebrow">${t('SESSION IN PROGRESS','تدريب جارٍ')}</div><h2>${esc(S.programName)}</h2><p>${sessionLine(S.sessions[0])} · ${t('Main Demo Branch','الفرع الرئيسي التجريبي')}</p><div class="actions">${btn('Open session','فتح التدريب','inspect:session:0','primary')}${go('attendance','Open register','فتح قائمة الحضور')}</div></div><div class="metrics">${metric(S.sessions.filter(x=>x.date==='2026-11-01'&&!x.canceled).length,'Sessions today','تدريبات اليوم')}${metric(S.correction.status==='pending'?1:0,'Correction requests','طلبات التصحيح','gold')}${metric(S.feedback.status==='submitted'?1:0,'Feedback awaiting review','ملاحظات تنتظر المراجعة','coral')}</div><section class="card"><h2>${t('Needs attention','يحتاج انتباهك')}</h2><ul class="list"><li>${go('attendance','Finish today’s attendance register','إكمال حضور اليوم','task')}</li><li>${go('publication','Review unpublished planned dates','مراجعة مواعيد مخططة غير منشورة','task')}</li>${S.feedback.status==='submitted'?`<li>${go('development','Review submitted feedback','مراجعة الملاحظات المرسلة','task')}</li>`:''}${S.correction.status==='pending'?`<li>${go('corrections','Review correction request','مراجعة طلب التصحيح','task')}</li>`:''}</ul></section><div class="two"><section class="card tinted"><h3>${t('Build the next program','خطّط البرنامج التالي')}</h3><p>${t('Set weekday-specific times and review exceptions before saving.','اختر مواعيد مختلفة لكل يوم وراجع الاستثناءات قبل الحفظ.')}</p>${go('newprogram','Create program','إنشاء برنامج')}</section><section class="card" style="background:var(--gold-bg)"><h3>${t('Welcome a player','أضف لاعباً')}</h3><p>${t('Register a fictional player with scoped duplicate review.','سجل لاعباً خيالياً مع مراجعة التكرار.')}</p>${go('people','Open players','فتح اللاعبين')}</section></div>`;}
function people(){if(S.registration.stage!=='directory'&&S.registration.active)return registration();const list=S.players.filter(p=>p.name.toLowerCase().includes(S.search.toLowerCase()));return header('Players','اللاعبون','Find a player, inspect their profile or register someone new.','ابحث عن لاعب أو راجع ملفه أو أضف لاعباً جديداً.',btn('Register player','تسجيل لاعب','registration-start','primary'))+`<div class="filters"><label>${t('Find a player','البحث عن لاعب')}<input id="people-search" type="search" value="${esc(S.search)}" placeholder="${t('Player name','اسم اللاعب')}"></label></div><div class="table-wrap"><table><caption>${t('Fictional player directory','دليل اللاعبين الخياليين')} · ${list.length}</caption><thead><tr><th>${t('Player','اللاعب')}</th><th>${t('Branch','الفرع')}</th><th>${t('Actions','إجراءات')}</th></tr></thead><tbody>${list.map(p=>`<tr class="${S.selected?.type==='player'&&S.selected.id===p.id?'selected':''}"><td>${person(p,'inspect:player:'+p.id)}</td><td>${t('Main Demo Branch','الفرع الرئيسي التجريبي')}</td><td>${btn('Actions','إجراءات','player-menu:'+p.id,'quiet')}</td></tr>`).join('')}</tbody></table></div>${!list.length?notice('No matching players. Clear the search or use another name.','لا يوجد لاعبون مطابقون. امسح البحث أو استخدم اسماً آخر.') :''}<p class="meta">${t('18-player demonstration. Production search and counts must come from scoped server queries, not a loaded subset.','عرض من ١٨ لاعباً. البحث والأعداد الفعلية تأتي من استعلامات محددة الصلاحية، وليس من الجزء المحمّل.')}</p>`;}
function registration(){const r=S.registration;if(r.stage==='duplicates')return header('Review possible duplicates','مراجعة التكرار المحتمل','Compare before you create a separate record. Nothing is merged automatically.','قارن قبل إنشاء سجل منفصل. لا تُدمج السجلات تلقائياً.')+`<div class="two"><section class="card tinted"><h2>${t('New registration','التسجيل الجديد')}</h2><strong>${esc(r.name)}</strong><p>${esc(r.email||t('No contact supplied','لا توجد وسيلة تواصل'))}</p>${badge('Not saved','غير محفوظ','warning')}</section><section class="card"><h2>${t('Possible existing player','لاعب موجود محتمل')}</h2>${person(S.players[0],'duplicate-profile')}<p>${t('Same branch · similar name. A match does not establish identity.','الفرع نفسه · اسم مشابه. التشابه لا يثبت الهوية.')}</p>${btn('View existing profile','عرض الملف الموجود','duplicate-profile')}</section></div><label class="check"><input id="different-player" type="checkbox">${t('I checked: this is a different fictional player.','تحققت: هذا لاعب خيالي مختلف.')}</label><div class="actions">${btn('Review new registration','مراجعة التسجيل الجديد','registration-review','primary')}${btn('Back to details','العودة للتفاصيل','registration-back')}</div>`;if(r.stage==='saved')return header('Player registered','سُجل اللاعب','Your confirmed record is available in the directory.','السجل المؤكد متاح في الدليل.')+`<div class="card tinted"><h2>${esc(r.name)}</h2>${badge('Saved','محفوظ','success')}<div class="actions" style="margin-top:24px">${btn('View player profile','عرض ملف اللاعب','registration-profile','primary')}${btn('Back to players','العودة للاعبين','registration-done')}</div></div>`;return header('Register a player','تسجيل لاعب','Start with the player’s name. Optional contact is unverified and grants no access.','ابدأ باسم اللاعب. التواصل الاختياري غير مؤكد ولا يمنح صلاحية.')+`<form class="card" data-submit="registration-check">${field('Fictional player name','اسم لاعب خيالي','playerName',r.name,'text','required maxlength="120"')}${field('Optional unverified contact','تواصل اختياري غير مؤكد','playerEmail',r.email,'email','pattern=".+@example\\.invalid" placeholder="contact@example.invalid"')}<p class="meta">${t('Use fictional data only. Contact must end in @example.invalid. No player login or family access is created.','استخدم بيانات خيالية فقط. ينتهي البريد بـ @example.invalid. لا يُنشأ دخول للاعب أو وصول للأسرة.')}</p><div class="actions">${btn('Check for duplicates','التحقق من التكرار','registration-check','primary')}${btn('Cancel registration','إلغاء التسجيل','registration-cancel')}</div></form>`;}
function guardianLinks(){const p=S.players[S.profile]||S.players[0];return header('Guardian links','روابط أولياء الأمور',p.name+' · Main Demo Branch',p.name+' · الفرع الرئيسي التجريبي',btn('Invite Guardian','دعوة ولي أمر','invite-guardian','primary'))+`${S.profile===0?`<section class="card"><div class="section-title" style="margin-top:0"><div class="person"><span class="avatar coral">GD</span><div><strong>Guardian Demo</strong><small>guardian@example.invalid</small></div></div>${badge(S.guardianActive?'Active link':'Link ended',S.guardianActive?'رابط نشط':'انتهى الرابط',S.guardianActive?'success':'')}</div><p>${t('Linked to this player only. Published training, own attendance and feedback follow their separately enabled views.','مرتبط بهذا اللاعب فقط. التدريب المنشور والحضور والملاحظات تتبع طرق العرض المفعّلة بشكل منفصل.')}</p><div class="actions">${S.guardianActive?btn('End player link','إنهاء رابط اللاعب','end-guardian','danger'):go('guardianinvite','Review invitation example','عرض مثال الدعوة')}${btn('View link history','عرض تاريخ الرابط','link-history')}</div></section>`:notice('No approved Guardian link for this selected player in this example.','لا يوجد رابط ولي أمر معتمد لهذا اللاعب المحدد في المثال.')}${S.sentInvitation==='guardian'?notice('New invitation pending recipient verification and acceptance. No access is granted by sending alone.','دعوة جديدة تنتظر تحقق المستلم وقبوله. الإرسال وحده لا يمنح الوصول.','warning'):''}`;}

function trainers(){return header('Trainer appointments','تعيينات المدربين','Branch-scoped staff access, separate from Owner authority.','صلاحية موظف محددة بالفرع، منفصلة عن صلاحيات المالك.',btn('Invite Trainer','دعوة مدرب','invite-trainer','primary'))+`<div class="table-wrap"><table><thead><tr><th>${t('Trainer','المدرب')}</th><th>${t('Branch','الفرع')}</th><th>${t('Appointment','التعيين')}</th></tr></thead><tbody><tr><td>${person({id:3,name:'Casey Demo'},'inspect:trainer:3')}</td><td>${t('Main Demo Branch','الفرع الرئيسي التجريبي')}</td><td>${badge(S.trainerActive?'Active':'Ended',S.trainerActive?'نشط':'انتهى',S.trainerActive?'success':'')}</td></tr>${S.sentInvitation==='trainer'?`<tr><td>Jordan Demo</td><td>${t('Main Demo Branch','الفرع الرئيسي التجريبي')}</td><td>${badge('Invitation pending','دعوة معلقة','warning')}</td></tr>`:''}</tbody></table></div><p class="meta">${t('Opening an appointment does not grant access to other staff, salaries or private family data.','فتح تعيين لا يمنح وصولاً لموظفين آخرين أو الرواتب أو بيانات الأسرة الخاصة.')}</p>`;}
function sessionTable(rows,action='inspect:session:'){return `<div class="table-wrap"><table><caption>${t('Dated sessions','التدريبات المؤرخة')} · ${rows.length}</caption><thead><tr><th>${t('Session','التدريب')}</th><th>${t('Time · Cairo','الوقت · القاهرة')}</th><th>${t('State','الحالة')}</th></tr></thead><tbody>${rows.map(s=>`<tr class="${S.selected?.type==='session'&&S.selected.id===s.id?'selected':''}"><th>${btn(dateLabel(s.date),dateLabel(s.date),action+s.id,'link')}<small>${esc(S.programName)}</small></th><td><bdi>${timeLabel(s.time)}–${timeLabel(s.end)}</bdi></td><td>${s.canceled?badge('Cancelled','ملغى','danger'):s.published?badge('Published','منشور','success'):badge('Private draft','مسودة خاصة','module')}${s.moved?badge('Moved','نُقل','warning'):''}</td></tr>`).join('')}</tbody></table></div>`;}
function calendar(rows,family=false){const y=2026+Math.floor((10+S.month)/12),m=((10+S.month)%12+12)%12,first=new Date(Date.UTC(y,m,1)),start=new Date(first);start.setUTCDate(1-first.getUTCDay());return `<div class="section-title"><h2>${new Intl.DateTimeFormat(S.lang==='ar'?'ar-EG':'en-GB',{month:'long',year:'numeric',timeZone:'UTC'}).format(first)}</h2><div class="actions">${btn('Previous','السابق','month:-1')}${btn('Next','التالي','month:1')}</div></div><div class="calendar" aria-label="${t('Monthly session calendar','تقويم التدريب الشهري')}">${weekdays().map(([en,ar])=>`<div class="calendar-head">${t(en.slice(0,3),ar)}</div>`).join('')}${Array.from({length:42},(_,i)=>{const d=new Date(start);d.setUTCDate(start.getUTCDate()+i);const date=d.toISOString().slice(0,10),items=rows.filter(x=>x.date===date);return `<div class="day ${d.getUTCMonth()!==m?'outside':''} ${date==='2026-11-01'?'today':''}"><strong>${d.getUTCDate()}</strong>${items.map(x=>btn(timeLabel(x.time),timeLabel(x.time),(family?'family-session:':'inspect:session:')+x.id,'event'+(x.canceled?' canceled':''),`aria-label="${esc(dateLabel(x.date)+' '+timeLabel(x.time))}"`)).join('')}</div>`;}).join('')}</div><p class="meta">${t('This example contains a complete 40-date fixture. The working calendar will expose continuation whenever its 50-session response page is incomplete.','هذا المثال يحتوي عينة كاملة من ٤٠ تاريخاً. يُظهر التقويم الفعلي المتابعة إذا لم تكتمل صفحة الخمسين تدريباً.')}</p>`;}
function training(){const trainer=S.role==='trainer'||S.view==='trainerschedule',rows=trainer?S.sessions.filter(s=>s.published&&!s.canceled&&S.trainerActive&&s.trainer==='Casey Demo'):S.sessions;return header(trainer?'My sessions':'Training',trainer?'تدريباتي':'التدريب',trainer?'Only your currently assigned published sessions.':'Programs, calendar and planning stay connected.',trainer?'التدريبات المنشورة المسندة إليك حالياً فقط.':'البرامج والتقويم والتخطيط مترابطة.',trainer?'':go('newprogram','Create program','إنشاء برنامج','primary'))+`<div class="tabs">${btn('Weekly agenda','الأجندة الأسبوعية','training-tab:week','',`aria-pressed="${!S.calendar}"`)}${btn('Month calendar','تقويم الشهر','training-tab:month','',`aria-pressed="${S.calendar}"`)}${trainer?'':go('program','Program directory','دليل البرامج')}</div>${!S.trainerActive&&trainer?notice('Your Trainer appointment has ended. No assigned sessions are available.','انتهى تعيينك كمدرب. لا توجد تدريبات مسندة متاحة.','danger'):S.calendar?calendar(rows):`<div class="section-title"><h2>${t('Week of','أسبوع')} ${dateLabel(new Date(Date.UTC(2026,10,1+S.week*7)).toISOString().slice(0,10))}</h2><div class="actions">${btn('Previous week','الأسبوع السابق','week:-1')}${btn('Next week','الأسبوع التالي','week:1')}</div></div>${sessionTable(rows.filter(x=>{const n=(Date.parse(x.date)-Date.UTC(2026,10,1))/86400000;return n>=S.week*7&&n<S.week*7+7;}))}`}<div class="actions">${trainer?go('trainerhome','Back to Today','العودة لليوم'):go('program','Open program','فتح البرنامج')}</div>`;}
function program(){return header(S.programName,S.programName,'One weekly pattern. Every dated session remains individually identifiable.','نمط أسبوعي واحد، وكل تدريب يحتفظ بهويته.',go('planning','Plan the program','تخطيط البرنامج','primary'))+`<div class="metrics">${metric(S.sessions.length,'Dated sessions','تدريبات مؤرخة')}${metric(S.sessions.filter(s=>s.published).length,'Published','منشور')}${metric(S.sessions.filter(s=>s.individual).length,'Individual plans preserved','خطط فردية محفوظة','gold')}</div><div class="card tinted"><div class="eyebrow">${t('Weekly pattern · Cairo time','النمط الأسبوعي · توقيت القاهرة')}</div>${props(weekdays().filter((_,i)=>S.days.includes(i)).map(([en,ar],i)=>[en,ar,`${timeLabel(S.times[S.days[i]][0])}–${timeLabel(S.times[S.days[i]][1])}`]))}<div class="actions" style="margin-top:20px">${go('publication','Review publication','مراجعة النشر')}${go('training','Back to calendar','العودة للتقويم')}</div></div><section><div class="section-title"><h2>${t('Dates & exceptions','التواريخ والاستثناءات')}</h2>${btn('View every date','عرض كل التواريخ','all-dates')}</div>${sessionTable(S.sessions.slice(0,8))}<p class="meta">${t('Showing the first 8 dates of the complete fixture. View every date to inspect the rest.','عرض أول ٨ تواريخ من العينة الكاملة. افتح كل التواريخ لمراجعة الباقي.')}</p></section>`;}
function programCount(){const first=Date.parse(S.from+'T12:00:00Z'),last=Date.parse(S.to+'T12:00:00Z'),span=(last-first)/86400000+1;if(!Number.isFinite(span)||span<=0)return 0;return S.days.reduce((n,d)=>{const offset=(d-new Date(first).getUTCDay()+7)%7;return n+(offset<span?1+Math.floor((span-1-offset)/7):0)},0);}
function newProgram(){const step=S.formStep;return header('Create a training program','إنشاء برنامج تدريب','Build the weekly pattern, review exceptions, then save a private draft.','أنشئ النمط الأسبوعي وراجع الاستثناءات ثم احفظ مسودة خاصة.')+`<ol class="stepper">${[['Details','التفاصيل'],['Weekly times','مواعيد الأسبوع'],['Review & save','المراجعة والحفظ']].map(([en,ar],i)=>`<li class="${step===i+1?'current':''}"><b>${i+1}</b>${t(en,ar)}</li>`).join('')}</ol>${step===1?`<form class="card" data-submit="program-details">${field('Program name','اسم البرنامج','programName',S.programName,'text','required maxlength="160"')}<div class="two">${field('First date · inclusive','أول تاريخ · شامل','from',S.from,'date','required')}${field('Last date · inclusive','آخر تاريخ · شامل','to',S.to,'date','required')}</div><p class="meta">${t('Main Demo Branch · Football · Cairo time. Publication is separate.','الفرع الرئيسي التجريبي · كرة القدم · توقيت القاهرة. النشر منفصل.')}</p><div class="actions">${btn('Continue to weekly times','متابعة للمواعيد الأسبوعية','program-details','primary')}${go('training','Cancel','إلغاء')}</div></form>`:step===2?`<form class="card" data-submit="program-check"><fieldset><legend>${t('Training weekdays','أيام التدريب')}</legend><div class="weekday-grid">${weekdays().map(([en,ar],i)=>`<label class="check"><input type="checkbox" data-day="${i}" ${S.days.includes(i)?'checked':''}>${t(en,ar)}</label>`).join('')}</div></fieldset>${S.days.map(i=>`<fieldset class="schedule-rule"><legend>${t(...weekdays()[i])}</legend><div class="two">${field('Start time','وقت البداية','start-'+i,S.times[i]?.[0]||'17:00','time','required')}${field('End · same day','النهاية · اليوم نفسه','end-'+i,S.times[i]?.[1]||'18:00','time','required')}</div></fieldset>`).join('')}<div class="notice">${t('One program can use different times on each weekday. No overnight or ambiguous local times.','يمكن تحديد مواعيد مختلفة لكل يوم داخل البرنامج. لا مواعيد ليلية عابرة لليوم أو أوقات محلية ملتبسة.')} <strong>${programCount()} ${t('dates estimated','تاريخاً تقديرياً')}</strong></div><div class="actions">${btn('Review sessions','مراجعة التدريبات','program-check','primary')}${btn('Back to details','العودة للتفاصيل','program-step:1')}</div></form>`:`<section class="card"><div class="metrics">${metric(programCount(),'Sessions in period','تدريبات في الفترة')}${metric(S.days.length,'Weekdays','أيام أسبوعية')}${metric(S.checked?0:'—','Blocking exceptions','استثناءات مانعة','gold')}</div><h2>${t('Your weekly schedule','جدولك الأسبوعي')}</h2>${props(S.days.map(i=>[...weekdays()[i],`${timeLabel(S.times[i][0])}–${timeLabel(S.times[i][1])}`]))}${!S.checked?`<div class="notice" role="status"><h3>${t('Checking every date','جارٍ التحقق من كل تاريخ')}</h3><div class="progress"><span style="width:35%"></span></div><p>${t('Save stays unavailable until the complete period and timezone checks finish. Review controls above can deliver the simulated result.','لن يتاح الحفظ حتى اكتمال فحص الفترة والمنطقة الزمنية. أدوات المراجعة أعلاه تُظهر النتيجة المحاكاة.')}</p></div>`:notice('All dates checked. No blocking exceptions in this fictional example.','تم فحص كل التواريخ. لا استثناءات مانعة في المثال الخيالي.','success')}<div class="actions">${btn('View every date','عرض كل التواريخ','proposed-dates')}${btn('Edit weekly times','تعديل المواعيد','program-step:2')}</div><hr><p>${t('Saving creates an Owner-only draft. It does not publish, notify anyone or charge fees.','الحفظ ينشئ مسودة للمالك فقط، ولا ينشر أو يرسل إشعاراً أو يفرض رسوماً.')}</p>${btn('Save draft program','حفظ البرنامج كمسودة','program-save','primary',!S.checked||['blocked','stale'].includes(S.scenario)?'disabled':'')}</section>`}`;}
function planBack(){return ['training','trainerschedule'].includes(S.planFrom)?go(S.planFrom,'Back to calendar','العودة للتقويم'):go('program','Back to program','العودة للبرنامج');}
function planning(){const individual=S.planScope==='date',target=S.sessions[S.activeSession]||S.sessions[1];if(individual&&target.published)return header('Plan this date','تخطيط هذا التاريخ')+notice('This date is published. Withdraw it before editing its plan. Its current published version remains visible until withdrawal is confirmed.','هذا التاريخ منشور. اسحبه قبل تعديل الخطة. تبقى النسخة المنشورة ظاهرة حتى تأكيد السحب.','warning')+go('publication','Review withdrawal','مراجعة السحب','primary')+planBack();return header(individual?'Plan this date':'Plan the program',individual?'تخطيط هذا التاريخ':'تخطيط البرنامج',individual?sessionLine(target).replace(/<[^>]*>/g,''):'Apply shared or weekday-specific choices while preserving individual plans.',individual?sessionLine(target).replace(/<[^>]*>/g,''):'طبّق اختيارات مشتركة أو حسب اليوم مع الحفاظ على الخطط الفردية.')+`<div class="tabs">${btn('Whole program','البرنامج بالكامل','plan-scope:program','',`aria-pressed="${!individual}"`)}${btn('Individual date','تاريخ واحد','plan-scope:date','',`aria-pressed="${individual}"`)}</div><form class="card" data-submit="planning-review">${!individual?`<label>${t('Apply choices','تطبيق الاختيارات')}<select id="plan-style"><option value="shared" ${S.planStyle==='shared'?'selected':''}>${t('Same plan on each eligible date','خطة مشتركة لكل تاريخ مؤهل')}</option><option value="weekday" ${S.planStyle==='weekday'?'selected':''}>${t('Different choices by weekday','اختيارات مختلفة حسب اليوم')}</option></select></label>`:''}${(S.planStyle==='weekday'&&!individual?S.days:['shared']).map(k=>`<fieldset class="schedule-rule"><legend>${k==='shared'?t('Session plan','خطة التدريب'):t(...weekdays()[k])}</legend>${field('Capacity','السعة','capacity-'+k,S.capacity,'number','required min="1" max="1000"')}<label>${t('Assigned Trainer · same branch','المدرب المسند · الفرع نفسه')}<select name="trainer-${k}"><option value="">${t('No Trainer selected','لم يُحدد مدرب')}</option><option ${S.planTrainer==='Casey Demo'?'selected':''}>Casey Demo</option></select></label><fieldset><legend>${t('Fictional players','لاعبون خياليون')}</legend><div class="two">${S.players.slice(0,6).map(p=>`<label class="check"><input name="plan-player-${k}" type="checkbox" value="${p.id}" ${S.planPlayers.includes(p.id)?'checked':''}>${esc(p.name)}</label>`).join('')}</div></fieldset></fieldset>`).join('')}${!individual?notice('The existing individual plan on 1 November is preserved. All other selected changes save together, or none do.','تُحفظ الخطة الفردية الموجودة في ١ نوفمبر. تُحفظ التغييرات الأخرى المحددة كلها معاً أو لا يُحفظ شيء.'):''}<div class="actions">${btn('Review plan changes','مراجعة تغييرات الخطة','planning-review','primary')}${planBack()}</div></form>${S.planSaved?notice('Plan saved together. Individual overrides are retained.','حُفظت الخطة معاً مع إبقاء الخطط الفردية.','success'):''}`;}
function canPublish(s){return !s.canceled&&!s.published&&s.planned&&!!s.trainer&&(s.trainer!=='Casey Demo'||S.trainerActive);}
function publication(){const withdraw=S.pubKind==='withdraw',eligible=S.sessions.filter(x=>withdraw?x.published&&!x.canceled:canPublish(x)),selected=eligible.filter(x=>S.publicationSelection.includes(x.id));return header(withdraw?'Withdraw sessions':'Publish planned sessions',withdraw?'سحب التدريبات':'نشر التدريبات المخططة','Review visibility and exact affected dates before confirming.','راجع الظهور والتواريخ المتأثرة قبل التأكيد.')+`<div class="tabs">${btn('Publish','نشر','pub-kind:publish','',`aria-pressed="${!withdraw}"`)}${btn('Withdraw','سحب','pub-kind:withdraw','',`aria-pressed="${withdraw}"`)}</div><div class="card tinted"><h2>${t('What changes?','ما الذي سيتغير؟')}</h2><p>${withdraw?t('Assigned Trainers lose visibility of the withdrawn dates on their next request. Attendance-protected dates cannot be withdrawn.','يفقد المدربون المسندون ظهور المواعيد المسحوبة في الطلب التالي. لا تُسحب المواعيد المحمية بالحضور.'):t('Assigned active Trainers can see these published dates and fictional roster names. This does not publish to families, record attendance, send notices or charge fees.','يرى المدربون النشطون المسندون هذه المواعيد وأسماء القائمة الخيالية. لا ينشر هذا للأسر أو يسجل حضوراً أو يرسل إشعاراً أو يفرض رسوماً.')}</p></div><div class="metrics">${metric(selected.length,withdraw?'Dates to withdraw':'Newly visible dates',withdraw?'مواعيد للسحب':'مواعيد ستظهر')}${metric(S.sessions.length-selected.length,'Unchanged dates','مواعيد دون تغيير')}${metric(S.scenario==='blocked'?1:S.sessions.filter(x=>!x.published&&!x.canceled&&x.planned&&!canPublish(x)).length,'Blocked dates','مواعيد محظورة','gold')}</div><div class="actions" style="margin-bottom:20px">${btn('Select eligible dates','اختيار المواعيد المؤهلة','pub-select-all')}${btn('Clear selection','مسح الاختيار','pub-clear')}</div><div class="card"><h2>${t('Affected dates','المواعيد المتأثرة')}</h2>${eligible.map(s=>`<label class="check"><input type="checkbox" data-publish="${s.id}" ${selected.some(x=>x.id===s.id)?'checked':''} ${withdraw&&s.id===0&&Object.keys(S.marks).length?'disabled':''}><span>${sessionLine(s)} ${s.individual?badge('Individual plan retained','خطة فردية محفوظة','module'):''}</span></label>`).join('')||`<p>${t('No eligible dates for this action.','لا توجد مواعيد مؤهلة لهذا الإجراء.')}</p>`}</div><div class="savebar"><p>${t('All selected changes commit together after current checks.','تُحفظ التغييرات المحددة معاً بعد التحقق الحالي.')}</p>${btn(withdraw?'Review withdrawal':'Review publication',withdraw?'مراجعة السحب':'مراجعة النشر','publication-review','primary',!selected.length||['blocked','stale'].includes(S.scenario)?'disabled':'')}</div>`;}
function change(){const s=S.sessions[S.activeSession]||S.sessions[4],protectedDate=s.id===0&&Object.keys(S.marks).length>0;return header('Change one session','تغيير تدريب واحد',sessionLine(s).replace(/<[^>]*>/g,''),sessionLine(s).replace(/<[^>]*>/g,''))+`${S.change.done?`<section class="card tinted"><h2>${t(S.change.done==='move'?'Session moved':'Session cancelled',S.change.done==='move'?'نُقل التدريب':'أُلغي التدريب')}</h2><p>${sessionLine(s)}</p><p>${t('Original occurrence identity, roster and history retained.','حُفظت هوية التدريب الأصلية والقائمة والتاريخ.')}</p>${btn('View change history','عرض تاريخ التغيير','change-history')}${go('training','Back to calendar','العودة للتقويم')}</section>`:protectedDate?notice('Attendance has been saved for this session. Schedule, roster and publication changes are protected. Use the separate attendance correction path if needed.','سُجّل حضور لهذا التدريب. الجدول والقائمة والنشر محمية من التغيير. استخدم مسار تصحيح الحضور عند الحاجة.','warning')+go('attendance','Open attendance history','فتح تاريخ الحضور'):s.published?notice('Withdraw this published date before changing it. Existing Trainers retain the published view until withdrawal is confirmed.','اسحب التاريخ المنشور قبل تغييره. يبقى العرض للمدربين حتى تأكيد السحب.','warning')+go('publication','Review withdrawal','مراجعة السحب'):s.canceled?notice('This session is cancelled. Its history remains available; it cannot be moved or replanned here.','التدريب ملغى. يبقى تاريخه متاحاً ولا يُنقل أو يُخطط هنا.')+btn('View change history','عرض تاريخ التغيير','change-history'):`<form class="card" data-submit="change-review"><div class="tabs">${btn('Move session','نقل التدريب','change-kind:move','',`aria-pressed="${S.changeKind!=='cancel'}"`)}${btn('Cancel session','إلغاء التدريب','change-kind:cancel','',`aria-pressed="${S.changeKind==='cancel'}"`)}</div>${S.changeKind==='cancel'?`<div class="readonly">${t('Cancellation retains the record and frees its slot. No makeup, fee change or notification is created.','الإلغاء يحفظ السجل ويحرر الموعد. لا يُنشأ تعويض أو تغيير مالي أو إشعار.')}</div>`:`${field('New date','التاريخ الجديد','changeDate',S.change.date,'date','required')}<div class="two">${field('New start time','وقت البداية الجديد','changeStart',S.change.start,'time','required')}${field('New end time','وقت النهاية الجديد','changeEnd',S.change.end,'time','required')}</div>`}${text('Reason for change','سبب التغيير','changeReason',S.change.reason,'required maxlength="500"')}<div class="actions">${btn('Review before and after','مراجعة قبل وبعد','change-review','primary')}${go('training','Back to schedule','العودة للجدول')}</div></form>`}`;}
function trainerHome(){if(!S.trainerActive)return notice('Your Trainer appointment ended. Private sessions and player details are unavailable.','انتهى تعيينك كمدرب. التدريبات الخاصة وتفاصيل اللاعبين غير متاحة.','danger')+go('workspaces','Choose workspace','اختيار مساحة');return header('Good afternoon, Casey','مساء الخير، Casey','Here’s your coaching day.','هذا يومك التدريبي.',go('trainerschedule','My sessions','تدريباتي'))+`<section class="hero"><div class="eyebrow">${t('TODAY · IN PROGRESS','اليوم · جارٍ الآن')}</div><h2>${esc(S.programName)}</h2><p>${sessionLine(S.sessions[0])}</p><p>${t('Main Demo Branch · 18 fictional players','الفرع الرئيسي التجريبي · ١٨ لاعباً خيالياً')}</p>${badge('Attendance open','الحضور متاح','module')}<div class="actions">${go('attendance','Open attendance','فتح الحضور','primary')}${go('scanner','Scan player cards','مسح بطاقات اللاعبين')}</div></section><div class="two"><section class="card" style="background:var(--violet-bg)"><div class="eyebrow" style="color:var(--violet)">${t('DEVELOPMENT','التطور')}</div><h2>${t('Your feedback draft','مسودة ملاحظاتك')}</h2><p>${t('Alex Demo · continue strengths, focus and next steps.','Alex Demo · أكمل نقاط القوة والتركيز والخطوات التالية.')}</p>${go('development','Continue writing','متابعة الكتابة')}</section><section class="card tinted"><h2>${t('Your requests','طلباتك')}</h2><p>${t(S.correction.status==='pending'?'One correction is awaiting Owner review.':'No correction request is awaiting review.',S.correction.status==='pending'?'طلب تصحيح ينتظر مراجعة المالك.':'لا توجد طلبات تصحيح تنتظر المراجعة.')}</p>${go('corrections','View requests','عرض الطلبات')}</section></div>`;}
function attendance(){const roster=S.players.filter(p=>S.sessions[0].roster.includes(p.id));const count={present:0,absent:0,unmarked:0};roster.forEach(p=>count[S.choices[p.id]||S.marks[p.id]||'unmarked']++);const selected=Object.keys(S.choices).length,rows=roster.filter(p=>p.name.toLowerCase().includes(S.search.toLowerCase())&&(S.registerFilter==='all'||S.registerFilter==='unmarked'&&!S.marks[p.id]&&!S.choices[p.id]||S.registerFilter==='selected'&&S.choices[p.id]||S.registerFilter==='saved'&&S.marks[p.id]));if(S.role==='trainer'&&!S.trainerActive)return notice('Trainer access ended. This register is no longer available.','انتهت صلاحية المدرب. لم تعد القائمة متاحة.','danger');return header('Session attendance','حضور التدريب',`${S.programName} · ${timeLabel('17:00')}–${timeLabel('18:00')} · Cairo time`,`${S.programName} · ${timeLabel('17:00')}–${timeLabel('18:00')} · توقيت القاهرة`,go('scanner','Scan cards','مسح البطاقات'))+`<div class="metrics">${metric(count.present,'Present','حاضر','success')}${metric(count.absent,'Absent','غائب','danger')}${metric(count.unmarked,'Unmarked','غير مسجل','unmarked')}</div><p class="meta">${t('18 players loaded · counts include unsaved selections. Unmarked never means Absent.','حُمّل ١٨ لاعباً · الأعداد تشمل الاختيارات غير المحفوظة. غير المسجل لا يعني غائباً.')}</p><div class="filters"><label>${t('Find a player','البحث عن لاعب')}<input id="roster-search" type="search" value="${esc(S.search)}" placeholder="${t('Name in this roster','اسم في هذه القائمة')}"></label><label>${t('Show','عرض')}<select id="register-filter">${[['all','All players','كل اللاعبين'],['unmarked','Unmarked','غير مسجل'],['selected','Unsaved choices','اختيارات غير محفوظة'],['saved','Saved marks','علامات محفوظة']].map(([v,en,ar])=>`<option value="${v}" ${S.registerFilter===v?'selected':''}>${t(en,ar)}</option>`).join('')}</select></label></div><ul class="roster">${rows.map(p=>{const saved=S.marks[p.id],choice=S.choices[p.id]||'unmarked';return `<li>${person(p,'inspect:player:'+p.id)}${saved?`<div class="actions">${badge(saved==='present'?'Present':'Absent',saved==='present'?'حاضر':'غائب',saved==='present'?'success':'danger')}${badge('Saved','محفوظ')}${btn('Details','تفاصيل','mark-detail:'+p.id)}</div>`:`<div><small>${S.choices[p.id]?t('Not saved','غير محفوظ'):t('No selection','لا اختيار')}</small><div class="status-options" role="group" aria-label="${t('Attendance for ','حضور ')+esc(p.name)}">${[['present','Present','حاضر'],['absent','Absent','غائب'],['unmarked','Unmarked','غير مسجل']].map(([v,en,ar])=>btn(en,ar,'mark:'+p.id+':'+v,'',`data-status="${v}" aria-pressed="${choice===v}"`)).join('')}</div></div>`}</li>`;}).join('')}</ul>${!rows.length?notice('No players match this filter. Other roster marks have not changed.','لا يطابق لاعبون هذه التصفية. لم تتغير علامات اللاعبين الآخرين.') :''}<div class="savebar" ${selected?'':'hidden'}><p>${selected} ${t('selected changes · not saved','تغييرات محددة · غير محفوظة')}</p>${btn('Review register','مراجعة القائمة','register-review','primary',!selected||['blocked','stale'].includes(S.scenario)?'disabled':'')}</div>`;}
function corrections(){const c=S.correction,owner=S.role==='owner';return header(owner?'Attendance reviews':'My correction requests',owner?'مراجعات الحضور':'طلبات تصحيحي','Saved attendance changes only after an authorized decision.','الحضور المحفوظ يتغير فقط بقرار معتمد.',go('attendance','Open register','فتح القائمة'))+`${c.status==='none'?`<section class="card"><h2>${t('No correction request yet','لا يوجد طلب تصحيح بعد')}</h2><p>${t('To review the complete example, open Sam Demo’s saved Absent mark in attendance and request a correction.','لمراجعة المثال الكامل، افتح غياب Sam Demo المحفوظ في الحضور واطلب تصحيحه.')}</p>${go('attendance','Open saved attendance','فتح الحضور المحفوظ','primary')}</section>`:`<section class="card"><div class="section-title" style="margin-top:0"><h2>${esc(S.players[c.player].name)}</h2>${badge(c.status==='pending'?'Awaiting Owner review':c.status==='approved'?'Approved':'Rejected',c.status==='pending'?'بانتظار مراجعة المالك':c.status==='approved'?'مقبول':'مرفوض',c.status==='pending'?'warning':c.status==='approved'?'success':'danger')}</div><div class="before-after"><div><small>${t('Saved mark','العلامة المحفوظة')}</small><strong>${t(c.before==='present'?'Present':'Absent',c.before==='present'?'حاضر':'غائب')}</strong></div><div><small>${t('Requested','المطلوب')}</small><strong>${t(c.to==='present'?'Present':'Absent',c.to==='present'?'حاضر':'غائب')}</strong></div></div>${props([['Reason','السبب',esc(c.reason)],['Requester','مقدم الطلب','Casey Demo · '+t('Trainer','مدرب')],['Deadline','الموعد النهائي',t('24 hours after the session ends','٢٤ ساعة بعد نهاية التدريب')]])}<p class="meta">${t('A different-account Owner reviews the current request, mark and Trainer access. No change occurs while Pending.','يراجع مالك بحساب مختلف الطلب والعلامة وصلاحية المدرب الحالية. لا تغيير أثناء الانتظار.')}</p>${owner&&c.status==='pending'?`<div class="actions" style="margin-top:24px">${btn('Approve correction','قبول التصحيح','correction-approve','primary')}${btn('Reject request','رفض الطلب','correction-reject','danger')}</div>`:''}${c.status!=='pending'?btn('View decision history','عرض تاريخ القرار','correction-history'):''}</section>`}`;}
function scanner(){return header('Scan attendance','مسح الحضور','Recognise the player, match the right session, then show the saved result.','تعرف على اللاعب وطابق التدريب الصحيح ثم اعرض النتيجة المحفوظة.',go('attendance','Open register','فتح القائمة'))+`<div class="scanner-box">${icon('scan')}<div><strong>${t('Camera boundary · design simulation','حد الكاميرا · محاكاة تصميم')}</strong><p>${t('No camera opens here. Use a fictional card below to review the workflow.','لا تُفتح كاميرا هنا. استخدم بطاقة خيالية أدناه لمراجعة المسار.')}</p></div></div><form class="card" style="margin-top:20px" data-submit="scan-card">${field('Fictional card code','رمز بطاقة خيالية','cardCode','DEMO-ALEX-R'+cardState(0).version,'text','required')}<p class="meta">DEMO-ALEX: ${t('already saved','محفوظ سابقاً')} · DEMO-SAM: ${t('saved Absent, correction only','غائب محفوظ، تصحيح فقط')} · DEMO-JORDAN: ${t('one eligible session','تدريب مؤهل واحد')} · DEMO-TAYLOR: ${t('two eligible sessions','تدريبان مؤهلان')} · DEMO-OTHER: ${t('not rostered','ليس في القائمة')}</p><div class="actions">${btn('Read fictional card','قراءة البطاقة الخيالية','scan-card','primary')}${btn('Choose sessions','اختيار التدريبات','scan-scope')}</div></form>${S.scan?`<div class="notice ${S.scan.kind}" role="status"><h2>${esc(S.scan.title)}</h2><p>${esc(S.scan.message)}</p>${S.scan.choices?S.scan.choices.map((x,i)=>btn(i?'Skills · 6:00 PM':'Football · 5:00 PM',i?'مهارات · ٦:٠٠ م':'كرة القدم · ٥:٠٠ م','scan-choice:'+x,'primary')).join(''):btn('Scan next card','مسح البطاقة التالية','scan-next')}</div>`:''}`;}
function cardState(id=S.profile){return S.cards[id]||{active:false,version:0};}
function cards(){const c=cardState(),p=S.players[S.profile];return header('Player card','بطاقة اللاعب',p.name+' · one current card until revoked or replaced.',p.name+' · بطاقة واحدة سارية حتى الإلغاء أو الاستبدال.')+`<div class="sample-card"><span class="avatar gold" style="margin:auto">${esc(p.name.split(' ').map(x=>x[0]).join(''))}</span><h2 style="margin-top:16px">${esc(p.name)}</h2><p>${t('Main Demo Branch','الفرع الرئيسي التجريبي')}</p><div class="sample-qr" aria-label="${t('Decorative specimen, not a scannable credential','نموذج زخرفي وليس رمز وصول قابل للمسح')}"><span>DEMO ONLY</span></div>${badge(c.active?'Card active':'Card revoked',c.active?'البطاقة سارية':'البطاقة ملغاة',c.active?'module':'danger')}<p class="meta" style="margin-top:16px"><code>DEMO-P${p.id}-R${c.version}</code><br>${t('Specimen only. It contains no valid credential or real QR.','نموذج فقط. لا يحتوي رمز وصول أو QR فعلياً.')}</p><div class="actions" style="justify-content:center">${btn('Preview print layout','معاينة الطباعة','card-print')}${btn(c.active?'Replace card':'Issue new card',c.active?'استبدال البطاقة':'إصدار بطاقة جديدة','card-replace')}${c.active?btn('Revoke card','إلغاء البطاقة','card-revoke','danger'):''}</div></div>`;}
function settings(){const selected=S.scanTarget==='academy'?{before:S.before,after:S.after}:S.sessionOverrides[S.scanTarget]||{before:S.before,after:S.after};return header('Attendance settings','إعدادات الحضور','Choose card-scanning margins. Existing session overrides stay unchanged.','حدد مهلة مسح البطاقة. تبقى تجاوزات التدريبات الحالية دون تغيير.')+`<form class="card" data-submit="settings-save"><h2>${t('Scan window','مهلة المسح')}</h2><label>${t('Apply to','تطبيق على')}<select id="scan-target"><option value="academy" ${S.scanTarget==='academy'?'selected':''}>${t('Academy defaults','افتراضيات الأكاديمية')}</option><option value="session-0" ${S.scanTarget==='session-0'?'selected':''}>${t('1 November Football · session override','١ نوفمبر كرة القدم · تجاوز للتدريب')}</option></select></label><div class="two">${field('Minutes before start','دقائق قبل البداية','before',selected.before,'number','required min="0" max="180" step="1"')}${field('Minutes after end','دقائق بعد النهاية','after',selected.after,'number','required min="0" max="180" step="1"')}</div><p>${t('The Owner may set 0–180 whole minutes on either side. A Trainer can only scan an eligible rostered player within current session scope.','يمكن للمالك تحديد ٠–١٨٠ دقيقة صحيحة في كل جانب. يمسح المدرب لاعباً مؤهلاً بالقائمة ضمن نطاق التدريب الحالي فقط.')}</p><p class="meta">${t('This does not change manual attendance’s recording deadline.','هذا لا يغير الموعد النهائي لتسجيل الحضور اليدوي.')}</p>${btn('Review settings','مراجعة الإعدادات','settings-save','primary')}</form>`;}
function familyGate(){return S.guardianActive?'':notice('This player link has ended. Training, attendance and feedback are no longer available to this account.','انتهى رابط اللاعب. لم يعد التدريب والحضور والملاحظات متاحاً لهذا الحساب.','danger')+go('workspaces','Choose an available workspace','اختر مساحة متاحة','primary');}
function childPicker(){return `<label style="max-width:400px">${t('Your linked player','لاعبك المرتبط')}<select id="child-picker"><option value="0" ${S.child===0?'selected':''}>Alex Demo</option><option value="4" ${S.child===4?'selected':''}>Taylor Demo</option></select></label><p class="meta">${t('Two independently approved fictional links, not automatic sibling access.','رابطان خياليان معتمدان بشكل مستقل، وليس وصولاً تلقائياً للأشقاء.')}</p>`;}
function familyHome(){if(!S.guardianActive)return familyGate();const p=S.players[S.child],next=S.sessions.find(x=>x.published&&!x.canceled&&x.roster.includes(S.child)&&x.date>'2026-11-01')||S.sessions.find(x=>x.published&&!x.canceled&&x.roster.includes(S.child));return header('Good afternoon','مساء الخير','Here’s what’s happening with your player.','إليك أخبار لاعبك.')+childPicker()+`<section class="hero"><div class="eyebrow">${t(next?.date==='2026-11-01'?'TODAY’S PUBLISHED TRAINING':'NEXT PUBLISHED TRAINING',next?.date==='2026-11-01'?'التدريب المنشور اليوم':'التدريب المنشور التالي')}</div><h2>${esc(p.name)}</h2>${next?`<p>${sessionLine(next)}</p><p>${t('Main Demo Branch · Football · Cairo time','الفرع الرئيسي التجريبي · كرة القدم · توقيت القاهرة')}</p>${badge(next.date==='2026-11-01'?'In progress':'Scheduled',next.date==='2026-11-01'?'جارٍ الآن':'مجدول','module')}<div class="actions">${btn('View session','عرض التدريب','family-session:'+next.id,'primary')}${go('guardiantraining','See schedule','عرض الجدول')}</div>`:`<p>${t('No published training is available for this linked player. Private drafts are not shown.','لا يوجد تدريب منشور متاح لهذا اللاعب. لا تظهر المسودات الخاصة.')}</p>`}</section><div class="two"><section class="card" style="background:var(--teal-bg)"><div class="eyebrow" style="color:var(--teal)">${t('ATTENDANCE','الحضور')}</div><h2>${t('Your player’s record','سجل لاعبك')}</h2><p>${t('See recorded results and the date they relate to.','اطلع على النتائج المسجلة وتواريخها.')}</p>${go('guardiantraining','View attendance','عرض الحضور')}</section><section class="card" style="background:var(--violet-bg)"><div class="eyebrow" style="color:var(--violet)">${t('DEVELOPMENT','التطور')}</div><h2>${t('Reviewed feedback','ملاحظات مراجعة')}</h2><p>${t(S.feedback.published&&S.child===0?'A published note is ready to read.':'No published feedback is available yet.',S.feedback.published&&S.child===0?'توجد ملاحظة منشورة جاهزة للقراءة.':'لا توجد ملاحظات منشورة بعد.')}</p>${go('guardianfeedback','Open development','فتح التطور')}</section></div><p class="meta">${t('Only this linked player’s permitted information is shown. Staff notes, other rosters and finances remain private.','تظهر المعلومات المسموح بها لهذا اللاعب المرتبط فقط. تبقى ملاحظات الموظفين وقوائم الآخرين والماليات خاصة.')}</p>`;}
function familyTraining(){if(!S.guardianActive)return familyGate();const rows=S.sessions.filter(x=>x.published&&!x.canceled&&x.roster.includes(S.child));return header('Training & attendance','التدريب والحضور','Published sessions and your player’s current result.','التدريبات المنشورة ونتيجة لاعبك الحالية.')+childPicker()+`<div class="tabs">${btn('Upcoming & recorded','القادم والمسجل','family-tab:list','',`aria-pressed="${!S.calendar}"`)}${btn('Calendar','التقويم','family-tab:calendar','',`aria-pressed="${S.calendar}"`)}</div>${S.calendar?calendar(rows,true):`<section class="card"><ul class="list">${rows.map(s=>`<li><button class="task" data-action="family-session:${s.id}"><span><strong>${dateLabel(s.date)}</strong><small>${timeLabel(s.time)}–${timeLabel(s.end)} · ${t('Main Demo Branch','الفرع الرئيسي التجريبي')}</small></span>${badge(s.date>'2026-11-01'?'Scheduled':S.marks[S.child]==='present'?'Present':S.marks[S.child]==='absent'?'Absent':'Awaiting attendance',s.date>'2026-11-01'?'مجدول':S.marks[S.child]==='present'?'حاضر':S.marks[S.child]==='absent'?'غائب':'بانتظار تسجيل الحضور',S.marks[S.child]==='present'&&s.date==='2026-11-01'?'success':'module')}</button></li>`).join('')||`<li>${t('No published sessions in this view.','لا توجد تدريبات منشورة في هذا العرض.')}</li>`}</ul></section>`}`;}
function feedbackReading(f){return `<article class="reading"><h3>${t('Strengths','نقاط القوة')}</h3><p>${esc(f.strength)}</p><h3>${t('Improvement focus','محور التحسين')}</h3><p>${esc(f.focus)}</p><h3>${t('Next steps','الخطوات التالية')}</h3><p>${esc(f.next)}</p></article>`;}
function familyFeedback(){if(!S.guardianActive)return familyGate();return header('Your player’s development','تطور لاعبك','Published, reviewed feedback only.','الملاحظات المنشورة والمراجعة فقط.')+childPicker()+(S.feedback.published&&S.child===0?`<section class="card tinted"><div class="eyebrow">${t('31 October · Completed skills session','٣١ أكتوبر · تدريب مهارات مكتمل')}</div><h2>Alex Demo</h2>${badge('Published feedback','ملاحظات منشورة','module')}${feedbackReading(S.feedback.published)}</section>`:`<div class="card"><h2>${t('No published feedback yet','لا توجد ملاحظات منشورة بعد')}</h2><p>${t('Reviewed feedback appears here after the academy publishes it. Drafts and internal review notes are never shown.','تظهر الملاحظات هنا بعد مراجعتها ونشرها من الأكاديمية. لا تظهر المسودات أو ملاحظات المراجعة الداخلية.')}</p>${go('guardianhome','Back to Home','العودة للرئيسية')}</div>`);}
function feedbackStatus(){const map={draft:['Draft','مسودة'],submitted:['Awaiting review','بانتظار المراجعة'],returned:['Changes requested','تعديلات مطلوبة'],published:['Published','منشور'],withdrawn:['Withdrawn','مسحوب']};return badge(...map[S.feedback.status],S.feedback.status==='published'?'success':S.feedback.status==='submitted'?'warning':'module');}
function development(){const f=S.feedback,owner=S.role==='owner';if(S.role==='guardian')return familyFeedback();if(S.role==='trainer'&&!S.trainerActive)return notice('Trainer access ended. Private feedback is unavailable.','انتهت صلاحية المدرب. الملاحظات الخاصة غير متاحة.','danger');return header(owner?'Development reviews':'Player development',owner?'مراجعات التطور':'تطور اللاعب','Alex Demo · completed skills session · 31 October','Alex Demo · تدريب مهارات مكتمل · ٣١ أكتوبر',btn('View history','عرض التاريخ','feedback-history'))+`<section class="card"><div class="section-title" style="margin-top:0"><div>${person(S.players[0])}</div>${feedbackStatus()}</div><p class="meta">${t('Casey Demo authors; a different-account Owner reviews. No automatic family sharing.','يكتب Casey Demo؛ يراجع مالك بحساب مختلف. لا مشاركة تلقائية مع الأسرة.')}</p>${f.status==='returned'?`<div class="notice warning"><h3>${t('Changes requested','تعديلات مطلوبة')}</h3><p>${esc(f.review)}</p></div>`:''}${!owner&&['draft','returned','withdrawn'].includes(f.status)?`<form data-submit="feedback-save">${text('Strengths','نقاط القوة','strength',f.strength,'required maxlength="2000"')}${text('Improvement focus','محور التحسين','focus',f.focus,'required maxlength="2000"')}${text('Next steps','الخطوات التالية','next',f.next,'required maxlength="2000"')}<div class="savebar"><p>${t('Private draft · not visible to families','مسودة خاصة · لا تظهر للأسرة')}</p>${btn('Save draft','حفظ المسودة','feedback-save')}${btn('Review submission','مراجعة الإرسال','feedback-submit','primary')}</div></form>`:f.strength?`${feedbackReading(f)}<div class="actions">${btn('Family preview','معاينة الأسرة','family-preview')}${owner&&f.status==='submitted'?btn('Publish reviewed feedback','نشر الملاحظات المراجعة','feedback-publish','primary')+btn('Return for changes','إعادة للتعديل','feedback-return'):''}${owner&&f.status==='published'?btn('Withdraw publication','سحب النشر','feedback-withdraw','danger'):''}${!owner&&f.status==='publi function future(){return header('Future modules remain separate','الوحدات المستقبلية منفصلة','This redesign does not invent unfinished operations.','هذا التصميم لا يخترع عمليات غير مكتملة.')+`<section class="card"><ul class="future-list">${[['Finance & payments','الماليات والمدفوعات'],['Messaging & academy contact','المراسلات والتواصل مع الأكاديمية'],['Private media & consent','الوسائط الخاصة والموافقة'],['Manager and Player operational portals','مساحات عمليات المدير واللاعب'],['Offline attendance and native apps','الحضور دون اتصال والتطبيقات الأصلية']].map(([en,ar])=>`<li><h3>${t(en,ar)}</h3>${badge('Future scope · policy and delivery gates remain','نطاق مستقبلي · تبقى قرارات وتسليم','warning')}</li>`).join('')}</ul></section>`;}

function startDraft(){if(!dirty){draftBaseline=Object.fromEntries(draftKeys.map(k=>[k,JSON.parse(JSON.stringify(S[k]))]));}dirty=true;}
function discardDraft(){if(draftBaseline)Object.assign(S,draftBaseline);S.choices={};dirty=false;draftBaseline=null;}
function values(){const f=document.querySelector('#main form');if(!f)return null;if(!f.reportValidity())return null;return new FormData(f);}

function markDetails(id){const p=S.players[id],mark=S.marks[id];if(!mark){inspect('player',id);return;}openDialog(t('Saved attendance','الحضور المحفوظ'),`${person(p)}${props([['Current mark','العلامة الحالية',t(mark==='present'?'Present':'Absent',mark==='present'?'حاضر':'غائب')],['History','التاريخ',t('Initial mark retained · today 5:12 PM','العلامة الأصلية محفوظة · اليوم ٥:١٢ م')]])}<p class="meta">${t('Saved marks cannot be overwritten directly by a Trainer.','لا يستطيع المدرب الكتابة فوق العلامة المحفوظة مباشرة.')}</p>`,btn('Close','إغلاق','close')+btn(S.role==='owner'?'Correct with reason':'Request correction',S.role==='owner'?'تصحيح بسبب':'طلب تصحيح','mark-correct:'+id,'primary'));}

function allDates(proposed=false){const rows=proposed?proposedRows():S.sessions;openDialog(t('Every dated session','كل التدريبات المؤرخة'),`<p>${rows.length} ${t('dates in this fictional preview. Times use Cairo time.','تاريخاً في العرض الخيالي. المواعيد بتوقيت القاهرة.')}</p><div class="table-wrap dates-table"><table><thead><tr><th>${t('Date','التاريخ')}</th><th>${t('Start','البداية')}</th><th>${t('End','النهاية')}</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${dateLabel(s.date)}</td><td><bdi>${timeLabel(s.time)}</bdi></td><td><bdi>${timeLabel(s.end)}</bdi></td></tr>`).join('')}</tbody></table></div>`,btn('Back to summary','العودة للملخص','close'),true);}
function proposedRows(){const rows=[],first=Date.parse(S.from+'T12:00:00Z'),last=Date.parse(S.to+'T12:00:00Z');for(let stamp=first;stamp<=last&&rows.length<5000;stamp+=86400000){const d=new Date(stamp),day=d.getUTCDay();if(S.days.includes(day))rows.push({id:rows.length,date:d.toISOString().slice(0,10),time:S.times[day][0],end:S.times[day][1],published:false,planned:false,individual:false,capacity:0,trainer:'',roster:[]});}return rows;}

function coverageDialog(){openDialog(t('Design coverage & review notes','تغطية التصميم وملاحظات المراجعة'),`<p>${t('Proposed simulation only. Design approval, product implementation, deployment and working acceptance remain separate. Each view has the shared loading/empty/error/denial/unknown scenarios plus its domain workflow.','محاكاة مقترحة فقط. اعتماد التصميم والتنفيذ والنشر والقبول الفعلي مراحل منفصلة. لكل عرض حالات التحميل والفراغ والخطأ والمنع والنتيجة المجهولة ومساره المتخصص.')}</p><ul class="coverage-list">${COVERAGE.map(r=>`<li><strong>${esc(r.id)} · ${t(r.en,r.ar)}</strong><small>${esc(r.journeys.join(', '))} · ${esc(r.actions.join(', ')||'Proposed connected read view')}</small><small>${esc(r.requirements.join(', '))}</small><small>${esc(r.states.join(' → '))}</small></li>`).join('')}</ul><label>${t('Review note for this view','ملاحظة لهذا العرض')}<textarea id="review-note" placeholder="${t('What should change, and why?','ما الذي يجب تغييره ولماذا؟')}"></textarea></label><p class="meta">${t('Notes stay in memory until downloaded; no upload or persistence.','تبقى الملاحظات بالذاكرة حتى تنزيلها؛ لا رفع أو حفظ دائم.')}</p><div class="actions">${btn('Add note','إضافة ملاحظة','note-add')}${btn('Download review notes','تنزيل الملاحظات','notes-download')}</div>`,btn('Close','إغلاق','close'),true);}
